<script>
// نسخهٔ نصب‌شده با هر بار باز شدن آخرین نسخه را از سرور می‌گیرد (sw.js شبکه را مقدم می‌داند)
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {}));
}
