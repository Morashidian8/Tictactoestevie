<title>Renewal Intelligence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: right sidebar (brand-dark) + white top bar + content column; group pages add a 320px assistant column on the left. Phones: drawer, bottom nav, FAB. Tokens follow DESIGN_PROMPT_1. */
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --surface2:#F8F8FD; --line:#E4E6F0; --line2:#EEF0F7; --input-line:#D9DCEA;
  --ink:#161A2E; --ink2:#5F6683; --ink3:#8C92AB;
  --brand-dark:#312E81; --brand:#4F46E5; --brand2:#7C6CF6; --brand-on:#FFFFFF; --focus:0 0 0 3px #DCDAFB; --brand-light:#A5B4FC; --logo:#4F46E5; --hl:#F0EFFE; --soft:#EEF0FF;
  --hero-bg:radial-gradient(70% 120% at 0% 0%,#C084FC 0%,transparent 60%),radial-gradient(60% 120% at 100% 100%,#EC4899AA 0%,transparent 65%),linear-gradient(135deg,#4F46E5,#4338CA);
  --shadow:0 1px 2px rgba(20,20,50,.04),0 8px 24px -12px rgba(20,20,60,.14);
  --sb-bg:#0B3B34; --sb-active:#145247; --sb-dot:#3FD1B3; --sb-text:#C9DBD6; --sb-title:#7FA39A; --sb-line:#1F5B50;
  --inc:#1E7A46; --inc-bg:#E3F3E8; --minor:#55661A; --minor-bg:#EEF2DC; --red:#8A5A00; --red-bg:#FDF0DD;
  --rem:#A3261B; --rem-bg:#FBE7E5; --prot:#1F5590; --prot-bg:#E5EEF8; --keep:#4B5563; --keep-bg:#EEF0F2;
  --good:#1E7A46; --good-bg:#E3F3E8; --mid:#D97706; --mid-ink:#B45F06; --mid-bg:#FDF0DD; --bad:#C0392B; --bad-bg:#FBE7E5;
  --c-urgent:#FDF4F5; --c-opp:#F2FAF5; --c-warn:#FEF8EE; --c-note:#F3F6FD; --note:#1F5590;
  --smp:#8A5A00; --smp-bg:#FFF4DC; --smp-line:#F1D9A6; --danger-line:#F1C9C4;
  --float:0 8px 28px rgba(49,46,129,.18);
  --f:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F1A; --surface:#161927; --surface2:#121522; --line:#262A3D; --line2:#1E2133; --input-line:#2E3350;
  --ink:#E8EAF6; --ink2:#9AA0BD; --ink3:#6F7594; --brand:#8B83FF; --brand2:#B49CFF; --brand-dark:#3A2F9C; --brand-on:#0D0F1A; --focus:0 0 0 3px #2E2A66; --hl:#1F2142; --soft:#22244A; --logo:#6D5CF0;
  --hero-bg:radial-gradient(70% 120% at 0% 0%,#A855F766 0%,transparent 60%),radial-gradient(60% 120% at 100% 100%,#EC489955 0%,transparent 65%),linear-gradient(135deg,#3A2F9C,#1B1747);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --inc:#4FD08A; --inc-bg:#123A2A; --minor:#C3D46A; --minor-bg:#2A3112; --red:#F5B451; --red-bg:#3A2A12;
  --rem:#F07A6C; --rem-bg:#3A1A17; --prot:#8DB8F0; --prot-bg:#152A44; --keep:#A9B4B1; --keep-bg:#1F2C29;
  --good:#4FD08A; --good-bg:#123A2A; --mid:#F5B451; --mid-ink:#F5B451; --mid-bg:#3A2A12; --bad:#F07A6C; --bad-bg:#3A1A17;
  --c-urgent:#24161C; --c-opp:#13261F; --c-warn:#2A2214; --c-note:#151F33; --note:#8DB8F0;
  --smp:#F5B451; --smp-bg:#3A2A12; --smp-line:#5A4318; --danger-line:#5A2620; --float:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F1A; --surface:#161927; --surface2:#121522; --line:#262A3D; --line2:#1E2133; --input-line:#2E3350;
  --ink:#E8EAF6; --ink2:#9AA0BD; --ink3:#6F7594; --brand:#8B83FF; --brand2:#B49CFF; --brand-dark:#3A2F9C; --brand-on:#0D0F1A; --focus:0 0 0 3px #2E2A66; --hl:#1F2142; --soft:#22244A; --logo:#6D5CF0;
  --hero-bg:radial-gradient(70% 120% at 0% 0%,#A855F766 0%,transparent 60%),radial-gradient(60% 120% at 100% 100%,#EC489955 0%,transparent 65%),linear-gradient(135deg,#3A2F9C,#1B1747);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --inc:#4FD08A; --inc-bg:#123A2A; --minor:#C3D46A; --minor-bg:#2A3112; --red:#F5B451; --red-bg:#3A2A12;
  --rem:#F07A6C; --rem-bg:#3A1A17; --prot:#8DB8F0; --prot-bg:#152A44; --keep:#A9B4B1; --keep-bg:#1F2C29;
  --good:#4FD08A; --good-bg:#123A2A; --mid:#F5B451; --mid-ink:#F5B451; --mid-bg:#3A2A12; --bad:#F07A6C; --bad-bg:#3A1A17;
  --c-urgent:#24161C; --c-opp:#13261F; --c-warn:#2A2214; --c-note:#151F33; --note:#8DB8F0;
  --smp:#F5B451; --smp-bg:#3A2A12; --smp-line:#5A4318; --danger-line:#5A2620; --float:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(900px 500px at 100% -10%,color-mix(in srgb,var(--brand2) 12%,transparent),transparent 70%),radial-gradient(700px 500px at -10% 30%,color-mix(in srgb,#14B8A6 8%,transparent),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f);font-size:13.5px;line-height:1.7;direction:rtl}
button,input,select{font:inherit;color:inherit}
.num,td,.kv,.big{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:23px;font-weight:800;line-height:1.4}
h2{font-size:16.5px;font-weight:700;line-height:1.5}
h3{font-size:14px;font-weight:700}
p{margin:0}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:12px}
.ltr{direction:ltr;unicode-bidi:isolate} .plain{unicode-bidi:plaintext}
a{color:var(--brand)}
:focus-visible{outline:none;box-shadow:var(--focus)}

/* ---- shell ---- */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex:none;background:var(--sb-bg);color:var(--sb-text);display:flex;flex-direction:column;gap:14px;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;padding-top:max(18px,env(safe-area-inset-top,0px))}
.sb-brand{display:flex;gap:10px;align-items:center;padding:2px 6px 14px;border-bottom:1px solid var(--sb-line)}
.logo{width:38px;height:38px;border-radius:10px;background:var(--logo);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.02em;flex:none;direction:ltr}
.sb-brand b{display:block;color:#fff;font-size:14.5px;font-weight:800;line-height:1.3;direction:ltr;text-align:right}
.sb-brand div span{display:block;font-size:11.5px;color:var(--sb-title)}
.sb-group{display:flex;flex-direction:column;gap:2px}
.sb-title{font-size:11.5px;font-weight:700;color:var(--sb-title);padding:4px 10px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--sb-text);text-align:start;cursor:pointer;width:100%;white-space:nowrap}
.sb-item .dot{width:6px;height:6px;border-radius:50%;background:var(--sb-title);flex:none}
.sb-item:hover{background:rgba(255,255,255,.05)}
.sb-item[aria-current="page"]{background:var(--sb-active);color:#fff;font-weight:700}
.sb-item[aria-current="page"] .dot{background:var(--sb-dot)}
.sb-item .cnt{margin-inline-start:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);border-radius:10px;padding:0 7px}
.sb-item .sb-soon{margin-inline-start:auto;font-size:10.5px;font-weight:700;color:var(--sb-dot);border:1px solid var(--sb-line);border-radius:6px;padding:0 6px}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.sb-card{border:1px solid var(--sb-line);border-radius:12px;padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:6px}
.sb-card b{color:#fff}
.sb-prog{height:4px;border-radius:2px;background:var(--sb-line);overflow:hidden}
.sb-prog i{display:block;height:100%;background:var(--sb-dot)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding-inline:max(28px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:20}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1;max-width:360px;position:relative}
.search input{width:100%;height:36px;border:1px solid var(--input-line);border-radius:10px;background:var(--surface2);padding-inline:34px 12px}
.search svg{position:absolute;inset-inline-start:10px;top:9px;color:var(--ink3)}
.tb-gap{flex:1}
.chip-smp{font-size:11.5px;font-weight:700;color:var(--smp);background:var(--smp-bg);border:1px solid var(--smp-line);border-radius:6px;padding:1px 8px;white-space:nowrap}
.link{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0;white-space:nowrap}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:none}
.iconbtn .badge{position:absolute;top:6px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--input-line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-on)}
.btn.danger{color:var(--bad);border-color:var(--danger-line)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.content{padding:22px max(28px,env(safe-area-inset-left,0px)) 28px max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;flex:1;min-width:0}
.foot{border-top:1px solid var(--line);padding:14px 28px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink2)}
.mobile-only{display:none}

.tb-brand{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:0;text-align:start;flex:none}
.tb-brand .logo{background:conic-gradient(from 200deg,#4F46E5,#8B5CF6,#EC4899,#4F46E5);color:#fff;border-radius:13px;box-shadow:0 6px 16px -6px #7C3AED}
.tb-brand .tx b{display:block;font-size:14.5px;font-weight:800;line-height:1.3;direction:ltr;text-align:right}
.tb-brand .tx span{display:block;font-size:11.5px;color:var(--ink2)}
.topbar .search{margin-inline-start:18px}
.btn.backbtn{margin-inline-start:14px;padding:0 12px 0 16px;border-radius:10px}
.iconbtn.backbtn{color:var(--brand);border-color:var(--brand)}
.content{max-width:1320px;width:100%;margin-inline:auto}

/* ---- home (islands) ---- */
.hh{border-radius:24px;padding:26px 30px;color:#fff;background:var(--hero-bg);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:26px;align-items:center}
.hh h1{font-size:26px;margin:4px 0}
.hh p{opacity:.88;font-size:13.5px}
.hh .lic{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:2px 12px}
.hh-k{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hh-k div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;min-width:0}
.hh-k span{display:block;font-size:12.5px;opacity:.85;white-space:nowrap}
.hh-k b{display:block;font-size:25px;font-weight:800;line-height:1.3;white-space:nowrap}
.hh-k small{font-size:11.5px;opacity:.82}
.hh-k .pill{display:inline-block;font-size:11px;font-weight:700;padding:0 8px;border-radius:99px;background:rgba(255,255,255,.22);vertical-align:middle;margin-inline-start:6px}
.sec-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.sec-t h2{font-size:17px}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(132px,auto);gap:16px}
.isl{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;position:relative;box-shadow:var(--shadow);min-width:0;text-align:start;color:inherit;font:inherit;transition:transform .15s,box-shadow .15s}
button.isl,.isl.click{cursor:pointer}
button.isl:hover,.isl.click:hover{transform:translateY(-2px)}
.isl.w2{grid-column:span 2}.isl.h2{grid-row:span 2}
.isl-h{display:flex;align-items:center;gap:12px;min-width:0}
.isl-h .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--h) 15%,var(--surface));color:var(--h);flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 18%,transparent)}
:root[data-theme="dark"] .isl-h .ic,:root[data-theme="dark"] .mi .ic{color:color-mix(in srgb,var(--h) 65%,white);background:color-mix(in srgb,var(--h) 22%,var(--surface))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .isl-h .ic,:root:not([data-theme="light"]) .mi .ic{color:color-mix(in srgb,var(--h) 65%,white);background:color-mix(in srgb,var(--h) 22%,var(--surface))}}
.ic{--h:#6366F1}.ic-renewal{--h:#6366F1}.ic-action{--h:#F59E0B}.ic-tender{--h:#0D9488}.ic-cal{--h:#EC4899}.ic-ai{--h:#8B5CF6}.ic-docs{--h:#0EA5E9}.ic-settings{--h:#64748B}
.ic-claims{--h:#E11D48}.ic-users{--h:#F43F5E}.ic-map{--h:#0EA5E9}.ic-link{--h:#14B8A6}.ic-market{--h:#F59E0B}.ic-clock{--h:#8B5CF6}.ic-upload{--h:#6366F1}.ic-search{--h:#0D9488}.ic-moon{--h:#475569}.ic-portfolio{--h:#4F46E5}.ic-urgent{--h:#EF4444}
.isl-h .ic svg{width:23px;height:23px}
.isl-h h3{font-size:15.5px;margin:0}
.isl-h p{font-size:12.5px;color:var(--ink2)}
.isl-h .go{margin-inline-start:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--ink2);flex:none;border:0;cursor:pointer}
.isl .bigk{font-size:34px;font-weight:800;line-height:1.1}
.isl .krow{display:flex;gap:12px;align-items:center}
.isl .foot2{margin-top:auto;font-size:12.5px;color:var(--brand);font-weight:700}
.isl .badge2{position:absolute;top:14px;inset-inline-end:14px;font-size:11px;padding:1px 9px;border-radius:99px;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.isl.dim .isl-h .ic{opacity:.75}
.isl.ai-i{background:linear-gradient(160deg,var(--soft),var(--surface) 60%)}
.hbars2{position:relative;display:flex;align-items:flex-end;gap:7px;flex:1;min-height:130px;padding-top:18px}
.hbars2 .bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;border:0;background:none;padding:0;cursor:pointer;position:relative;z-index:1}
.hbars2 .bar i{display:block;border-radius:7px 7px 3px 3px;width:100%}
.hbars2 .ln{position:absolute;inset-inline:0;border-top:1.5px dashed;height:0;z-index:2;pointer-events:none}
.hbars2 .ln span{position:absolute;inset-inline-start:0;top:-17px;font-size:10.5px;font-weight:700;background:var(--surface);padding:0 3px}
.hleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink2)}
.hleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.cchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:auto}
.cchip{border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;border:0;cursor:pointer;font-family:inherit}
.cchip b{font-size:20px}
.cc-urgent{background:var(--bad-bg);color:var(--bad)}.cc-opp{background:var(--good-bg);color:var(--good)}.cc-warn{background:var(--mid-bg);color:var(--mid-ink)}.cc-note{background:var(--prot-bg);color:var(--note)}
.ilist{display:flex;flex-direction:column;gap:7px}
.ili{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 10px;border-radius:12px;background:var(--bg);border:0;width:100%;text-align:start;cursor:pointer;color:inherit;font-family:inherit;min-width:0}
.ili span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sugs button{font-size:12px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;font-family:inherit}
.hask{display:flex;gap:8px;margin-top:auto}
.hchat{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.ai-ul{margin:4px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:3px}
.ai-next{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.ai-next button{font-size:11.5px;border:1px solid var(--brand);color:var(--brand);background:var(--surface);border-radius:99px;padding:2px 10px;cursor:pointer;font-family:inherit}
mark.lexfix{background:var(--mid-bg);color:inherit;border-bottom:1.5px dotted var(--mid);border-radius:3px;padding:0 1px}
.ai-link{border:0;background:none;color:var(--brand);font-weight:800;cursor:pointer;padding:0;font-family:inherit;font-size:inherit}
.ai-t{border-collapse:collapse;font-size:12px;width:100%}.ai-t td,.ai-t th{padding:4px 6px;border-bottom:1px solid var(--line2);position:static}
.hask select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 8px;max-width:170px;font-family:inherit;color:inherit}
.hask input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-family:inherit;color:inherit}
.hask button{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:18px;cursor:pointer}
.road .isl{padding-top:38px}
.ili em{font-style:normal}
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
@media (max-width:1100px){.hh{grid-template-columns:1fr}}
@media (max-width:980px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))} .isl.h2{grid-row:auto}}
@media (max-width:860px){
  .hh{padding:20px;border-radius:22px;gap:14px} .hh h1{font-size:21px}
  .hh-k{grid-template-columns:repeat(2,minmax(0,1fr))} .hh-k b{font-size:20px}
  .bento{gap:12px} .isl{padding:16px;border-radius:20px}
  .hask select{max-width:110px}
  .road{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}
@media (max-width:520px){.bento .isl.w2,.bento .isl.lst{grid-column:1 / -1} .bento .isl:not(.w2):not(.lst) .isl-h,.road .isl-h{flex-direction:column;align-items:flex-start;gap:8px} .road .isl{padding-top:40px} .isl .foot2{font-size:12px}}

/* ---- home v2 ---- */
.hh2{border-radius:28px;padding:26px 30px;color:#fff;background:var(--hero-bg);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:center;position:relative;overflow:hidden}
.hh2:after{content:"";position:absolute;left:-60px;bottom:-100px;width:280px;height:280px;border-radius:50%;background:radial-gradient(#ffffff22,transparent 70%);pointer-events:none}
.hh2 h1{font-size:27px;font-weight:900;margin:2px 0}
.todo{display:flex;flex-direction:column;gap:8px;margin-top:14px}

.panel-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line2)}
.panel-b{padding:14px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .kl{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.kpi .kv{font-size:27px;font-weight:800;line-height:1.25}
.kpi .ks{font-size:12px;color:var(--ink2)}
.kpi.accent{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.kpi .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mini{position:relative;height:4px;border-radius:2px;background:var(--line2);margin-top:4px}
.mini i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:2px}
.mini b{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--ink3)}

/* action center */
.ac{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.ac-col{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;border-inline-start:1px solid var(--line2)}
.ac-col:first-child{border-inline-start:0}
.ac-col.c-urgent{background:var(--c-urgent)} .ac-col.c-opp{background:var(--c-opp)} .ac-col.c-warn{background:var(--c-warn)} .ac-col.c-note{background:var(--c-note)}
.ac-h{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.ac-h .d{width:8px;height:8px;border-radius:50%}
.ac-h .n{margin-inline-start:auto;font-size:11.5px;font-weight:700;border-radius:20px;padding:0 9px}
.c-urgent .d{background:var(--bad)} .c-urgent .n{background:var(--bad-bg);color:var(--bad)}
.c-opp .d{background:var(--good)} .c-opp .n{background:var(--good-bg);color:var(--good)}
.c-warn .d{background:var(--mid)} .c-warn .n{background:var(--mid-bg);color:var(--mid-ink)}
.c-note .d{background:var(--note)} .c-note .n{background:var(--prot-bg);color:var(--note)}
.ac-item{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.7;cursor:pointer;text-align:start;width:100%}
.ac-item:hover{border-color:var(--line)}
.ac-item b{display:block;font-size:12.5px}
.c-urgent .ac-item b{color:var(--bad)} .c-opp .ac-item b{color:var(--good)} .c-warn .ac-item b{color:var(--mid-ink)} .c-note .ac-item b{color:var(--note)}
.ac-more{border:0;background:none;color:var(--brand);font-weight:700;font-size:12.5px;cursor:pointer;text-align:start;padding:2px 0}

/* column chart */
.cchart{position:relative;height:240px;display:flex;align-items:flex-end;gap:10px;padding:26px 8px 0;margin:0 0 6px}
.cchart .ref{position:absolute;inset-inline:0;border-top:1.5px dashed;height:0}
.cchart .ref span{position:absolute;inset-inline-end:0;top:-18px;font-size:11px;font-weight:700;background:var(--surface);padding:0 4px}
.cchart .col{flex:1;min-width:34px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;position:relative;z-index:1;border:0;background:none;padding:0}
.cchart .col .v{font-size:11.5px;font-weight:800;margin-bottom:3px}
.cchart .col .b{width:min(42px,70%);border-radius:6px 6px 0 0}
.cnames{display:flex;gap:10px;padding:6px 8px 0;border-top:1px solid var(--line)}
.cnames span{flex:1;min-width:34px;font-size:11px;color:var(--ink2);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--surface2);font-size:12px;font-weight:700;color:var(--ink2);text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
.nm b{display:block;white-space:nowrap} .nm span{font-size:12px;color:var(--ink2);white-space:nowrap}
.nm.wrapsub span{white-space:normal;display:block;max-width:240px}
.lrcell{min-width:96px}
.lrcell .mini{width:80px}
.sortseg{display:inline-flex;gap:4px;flex-wrap:wrap}
.sortseg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink2)}
.sortseg button[aria-pressed="true"]{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
tr.hl td{background:var(--hl)} tr.hl td:first-child{box-shadow:inset -3px 0 0 var(--brand)}
.prog{height:6px;border-radius:3px;background:var(--line2);min-width:44px;position:relative}
.prog i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:3px;background:var(--brand)}
.sumline{background:var(--prot-bg);color:var(--note);border-radius:10px;padding:10px 14px;font-weight:600}

/* in-page tabs */
.ptabs{display:flex;gap:18px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:64px;background:var(--bg);z-index:10}
.ptabs button{border:0;background:none;padding:10px 2px;font-weight:700;color:var(--ink2);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.ptabs button[aria-current="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.ptabs .n{font-size:11px;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:0 7px}
.anchor{scroll-margin-top:120px}

/* group layout with assistant */
.with-ai{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.with-ai > .colmain{display:flex;flex-direction:column;gap:20px;min-width:0}
.ai{position:sticky;top:120px;display:flex;flex-direction:column;max-height:calc(100vh - 140px)}
.ai .panel-h{flex:none}
.ai-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1}
.ai-q{align-self:flex-start;max-width:90%;background:var(--brand-dark);color:#fff;border-radius:12px 12px 4px 12px;padding:8px 12px;font-size:12.5px}
.ai-a{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.8;display:flex;flex-direction:column;gap:6px}
.ai-a b{font-weight:800}
.ai-src{display:flex;flex-wrap:wrap;gap:4px}
.ai-src span{font-size:10.5px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--surface)}
.ai-sug{display:flex;flex-direction:column;gap:6px;padding:10px 14px;border-top:1px solid var(--line2)}
.ai-sug button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;text-align:start;cursor:pointer;color:var(--ink)}
.ai-in{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line2)}
.ai-in input{flex:1;min-width:0;height:36px;border:1px solid var(--input-line);border-radius:9px;background:var(--surface);padding:0 10px}

/* coverage cards */
.covs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cov{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cov-h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.cov-h b{font-size:14.5px}
.cov-h .meta{font-size:12px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface2);border-radius:8px;padding:6px 8px;min-width:0}
.stats span{display:block;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.stats b{font-size:14px}
.share{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.capbox{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px}
.capbox s{color:var(--ink3)}
.capbox .new{font-weight:800;font-size:15px}
.why b{display:block;font-weight:700;line-height:1.7}
.why span{display:block;color:var(--ink2);font-size:12px;line-height:1.7}

/* stepper */
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--brand);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{width:34px;height:34px;border:0;background:none;color:var(--brand);font-size:18px;font-weight:700;cursor:pointer}
.stepper input{width:64px;height:34px;border:0;text-align:center;font-weight:800;background:none}
.stepper input:focus{outline:none}
.stepper:focus-within{box-shadow:var(--focus)}

/* tender price */
.bidrow{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.bidin{display:flex;flex-direction:column;gap:6px}
.bidin input{height:54px;border:1.5px solid var(--brand);border-radius:10px;background:var(--surface);font-size:26px;font-weight:800;padding:0 14px;width:100%}
.bidin input:focus{outline:none;box-shadow:var(--focus)}
.live{border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line)}
.live span{font-size:12px;color:var(--ink2)}
.live b{font-size:22px;font-weight:800}
.live.z-low{background:var(--good-bg);border-color:transparent} .live.z-low b{color:var(--good)}
.live.z-mid{background:var(--mid-bg);border-color:transparent} .live.z-mid b{color:var(--mid-ink)}
.live.z-high{background:var(--bad-bg);border-color:transparent} .live.z-high b{color:var(--bad)}
.zone{position:relative;padding:30px 0 22px}
.zone input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:6px;background:var(--zg);direction:rtl;margin:0}
.zone input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--zc,var(--brand));box-shadow:var(--float);cursor:grab}
.zone input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--zc,var(--brand));box-shadow:var(--float);cursor:grab}
.zone .mk{position:absolute;top:0;bottom:16px;width:0;border-inline-start:1.5px solid var(--ink3);pointer-events:none}
.zone .mk span{position:absolute;top:-2px;right:0;transform:translateX(50%);font-size:11px;font-weight:700;white-space:nowrap;color:var(--ink2);background:var(--surface);padding:0 3px}
.zone .ax{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:6px}
.zlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.zlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.msg-bad{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:9px 12px;font-weight:600}
.msg-good{background:var(--good-bg);color:var(--good);border-radius:10px;padding:9px 12px;font-weight:600}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.step .sn{width:28px;height:28px;border-radius:50%;background:var(--brand-dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12.5px}
:root[data-theme="dark"] .step .sn{background:var(--brand);color:var(--brand-on)}
.step .sv{font-weight:800;white-space:nowrap}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(150px,1fr) 3fr minmax(56px,auto);gap:12px;align-items:center;font-size:12.5px}
.hbar .t{height:12px;border-radius:6px;background:var(--line2);position:relative}
.hbar .t i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px}
.dq li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line2)}
.dq{list-style:none;margin:0;padding:0}
.dq li:last-child{border-bottom:0}
.sev{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:0 7px}

/* settings & preview */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600}
.field input[type=number],.field input[type=text],.field input[type=password]{height:38px;border:1px solid var(--input-line);border-radius:9px;background:var(--surface);padding:0 12px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:flex;gap:6px;align-items:center;white-space:nowrap}
.preview-banner{display:flex;gap:10px;align-items:center;background:var(--smp-bg);color:var(--smp);border:1px solid var(--smp-line);border-radius:10px;padding:8px 12px;font-weight:600}
.soon{max-width:620px;margin:20px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px}
.soon .ic{width:56px;height:56px;border-radius:14px;background:var(--hl);color:var(--brand);display:grid;place-items:center}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center}
.otp input{width:44px;height:50px;text-align:center;font-size:20px;font-weight:800;border:1px solid var(--input-line);border-radius:10px;background:var(--surface)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px}
.err p{margin:0}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,10,30,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;box-shadow:var(--float);width:min(680px,100%);max-height:90vh;display:flex;flex-direction:column}
.modal textarea{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2);color:var(--ink);font:inherit;line-height:1.9;resize:vertical}

/* mobile */
.bottomnav,.fab,.drawer-bg,.mtop{display:none}
.fab{display:none!important}
/* ---- all-features menu ---- */
.sheet{position:fixed;inset:0;z-index:65;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(15,12,40,.5);backdrop-filter:blur(3px)}
.sheet-box{position:relative;width:min(760px,100%);max-height:86vh;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 50px -20px rgba(0,0,0,.4);animation:up .22s ease-out}
@media (min-width:861px){.sheet{align-items:center}.sheet-box{border-radius:28px;padding:16px 26px 26px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-sec{font-size:12px;font-weight:800;color:var(--ink2);margin:14px 2px 8px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.mgrid{gap:8px} .mi{font-size:11px;padding:10px 2px 8px;border-radius:16px} .mi .ic{width:42px;height:42px;border-radius:14px} .mi .ic svg{width:22px;height:22px} .sheet-box{padding-inline:14px}}
.mi{border:1px solid var(--line2);background:var(--surface2);border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font:700 12px/1.45 var(--f);color:var(--ink);text-align:center;position:relative;min-width:0}
.mi:hover{border-color:var(--line)}
.mi .ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--h) 15%,var(--surface));color:var(--h)}
.mi .ic svg{width:24px;height:24px}
.mi .mb{position:absolute;top:6px;inset-inline-start:6px;font-size:9.5px;font-weight:800;border-radius:6px;padding:0 5px;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.mi .mn{position:absolute;top:6px;inset-inline-end:8px;min-width:18px;height:18px;border-radius:9px;background:#EF4444;color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.mgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.mi.main{flex-direction:row;justify-content:flex-start;padding:14px;gap:12px;text-align:start;font-size:13.5px;background:linear-gradient(135deg,color-mix(in srgb,var(--h,#6366F1) 12%,var(--surface)),var(--surface))}
.mi.main small{display:block;font-weight:500;color:var(--ink2);font-size:11.5px}
@media (max-width:520px){.mi.main{flex-direction:column;align-items:flex-start;gap:8px}}
@media (max-width:980px){
  .with-ai{grid-template-columns:1fr} .ai{position:static;max-height:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ac{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ac-col:nth-child(3){border-inline-start:0}
  .covs{grid-template-columns:1fr}
}
@media (max-width:860px){
  .sidebar{position:fixed;top:0;bottom:0;right:0;z-index:70;width:316px;transform:translateX(105%);transition:transform .2s;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
  .sidebar.open{transform:none}
  .drawer-bg.open{display:block;position:fixed;inset:0;z-index:65;background:rgba(6,20,17,.55)}
  .topbar{height:auto;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));gap:10px;top:0}
  .topbar .search,.topbar .tb-gap,.topbar .hide-m{display:none}
  .mtop{display:flex;align-items:center;gap:10px;width:100%}
  .mtop .hello{flex:1;min-width:0}
  .mtop .hello b{display:block;font-size:16px;font-weight:800;line-height:1.3}
  .mtop .hello span{font-size:12px;color:var(--ink2)}
  .topbar .seg{width:100%} .topbar .seg button{flex:1;min-height:40px}
  .content{padding:16px max(16px,env(safe-area-inset-left,0px)) 110px max(16px,env(safe-area-inset-right,0px))}
  .foot{padding-bottom:96px}
  .bottomnav{display:flex;align-items:flex-end;position:fixed;bottom:0;inset-inline:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 24px -14px rgba(30,27,75,.25)}
  .bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;min-height:66px;font-size:11.5px;font-weight:800;color:var(--ink2);cursor:pointer;position:relative;font-family:inherit}
  .bottomnav .bi{--h:#6366F1;width:52px;height:34px;border-radius:17px;display:grid;place-items:center;color:var(--h);transition:background .15s}
  .bottomnav .bi svg{width:27px;height:27px}
  .bottomnav button[aria-current="true"]{color:var(--ink)}
  .bottomnav button[aria-current="true"] .bi{background:color-mix(in srgb,var(--h) 16%,transparent)}
  .bottomnav .bn-badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:#EF4444;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
  .bottomnav .bn-menu{margin-top:-22px}
  .bottomnav .orb{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6366F1,#A855F7 60%,#EC4899);box-shadow:0 10px 24px -8px #7C3AED,inset 0 1px 0 rgba(255,255,255,.35);border:4px solid var(--surface);transform:rotate(0);transition:transform .2s}
  .bottomnav .bn-menu[aria-expanded="true"] .orb{transform:rotate(45deg)}
  .fab{display:inline-flex;position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:41;height:50px;padding:0 18px;border-radius:25px;background:var(--brand);color:var(--brand-on);border:0;font-weight:800;align-items:center;gap:6px;box-shadow:var(--float);cursor:pointer}
  .mobile-only{display:block} .desk-only{display:none}
  h1{font-size:17px}
  .ptabs{top:62px}
  .anchor{scroll-margin-top:120px}
  .btn{height:44px}
  .bidrow{grid-template-columns:1fr 1fr} .bidin{grid-column:1 / -1}
  .form{grid-template-columns:1fr}
  .hbar{grid-template-columns:110px 1fr 50px}

  .mbar .btn{width:100%;height:50px}
