<title>Renewal Intelligence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: right sidebar (brand-dark) + white top bar + content column; group pages add a 320px assistant column on the left. Phones: drawer, bottom nav, FAB. Tokens follow DESIGN_PROMPT_1. */
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --surface2:#F8F8FD; --line:#E4E6F0; --line2:#EEF0F7; --input-line:#D9DCEA;
  --ink:#161A2E; --ink2:#5F6683; --ink3:#8C92AB;
  --brand-dark:#312E81; --brand:#4F46E5; --brand2:#7C6CF6; --brand-on:#FFFFFF; --focus:0 0 0 3px #DCDAFB; --brand-light:#A5B4FC; --logo:#4F46E5; --hl:#F0EFFE; --soft:#EEF0FF;
  --hero-bg:radial-gradient(70% 120% at 0% 0%,#C084FC 0%,transparent 60%),radial-gradient(60% 120% at 100% 100%,#EC4899AA 0%,transparent 65%),linear-gradient(135deg,#4F46E5,#4338CA);
  --shadow:0 1px 2px rgba(20,20,50,.04),0 8px 24px -12px rgba(20,20,60,.14);
  --sb-bg:#0B3B34; --sb-active:#145247; --sb-dot:#3FD1B3; --sb-text:#C9DBD6; --sb-title:#7FA39A; --sb-line:#1F5B50;
  --inc:#1E7A46; --inc-bg:#E3F3E8; --minor:#55661A; --minor-bg:#EEF2DC; --red:#8A5A00; --red-bg:#FDF0DD;
  --rem:#A3261B; --rem-bg:#FBE7E5; --prot:#1F5590; --prot-bg:#E5EEF8; --keep:#4B5563; --keep-bg:#EEF0F2;
  --good:#1E7A46; --good-bg:#E3F3E8; --mid:#D97706; --mid-ink:#B45F06; --mid-bg:#FDF0DD; --bad:#C0392B; --bad-bg:#FBE7E5;
  --c-urgent:#FDF4F5; --c-opp:#F2FAF5; --c-warn:#FEF8EE; --c-note:#F3F6FD; --note:#1F5590;
  --smp:#8A5A00; --smp-bg:#FFF4DC; --smp-line:#F1D9A6; --danger-line:#F1C9C4;
  --float:0 8px 28px rgba(49,46,129,.18);
  --f:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F1A; --surface:#161927; --surface2:#121522; --line:#262A3D; --line2:#1E2133; --input-line:#2E3350;
  --ink:#E8EAF6; --ink2:#9AA0BD; --ink3:#6F7594; --brand:#8B83FF; --brand2:#B49CFF; --brand-dark:#3A2F9C; --brand-on:#0D0F1A; --focus:0 0 0 3px #2E2A66; --hl:#1F2142; --soft:#22244A; --logo:#6D5CF0;
  --hero-bg:radial-gradient(70% 120% at 0% 0%,#A855F766 0%,transparent 60%),radial-gradient(60% 120% at 100% 100%,#EC489955 0%,transparent 65%),linear-gradient(135deg,#3A2F9C,#1B1747);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --inc:#4FD08A; --inc-bg:#123A2A; --minor:#C3D46A; --minor-bg:#2A3112; --red:#F5B451; --red-bg:#3A2A12;
  --rem:#F07A6C; --rem-bg:#3A1A17; --prot:#8DB8F0; --prot-bg:#152A44; --keep:#A9B4B1; --keep-bg:#1F2C29;
  --good:#4FD08A; --good-bg:#123A2A; --mid:#F5B451; --mid-ink:#F5B451; --mid-bg:#3A2A12; --bad:#F07A6C; --bad-bg:#3A1A17;
  --c-urgent:#24161C; --c-opp:#13261F; --c-warn:#2A2214; --c-note:#151F33; --note:#8DB8F0;
  --smp:#F5B451; --smp-bg:#3A2A12; --smp-line:#5A4318; --danger-line:#5A2620; --float:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F1A; --surface:#161927; --surface2:#121522; --line:#262A3D; --line2:#1E2133; --input-line:#2E3350;
  --ink:#E8EAF6; --ink2:#9AA0BD; --ink3:#6F7594; --brand:#8B83FF; --brand2:#B49CFF; --brand-dark:#3A2F9C; --brand-on:#0D0F1A; --focus:0 0 0 3px #2E2A66; --hl:#1F2142; --soft:#22244A; --logo:#6D5CF0;
  --hero-bg:radial-gradient(70% 120% at 0% 0%,#A855F766 0%,transparent 60%),radial-gradient(60% 120% at 100% 100%,#EC489955 0%,transparent 65%),linear-gradient(135deg,#3A2F9C,#1B1747);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --inc:#4FD08A; --inc-bg:#123A2A; --minor:#C3D46A; --minor-bg:#2A3112; --red:#F5B451; --red-bg:#3A2A12;
  --rem:#F07A6C; --rem-bg:#3A1A17; --prot:#8DB8F0; --prot-bg:#152A44; --keep:#A9B4B1; --keep-bg:#1F2C29;
  --good:#4FD08A; --good-bg:#123A2A; --mid:#F5B451; --mid-ink:#F5B451; --mid-bg:#3A2A12; --bad:#F07A6C; --bad-bg:#3A1A17;
  --c-urgent:#24161C; --c-opp:#13261F; --c-warn:#2A2214; --c-note:#151F33; --note:#8DB8F0;
  --smp:#F5B451; --smp-bg:#3A2A12; --smp-line:#5A4318; --danger-line:#5A2620; --float:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(900px 500px at 100% -10%,color-mix(in srgb,var(--brand2) 12%,transparent),transparent 70%),radial-gradient(700px 500px at -10% 30%,color-mix(in srgb,#14B8A6 8%,transparent),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f);font-size:13.5px;line-height:1.7;direction:rtl}
button,input,select{font:inherit;color:inherit}
.num,td,.kv,.big{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:23px;font-weight:800;line-height:1.4}
h2{font-size:16.5px;font-weight:700;line-height:1.5}
h3{font-size:14px;font-weight:700}
p{margin:0}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:12px}
.ltr{direction:ltr;unicode-bidi:isolate} .plain{unicode-bidi:plaintext}
a{color:var(--brand)}
:focus-visible{outline:none;box-shadow:var(--focus)}

/* ---- shell ---- */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex:none;background:var(--sb-bg);color:var(--sb-text);display:flex;flex-direction:column;gap:14px;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;padding-top:max(18px,env(safe-area-inset-top,0px))}
.sb-brand{display:flex;gap:10px;align-items:center;padding:2px 6px 14px;border-bottom:1px solid var(--sb-line)}
.logo{width:38px;height:38px;border-radius:10px;background:var(--logo);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.02em;flex:none;direction:ltr}
.sb-brand b{display:block;color:#fff;font-size:14.5px;font-weight:800;line-height:1.3;direction:ltr;text-align:right}
.sb-brand div span{display:block;font-size:11.5px;color:var(--sb-title)}
.sb-group{display:flex;flex-direction:column;gap:2px}
.sb-title{font-size:11.5px;font-weight:700;color:var(--sb-title);padding:4px 10px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--sb-text);text-align:start;cursor:pointer;width:100%;white-space:nowrap}
.sb-item .dot{width:6px;height:6px;border-radius:50%;background:var(--sb-title);flex:none}
.sb-item:hover{background:rgba(255,255,255,.05)}
.sb-item[aria-current="page"]{background:var(--sb-active);color:#fff;font-weight:700}
.sb-item[aria-current="page"] .dot{background:var(--sb-dot)}
.sb-item .cnt{margin-inline-start:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);border-radius:10px;padding:0 7px}
.sb-item .sb-soon{margin-inline-start:auto;font-size:10.5px;font-weight:700;color:var(--sb-dot);border:1px solid var(--sb-line);border-radius:6px;padding:0 6px}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.sb-card{border:1px solid var(--sb-line);border-radius:12px;padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:6px}
.sb-card b{color:#fff}
.sb-prog{height:4px;border-radius:2px;background:var(--sb-line);overflow:hidden}
.sb-prog i{display:block;height:100%;background:var(--sb-dot)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding-inline:max(28px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:20}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1;max-width:360px;position:relative}
.search input{width:100%;height:36px;border:1px solid var(--input-line);border-radius:10px;background:var(--surface2);padding-inline:34px 12px}
.search svg{position:absolute;inset-inline-start:10px;top:9px;color:var(--ink3)}
.tb-gap{flex:1}
.chip-smp{font-size:11.5px;font-weight:700;color:var(--smp);background:var(--smp-bg);border:1px solid var(--smp-line);border-radius:6px;padding:1px 8px;white-space:nowrap}
.link{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0;white-space:nowrap}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:none}
.iconbtn .badge{position:absolute;top:6px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--input-line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-on)}
.btn.danger{color:var(--bad);border-color:var(--danger-line)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.content{padding:22px max(28px,env(safe-area-inset-left,0px)) 28px max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;flex:1;min-width:0}
.foot{border-top:1px solid var(--line);padding:14px 28px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink2)}
.mobile-only{display:none}

.tb-brand{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:0;text-align:start;flex:none}
.tb-brand .logo{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:12px}
.tb-brand .tx b{display:block;font-size:14.5px;font-weight:800;line-height:1.3;direction:ltr;text-align:right}
.tb-brand .tx span{display:block;font-size:11.5px;color:var(--ink2)}
.topbar .search{margin-inline-start:18px}
.btn.backbtn{margin-inline-start:14px;padding:0 12px 0 16px;border-radius:10px}
.iconbtn.backbtn{color:var(--brand);border-color:var(--brand)}
.content{max-width:1320px;width:100%;margin-inline:auto}

/* ---- home (islands) ---- */
.hh{border-radius:24px;padding:26px 30px;color:#fff;background:var(--hero-bg);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:26px;align-items:center}
.hh h1{font-size:26px;margin:4px 0}
.hh p{opacity:.88;font-size:13.5px}
.hh .lic{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:2px 12px}
.hh-k{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hh-k div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;min-width:0}
.hh-k span{display:block;font-size:12.5px;opacity:.85;white-space:nowrap}
.hh-k b{display:block;font-size:25px;font-weight:800;line-height:1.3;white-space:nowrap}
.hh-k small{font-size:11.5px;opacity:.82}
.hh-k .pill{display:inline-block;font-size:11px;font-weight:700;padding:0 8px;border-radius:99px;background:rgba(255,255,255,.22);vertical-align:middle;margin-inline-start:6px}
.sec-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.sec-t h2{font-size:17px}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(132px,auto);gap:16px}
.isl{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;position:relative;box-shadow:var(--shadow);min-width:0;text-align:start;color:inherit;font:inherit;transition:transform .15s,box-shadow .15s}
button.isl,.isl.click{cursor:pointer}
button.isl:hover,.isl.click:hover{transform:translateY(-2px)}
.isl.w2{grid-column:span 2}.isl.h2{grid-row:span 2}
.isl-h{display:flex;align-items:center;gap:12px;min-width:0}
.isl-h .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--h) 15%,var(--surface));color:var(--h);flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 18%,transparent)}
:root[data-theme="dark"] .isl-h .ic,:root[data-theme="dark"] .mi .ic{color:color-mix(in srgb,var(--h) 65%,white);background:color-mix(in srgb,var(--h) 22%,var(--surface))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .isl-h .ic,:root:not([data-theme="light"]) .mi .ic{color:color-mix(in srgb,var(--h) 65%,white);background:color-mix(in srgb,var(--h) 22%,var(--surface))}}
.ic{--h:#6366F1}.ic-renewal{--h:#6366F1}.ic-action{--h:#F59E0B}.ic-tender{--h:#0D9488}.ic-cal{--h:#EC4899}.ic-ai{--h:#8B5CF6}.ic-docs{--h:#0EA5E9}.ic-settings{--h:#64748B}
.ic-users{--h:#F43F5E}.ic-map{--h:#0EA5E9}.ic-link{--h:#14B8A6}.ic-market{--h:#F59E0B}.ic-clock{--h:#8B5CF6}.ic-upload{--h:#6366F1}.ic-search{--h:#0D9488}.ic-moon{--h:#475569}.ic-portfolio{--h:#4F46E5}.ic-urgent{--h:#EF4444}
.isl-h .ic svg{width:23px;height:23px}
.isl-h h3{font-size:15.5px;margin:0}
.isl-h p{font-size:12.5px;color:var(--ink2)}
.isl-h .go{margin-inline-start:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--ink2);flex:none;border:0;cursor:pointer}
.isl .bigk{font-size:34px;font-weight:800;line-height:1.1}
.isl .krow{display:flex;gap:12px;align-items:center}
.isl .foot2{margin-top:auto;font-size:12.5px;color:var(--brand);font-weight:700}
.isl .badge2{position:absolute;top:14px;inset-inline-end:14px;font-size:11px;padding:1px 9px;border-radius:99px;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.isl.dim .isl-h .ic{opacity:.75}
.isl.ai-i{background:linear-gradient(160deg,var(--soft),var(--surface) 60%)}
.hbars2{position:relative;display:flex;align-items:flex-end;gap:7px;flex:1;min-height:130px;padding-top:18px}
.hbars2 .bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;border:0;background:none;padding:0;cursor:pointer;position:relative;z-index:1}
.hbars2 .bar i{display:block;border-radius:7px 7px 3px 3px;width:100%}
.hbars2 .ln{position:absolute;inset-inline:0;border-top:1.5px dashed;height:0;z-index:2;pointer-events:none}
.hbars2 .ln span{position:absolute;inset-inline-start:0;top:-17px;font-size:10.5px;font-weight:700;background:var(--surface);padding:0 3px}
.hleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink2)}
.hleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.cchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:auto}
.cchip{border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;border:0;cursor:pointer;font-family:inherit}
.cchip b{font-size:20px}
.cc-urgent{background:var(--bad-bg);color:var(--bad)}.cc-opp{background:var(--good-bg);color:var(--good)}.cc-warn{background:var(--mid-bg);color:var(--mid-ink)}.cc-note{background:var(--prot-bg);color:var(--note)}
.ilist{display:flex;flex-direction:column;gap:7px}
.ili{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 10px;border-radius:12px;background:var(--bg);border:0;width:100%;text-align:start;cursor:pointer;color:inherit;font-family:inherit;min-width:0}
.ili span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sugs button{font-size:12px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;font-family:inherit}
.hask{display:flex;gap:8px;margin-top:auto}
.hchat{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.ai-ul{margin:4px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:3px}
.ai-next{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.ai-next button{font-size:11.5px;border:1px solid var(--brand);color:var(--brand);background:var(--surface);border-radius:99px;padding:2px 10px;cursor:pointer;font-family:inherit}
.ai-link{border:0;background:none;color:var(--brand);font-weight:800;cursor:pointer;padding:0;font-family:inherit;font-size:inherit}
.ai-t{border-collapse:collapse;font-size:12px;width:100%}.ai-t td,.ai-t th{padding:4px 6px;border-bottom:1px solid var(--line2);position:static}
.hask select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 8px;max-width:170px;font-family:inherit;color:inherit}
.hask input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-family:inherit;color:inherit}
.hask button{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:18px;cursor:pointer}
.road .isl{padding-top:38px}
.ili em{font-style:normal}
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
@media (max-width:1100px){.hh{grid-template-columns:1fr}}
@media (max-width:980px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))} .isl.h2{grid-row:auto}}
@media (max-width:860px){
  .hh{padding:20px;border-radius:22px;gap:14px} .hh h1{font-size:21px}
  .hh-k{grid-template-columns:repeat(2,minmax(0,1fr))} .hh-k b{font-size:20px}
  .bento{gap:12px} .isl{padding:16px;border-radius:20px}
  .hask select{max-width:110px}
  .road{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}
@media (max-width:520px){.bento .isl.w2,.bento .isl.lst{grid-column:1 / -1} .bento .isl:not(.w2):not(.lst) .isl-h,.road .isl-h{flex-direction:column;align-items:flex-start;gap:8px} .road .isl{padding-top:40px} .isl .foot2{font-size:12px}}

/* ---- two main jobs ---- */
.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mis:nth-child(2) .num{background:linear-gradient(135deg,#0D9488,#0EA5E9)}
.mis{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.mis .num{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#6366F1,#A855F7);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.mis-h{display:flex;gap:12px;align-items:flex-start}
.mis-h h2{font-size:18px}
.mis-h p{font-size:13px;color:var(--ink2);margin-top:2px}
.drop{border:2px dashed var(--input-line);border-radius:18px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface2);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--hl)}

@media (max-width:980px){
  .with-ai{grid-template-columns:1fr} .ai{position:static;max-height:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ac{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ac-col:nth-child(3){border-inline-start:0}
  .covs{grid-template-columns:1fr}
}
@media (max-width:860px){
  .sidebar{position:fixed;top:0;bottom:0;right:0;z-index:70;width:316px;transform:translateX(105%);transition:transform .2s;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
  .sidebar.open{transform:none}
  .drawer-bg.open{display:block;position:fixed;inset:0;z-index:65;background:rgba(6,20,17,.55)}
  .topbar{height:auto;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));gap:10px;top:0}
  .topbar .search,.topbar .tb-gap,.topbar .hide-m{display:none}
  .mtop{display:flex;align-items:center;gap:10px;width:100%}
  .mtop .hello{flex:1;min-width:0}
  .mtop .hello b{display:block;font-size:16px;font-weight:800;line-height:1.3}
  .mtop .hello span{font-size:12px;color:var(--ink2)}
  .topbar .seg{width:100%} .topbar .seg button{flex:1;min-height:40px}
  .content{padding:16px max(16px,env(safe-area-inset-left,0px)) 110px max(16px,env(safe-area-inset-right,0px))}
  .foot{padding-bottom:96px}
  .bottomnav{display:flex;align-items:flex-end;position:fixed;bottom:0;inset-inline:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 24px -14px rgba(30,27,75,.25)}
  .bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;min-height:66px;font-size:11.5px;font-weight:800;color:var(--ink2);cursor:pointer;position:relative;font-family:inherit}
  .bottomnav .bi{--h:#6366F1;width:52px;height:34px;border-radius:17px;display:grid;place-items:center;color:var(--h);transition:background .15s}
  .bottomnav .bi svg{width:27px;height:27px}
  .bottomnav button[aria-current="true"]{color:var(--ink)}
  .bottomnav button[aria-current="true"] .bi{background:color-mix(in srgb,var(--h) 16%,transparent)}
  .bottomnav .bn-badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:#EF4444;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
  .bottomnav .bn-menu{margin-top:-22px}
  .bottomnav .orb{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6366F1,#A855F7 60%,#EC4899);box-shadow:0 10px 24px -8px #7C3AED,inset 0 1px 0 rgba(255,255,255,.35);border:4px solid var(--surface);transform:rotate(0);transition:transform .2s}
  .bottomnav .bn-menu[aria-expanded="true"] .orb{transform:rotate(45deg)}
  .fab{display:inline-flex;position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:41;height:50px;padding:0 18px;border-radius:25px;background:var(--brand);color:var(--brand-on);border:0;font-weight:800;align-items:center;gap:6px;box-shadow:var(--float);cursor:pointer}
  .mobile-only{display:block} .desk-only{display:none}
  h1{font-size:17px}
  .ptabs{top:62px}
  .anchor{scroll-margin-top:120px}
  .btn{height:44px}
  .bidrow{grid-template-columns:1fr 1fr} .bidin{grid-column:1 / -1}
  .form{grid-template-columns:1fr}
  .hbar{grid-template-columns:110px 1fr 50px}
  .mbar{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom,0px));inset-inline:0;z-index:39;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
  .mbar .btn{width:100%;height:50px}
  .content:has(.mbar){padding-bottom:190px}
}
@media (min-width:861px){.mbar{display:none} .mobile-only{display:none!important}}
@media (max-width:860px){.desk-only{display:none!important}}
@media (max-width:520px){.ac{grid-template-columns:1fr} .ac-col{border-inline-start:0;border-top:1px solid var(--line2)} .stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* mobile home */
.hero{background:var(--hero-bg);color:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero .big{font-size:34px;font-weight:800;line-height:1.2}
.hero .hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .hs div{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 8px}
.hero .hs span{display:block;font-size:11px;color:rgba(255,255,255,.8)}
.hero .hs b{font-size:15px}
.fchips{display:flex;gap:6px;overflow-x:auto}
.fchips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;min-height:40px}
.fchips button[aria-pressed="true"]{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:start;width:100%}
.mrow .tx{flex:1;min-width:0}
.mrow .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tx span{font-size:12px;color:var(--ink2)}
.mrow .lr{text-align:end;font-weight:800}
@media print{.topbar,.bottomnav,.fab,.ai,.ptabs,.foot,.actions,.mbar{display:none!important} .content{padding:0} .panel,.card{break-inside:avoid}}

<script id="engine">
/* ---------- parsing ---------- */
const FA_DIGITS = "۰۱۲۳۴۵۶۷۸۹", AR_DIGITS = "٠١٢٣٤٥٦٧٨٩";
function latin(s){ return String(s).replace(/[۰-۹]/g, d => FA_DIGITS.indexOf(d)).replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d)); }
function num(v){
  if (v == null || v === "") return null;
  if (typeof v === "number") return v;
  let s = latin(String(v).trim()).replace(/[,٬\s]/g, "");
  const pct = /[%٪]$/.test(s); s = s.replace(/[%٪]$/, "");
  const n = parseFloat(s);
  return isNaN(n) ? null : (pct ? n / 100 : n);
}
const str = v => v == null ? "" : String(v).trim();
const norm = s => str(s).replace(/‌/g, "").replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/\s+/g, " ");

function findSheet(sheets, prefix, words){
  const names = Object.keys(sheets);
  return names.find(n => n.startsWith(prefix)) || names.find(n => words.some(w => norm(n).includes(w)));
}
// Header row is found by its first cell, so shifted rows don't break anything.
function table(rows, first){
  if (!rows) return null;
  const hi = rows.findIndex(r => r && norm(r[0]).toLowerCase() === first.toLowerCase());
  if (hi < 0) return null;
  const out = [];
  for (let i = hi + 1; i < rows.length; i++){
    const r = rows[i] || [];
    if (!str(r[0])) { if (out.length) break; else continue; }
    out.push(r);
  }
  return { header: rows[hi].map(norm), rows: out };
}
function col(t, names, fallback){
  for (const n of names){ const i = t.header.indexOf(norm(n)); if (i >= 0) return i; }
  return fallback;
}

function parseWorkbook(sheets){
  const warn = [];
  const S = {
    pop: sheets[findSheet(sheets, "01", ["جمعیت"])],
    cov: sheets[findSheet(sheets, "02", ["تعهدات"])],
    clm: sheets[findSheet(sheets, "03", ["خسارت"])],
    unp: sheets[findSheet(sheets, "04", ["غیرقابل"])],
    prm: sheets[findSheet(sheets, "05", ["حق"])],
    trf: sheets[findSheet(sheets, "06", ["تعرفه"])],
  };
  const tc = table(S.cov, "Coverage_ID"), tl = table(S.clm, "Claim_ID");
  if (!tc) throw new Error("جدول تعهدات پیدا نشد. شیتی با سرستون Coverage_ID لازم است.");
  if (!tl) throw new Error("جدول خسارت‌ها پیدا نشد. شیتی با سرستون Claim_ID لازم است.");

  let group = { name: "گروه بدون نام", total: null };
  const tp = table(S.pop, "Group_ID");
  if (tp && tp.rows[0]){
    const r = tp.rows[0], g = (n, f) => { const i = col(tp, [n], -1); return r[i >= 0 ? i : f]; };
    const parts = ["اصلی","همسر","فرزند","سایر وابسته"].map((n, k) => num(g(n, 6 + k)) || 0);
    group = { id: str(r[0]), name: str(g("نام بیمه‌گذار", 1)) || "گروه بدون نام", industry: str(g("صنعت", 2)), province: str(g("استان", 3)),
      period: str(g("دوره قرارداد", 4)), employees: num(g("تعداد کارکنان", 5)), parts,
      total: num(g("کل نفرات", 10)) || parts.reduce((a, b) => a + b, 0) || null,
      avgAge: num(g("میانگین سن", 11)), female: num(g("درصد زن", 13)), male: num(g("درصد مرد", 14)),
      budget: num(g("بودجه افزایش حق‌بیمه", 19)) };
  } else warn.push({ sev: "warn", text: "اطلاعات جمعیت گروه پیدا نشد؛ نرخ استفاده نسبت به کل بیمه‌شدگان محاسبه نمی‌شود." });

  const ci = (n, f) => { const i = col(tc, [n], -1); return i >= 0 ? i : f; };
  const coverages = tc.rows.map(r => ({
    id: str(r[0]), name: str(r[ci("پوشش", 1)]),
    annualCap: num(r[ci("سقف سالانه فعلی", 2)]), perCase: num(r[ci("سقف هر مورد", 3)]),
    min: num(r[ci("حداقل پیشنهادی", 8)]), max: num(r[ci("حداکثر پیشنهادی", 9)]),
  }));

  const li = (n, f) => col(tl, [n], f);
  const L = { member: li("Member_ID", 1), date: li("Claim_Date", 2), cov: li("Coverage_ID", 3), covName: li("پوشش", 4), service: li("نوع خدمت", 5),
    approved: li("مبلغ تاییدشده", 9), paid: li("پرداختی", 10), unpaid: li("غیرقابل پرداخت", 11), reason: li("علت عدم پرداخت", 12) };
  const claims = tl.rows.map(r => {
    const approved = num(r[L.approved]) || 0, paid = num(r[L.paid]) || 0;
    let unpaid = num(r[L.unpaid]); if (unpaid == null) unpaid = Math.max(0, approved - paid);
    return { id: str(r[0]), member: str(r[L.member]), date: str(r[L.date]), cov: str(r[L.cov]), covName: str(r[L.covName]),
      service: str(r[L.service]), approved, paid, unpaid, reason: norm(r[L.reason]) };
  });

  const tu = table(S.unp, "Claim_ID");
  const unpaidList = tu ? tu.rows.map(r => ({ id: str(r[0]), cov: str(r[col(tu, ["Coverage_ID"], 1)]), amount: num(r[col(tu, ["مبلغ غیرقابل پرداخت"], 3)]) || 0,
    reason: norm(r[col(tu, ["علت استاندارد"], 4)]), fixable: norm(r[col(tu, ["قابل اصلاح با تغییر قرارداد؟"], 6)]) })) : [];

  const premiums = [];
  (S.prm || []).forEach(r => {
    if (!r || !/^(سال|\d{4})/.test(latin(norm(r[0])))) return;
    premiums.push({ label: norm(r[0]), persons: num(r[1]), premium: num(r[2]), paid: num(r[3]), approved: num(r[4]), personMonths: num(r[8]) });
  });

  const tt = table(S.trf, "Service_ID");
  const tariffs = tt ? tt.rows.map(r => ({ name: str(r[1]), old: num(r[2]), next: num(r[3]), pt: num(r[4]) }))
    .filter(t => t.old > 0 && t.next != null) : [];

  return { group, coverages, claims, unpaidList, premiums, tariffs, warn };
}

/* ---------- dates ---------- */
function g2j(gy, gm, gd){
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = gy <= 1600 ? 0 : 979; gy -= gy <= 1600 ? 621 : 1600;
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + gdm[gm - 1];
  jy += 33 * Math.floor(days / 12053); days %= 12053;
  jy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365){ jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
  return [jy, jm, jd];
}
const jDayNo = (y, m, d) => y * 365 + Math.floor(y / 4) + (m <= 7 ? (m - 1) * 31 : 186 + (m - 7) * 30) + d;
function parseJ(s){ const m = latin(norm(s)).match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/); return m ? [+m[1], +m[2], +m[3]] : null; }
function renewalInfo(period, today){
  const all = latin(norm(period)).match(/\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}/g);
  if (!all || !all.length) return null;
  const end = parseJ(all[all.length - 1]);
  const t = today || (d => g2j(d.getFullYear(), d.getMonth() + 1, d.getDate()))(new Date());
  return { end: all[all.length - 1], days: jDayNo(...end) - jDayNo(...t) + 1 };
}
function monthIndex(d){ const j = parseJ(d); return j ? j[0] * 12 + j[1] : null; }

/* ---------- analysis ---------- */
const PROTECT_RE = /بستری|جراحی|زایمان|آمبولانس|سرطان|پیوند|دیالیز|اورژانس|شیمی/;
const DEFAULTS = { pressureHigh: 5, pressureMinor: 1, lowUtil: 2, lowClaim: 8, lowPaid: 2, targetLR: 75 };

function niceUp(x){
  const step = x < 10 ? 1 : x < 50 ? 5 : x < 200 ? 10 : x < 1000 ? 50 : 100;
  return Math.ceil(x / step - 1e-9) * step;
}
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);

// Replays last year's approved claims, grown by the tariff trend, under a given set of caps.
function project(cl, annualCap, perCase, trend){
  const byM = new Map(); let need = 0;
  for (const c of cl){
    const a = c.approved * (1 + trend); need += a;
    const v = perCase != null ? Math.min(a, perCase) : a;
    const k = c.member || c.id; byM.set(k, (byM.get(k) || 0) + v);
  }
  let paid = 0; for (const v of byM.values()) paid += annualCap != null ? Math.min(v, annualCap) : v;
  return { paid, need };
}

function analyze(data, settings, protectNames){
  const st = Object.assign({}, DEFAULTS, settings || {});
  const { group, coverages, claims, unpaidList, premiums, tariffs } = data;
  const issues = data.warn.slice();

  const trend = tariffs.length ? sum(tariffs, t => (t.next / t.old - 1) * (t.pt == null ? 1 : t.pt)) / tariffs.length : 0;
  const totalPaid = sum(claims, c => c.paid), totalApproved = sum(claims, c => c.approved), totalUnpaid = sum(claims, c => c.unpaid);
  const insured = group.total;
  const current = premiums.length ? premiums[premiums.length - 1] : null;
  const prior = premiums.filter(p => p.premium && p.paid).slice(-1)[0] || null;
  const premiumNow = current && current.premium;
  const complete = premiumNow ? totalPaid / premiumNow >= 0.1 : true;

  const months = claims.map(c => monthIndex(c.date)).filter(m => m != null);
  const span = months.length ? Math.max(...months) - Math.min(...months) + 1 : 0;
  const level = claims.length >= 300 && span >= 24 ? "high" : claims.length >= 100 && span >= 12 ? "mid" : "low";

  const covIds = new Set(coverages.map(c => c.id));
  const rows = coverages.map(cv => {
    const cl = claims.filter(c => c.cov === cv.id || (!c.cov && c.covName === cv.name));
    const byMember = new Map();
    cl.forEach(c => { const k = c.member || c.id; const m = byMember.get(k) || { approved: 0, paid: 0 }; m.approved += c.approved; m.paid += c.paid; byMember.set(k, m); });
    const n = cl.length, users = byMember.size;
    const paid = sum(cl, c => c.paid), approved = sum(cl, c => c.approved);
    const capClaims = cl.filter(c => /سقف/.test(c.reason) && c.unpaid > 0);
    const capUnpaid = sum(capClaims, c => c.unpaid);
    const otherUnpaid = sum(cl, c => c.unpaid) - capUnpaid;
    const memberNeeds = [...byMember.values()].map(m => m.approved).sort((a, b) => a - b);
    const peakMember = memberNeeds.length ? memberNeeds[memberNeeds.length - 1] : 0;
    // Cap targets follow the 90th-percentile member, so one outlier doesn't set the cap for everyone.
    const pick = arr => arr.length >= 10 ? arr[Math.min(arr.length - 1, Math.ceil(arr.length * 0.9) - 1)] : (arr.length ? arr[arr.length - 1] : 0);
    const capNeedAnnual = pick(memberNeeds.filter(v => cv.annualCap != null && v > cv.annualCap));
    // Which cap caused each cap-related shortfall: the member's yearly total over the annual cap, else the single claim over the per-case cap.
    const memberKey = c => c.member || c.id;
    const annualHit = c => cv.annualCap != null && byMember.get(memberKey(c)).approved > cv.annualCap + 1e-9;
    const annualBinding = capClaims.some(annualHit);
    const perCaseBinding = capClaims.some(c => !annualHit(c) && cv.perCase != null && c.approved > cv.perCase + 1e-9);
    const caseNeed = pick(capClaims.filter(c => !annualHit(c)).map(c => c.approved).sort((a, b) => a - b));
    // A per-case cap that last year's payments ignored is not used in the cost projection.
    const perCaseEnforced = cv.perCase != null && !cl.some(c => c.paid > cv.perCase + 1e-9);
    const pressure = approved ? capUnpaid / approved : 0;
    const util = insured ? users / insured : null;
    const claimShare = claims.length ? n / claims.length : 0, paidShare = totalPaid ? paid / totalPaid : 0;
    const lowUse = complete && util != null ? util * 100 < st.lowUtil : (claimShare * 100 < st.lowClaim && paidShare * 100 < st.lowPaid);
    const protect = protectNames ? protectNames.has(cv.name) : PROTECT_RE.test(cv.name);
    const g = x => (1 + trend) * x;

    let d, newAnnual = cv.annualCap, newPerCase = cv.perCase;
    const why = [], notes = [];
    const fmt = x => fmtNum(x), pct = x => fmtPct(x);
    if (n === 0){
      if (protect){ d = "protect"; why.push("در این دوره استفاده‌ای نداشته، ولی پوشش حمایتی است: برای رویدادهای نادر و پرهزینه. نبودِ خسارت در یک سال یعنی شانس، نه بی‌نیازی."); }
      else { d = "remove"; why.push("در کل دوره هیچ خسارتی ثبت نشده است."); notes.push("صرفه‌جویی واقعی حذف را بیمه‌گر از نرخ این پوشش تعیین می‌کند؛ معمولاً کم است. می‌شود بودجه‌اش را به پوشش‌های پرفشار منتقل کرد."); }
    } else if (capUnpaid > 0 && pressure * 100 >= st.pressureMinor && new Set(capClaims.map(memberKey)).size === 1 && users >= 10){
      // One person caused all the cap shortfall: raising everyone's cap for a single case is poor value.
      d = "keep";
      const one = capClaims.reduce((a, c) => c.approved > a.approved ? c : a);
      why.push(`فقط یک نفر به سقف خورده: یک مورد استثنایی${one.service && one.service !== cv.name ? ` (${one.service})` : ""} با ${fmt(byMember.get(memberKey(one)).approved)} در برابر سقف ${fmt(cv.annualCap)}. بالا بردن سقف همهٔ ${fmtInt(users)} استفاده‌کننده برای یک مورد منطقی نیست.`);
      notes.push("برای چنین موردی، کمک موردی کارفرما یا یک پوشش مازاد جداگانه ارزان‌تر از افزایش سقف همه است.");
    } else if (capUnpaid > 0 && pressure * 100 >= st.pressureHigh){
      d = "increase";
      why.push(`${pct(pressure)} از مبلغ تأییدشده به خاطر سقف پرداخت نشده (${fmt(capUnpaid)} در ${fmtInt(capClaims.length)} مورد).`);
    } else if (capUnpaid > 0 && pressure * 100 >= st.pressureMinor){
      d = "minor";
      why.push(`به سقف خورده، ولی مبلغ پرداخت‌نشده کم است: ${fmt(capUnpaid)} (${pct(pressure)}).`);
    } else if (capUnpaid > 0){
      d = "keep";
      why.push(`فقط به‌ندرت به سقف خورده (${pct(pressure)} از مبلغ تأییدشده)؛ تغییر لازم نیست.`);
    } else if (lowUse && !protect){
      d = "reduce";
      why.push(complete && util != null ? `فقط ${pct(util)} از بیمه‌شدگان استفاده کرده‌اند.` : `فقط ${pct(claimShare)} از تعداد خسارت‌ها و ${pct(paidShare)} از مبلغ خسارت سهم این پوشش بوده است.`);
    } else {
      d = "keep";
      if (cv.annualCap) why.push(`بیشترین مصرف یک نفر ${pct(peakMember / cv.annualCap)} سقف سالانه بوده؛ سقف فعلی کافی است.`);
      else why.push("به سقف نخورده است.");
      if (lowUse && protect) notes.push("مصرف کم است، ولی چون پوشش حمایتی است کاهش پیشنهاد نمی‌شود.");
    }

    if (d === "increase" || d === "minor"){
      const bump = d === "increase" ? 0.2 : 0.1;
      if (perCaseBinding){
        newPerCase = niceUp(Math.min(cv.perCase * 2, Math.max(cv.perCase * (1 + bump), g(caseNeed))));
        why.push(`سقف هر مورد محدودکننده بوده: خسارت‌های تا ${fmt(caseNeed)} در برابر سقف ${fmt(cv.perCase)}.`);
      }
      if (annualBinding || !perCaseBinding){
        const want = Math.max(cv.annualCap * (1 + bump), annualBinding ? g(capNeedAnnual) : 0);
        newAnnual = niceUp(Math.min(cv.annualCap * 2, want));
        if (annualBinding) why.push(`سقف سالانه محدودکننده بوده: مصرف تا ${fmt(capNeedAnnual)} برای هر نفر در برابر سقف ${fmt(cv.annualCap)}.`);
        if (want > cv.annualCap * 2 + 1e-9) notes.push("افزایش به حداکثر دو برابر در یک تمدید محدود شد.");
      }
      // Single-event covers (per-case cap equal to the annual cap, e.g. maternity) keep both caps together.
      if (cv.perCase != null && cv.annualCap != null && cv.perCase >= cv.annualCap) newPerCase = Math.max(newPerCase, newAnnual);
      if (newPerCase != null && newAnnual != null && newPerCase > newAnnual) newAnnual = niceUp(newPerCase);
      if (cv.max != null && newAnnual > cv.max){ notes.push(`نیاز برآوردی (${fmt(newAnnual)}) از حداکثر مجاز پیشنهادی (${fmt(cv.max)}) بیشتر است؛ به حداکثر محدود شد.`); newAnnual = cv.max; }
      if (newPerCase != null && newAnnual != null && newPerCase > newAnnual) newPerCase = newAnnual;
      if (trend) notes.push(`سقف پیشنهادی با روند تعرفهٔ سال بعد (${pct(trend)}) تعدیل شده است.`);
    }
    if (d === "reduce"){
      const target = niceUp(Math.max(cv.min || 0, g(peakMember) * 1.5));
      if (cv.annualCap != null && target < cv.annualCap){
        newAnnual = target;
        if (newPerCase != null && newPerCase > newAnnual) newPerCase = newAnnual;
        notes.push(`سقف جدید هنوز ۱٫۵ برابر بیشترین مصرف یک نفر (${fmt(peakMember)}) جا دارد.`);
      } else { d = "keep"; why.length = 0; why.push(cv.min != null && target <= cv.min ? "مصرف کم است، ولی سقف فعلی در حداقل مجاز است؛ کاهش بیشتر ممکن نیست." : `مصرف کم است، ولی بیشترین مصرف یک نفر (${fmt(peakMember)}) به سقف فعلی نزدیک است؛ کاهش منطقی نیست.`); }
    }
    if (otherUnpaid > 0) notes.push(`${fmt(otherUnpaid)} به دلایل غیر از سقف پرداخت نشده؛ با تغییر سقف حل نمی‌شود.`);
    if (n > 0 && n < 30) notes.push(`فقط ${fmtInt(n)} خسارت؛ برای تصمیم قطعی کم است.`);

    const costOf = (annual, perCase, removed) => removed ? { paid: 0, need: project(cl, null, null, trend).need } : project(cl, annual, perCaseEnforced ? perCase : null, trend);
    return { cv, cl, n, users, paid, approved, capUnpaid, pressure, util, claimShare, paidShare, peakMember,
      protect, lowUse, d, newAnnual, newPerCase, why, notes, perCaseEnforced, costOf };
  });

  // data quality
  const claimIds = new Set(claims.map(c => c.id));
  const missing = unpaidList.filter(u => !claimIds.has(u.id)).map(u => u.id);
  if (missing.length) issues.push({ sev: "warn", text: `در شیت غیرقابل‌پرداخت به خسارت‌هایی اشاره شده که در شیت خسارت نیستند: ${missing.join("، ")}.` });
  const capLabels = [...new Set(claims.map(c => c.reason).concat(unpaidList.map(u => u.reason)).filter(r => /سقف/.test(r)))];
  if (capLabels.length > 1) issues.push({ sev: "warn", text: `علت «سقف» با چند عبارت مختلف نوشته شده (${capLabels.map(x => "«" + x + "»").join("، ")}). یکدست کنید تا تحلیل دقیق بماند.` });
  const unknownCov = [...new Set(claims.filter(c => c.cov && !covIds.has(c.cov)).map(c => c.cov))];
  if (unknownCov.length) issues.push({ sev: "crit", text: `خسارت با کد پوششی که در جدول تعهدات نیست: ${unknownCov.join("، ")}. این خسارت‌ها در تحلیل پوشش‌ها نیامده‌اند.` });
  const overCase = claims.filter(c => { const cv = coverages.find(x => x.id === c.cov); return cv && cv.perCase != null && c.paid > cv.perCase + 1e-9; });
  if (overCase.length) issues.push({ sev: "warn", text: `پرداختی بیشتر از سقف هر مورد: ${overCase.slice(0, 8).map(c => c.id).join("، ")}${overCase.length > 8 ? " و …" : ""}. یا سقف هر مورد اشتباه وارد شده یا پرداخت؛ این سقف در برآورد هزینه لحاظ نشد.` });
  const mism = claims.filter(c => Math.abs(c.approved - c.paid - c.unpaid) > 0.01);
  if (mism.length) issues.push({ sev: "warn", text: `در ${fmtInt(mism.length)} خسارت، تأییدشده منهای پرداختی با غیرقابل‌پرداخت نمی‌خواند: ${mism.slice(0, 6).map(c => c.id).join("، ")}.` });
  if (!complete) issues.push({ sev: "crit", text: `جمع خسارت‌های ثبت‌شده (${fmtNum(totalPaid)}) فقط ${fmtPct(totalPaid / premiumNow)} حق‌بیمهٔ ${current.label} است. فهرست خسارت ناقص به نظر می‌رسد؛ Loss Ratio این سال معتبر نیست و «مصرف کم» به‌جای نرخ استفاده با سهم نسبی سنجیده شد.` });
  if (current && current.persons && insured && Math.abs(current.persons - insured) / insured > 0.1)
    issues.push({ sev: "warn", text: `تعداد نفر در شیت حق‌بیمه (${fmtInt(current.persons)}) با کل بیمه‌شدگان (${fmtInt(insured)}) فرق دارد؛ احتمالاً فقط افراد اصلی شمرده شده‌اند و سرانه‌ها اشتباه می‌شود.` });
  if (group.female != null && group.male != null && Math.abs(group.female + group.male - 1) > 0.01)
    issues.push({ sev: "warn", text: "جمع درصد زن و مرد ۱۰۰٪ نمی‌شود." });
  if (span && span < 24) issues.push({ sev: "info", text: `دادهٔ خسارت ${fmtInt(span)} ماه را پوشش می‌دهد. برای پیشنهاد حذف یا کاهش، ۲۴ تا ۳۶ ماه داده بهتر است.` });
  if (!tariffs.length) issues.push({ sev: "info", text: "تعرفهٔ سال بعد وارد نشده؛ روند هزینه صفر فرض شد." });

  const lr = complete && premiumNow ? totalPaid / premiumNow : null;
  const priorLr = prior ? prior.paid / prior.premium : null;
  return { group, rows, trend, totalPaid, totalApproved, totalUnpaid, insured, current, prior, premiumNow, complete, lr, priorLr,
    span, level, claimsCount: claims.length, issues, targetLR: st.targetLR / 100, renewal: renewalInfo(group.period) };
}

/* ---------- scenarios ---------- */
// Each scenario picks caps per coverage; cost is last year's claims replayed under those caps.
function scenarios(A, budgetPct){
  const keep = r => ({ annual: r.cv.annualCap, perCase: r.cv.perCase, removed: false, changed: false });
  const rec = r => ({ annual: r.newAnnual, perCase: r.newPerCase, removed: r.d === "remove", changed: r.d !== "keep" && r.d !== "protect" });
  const up = r => r.d === "increase" || r.d === "minor", down = r => r.d === "reduce" || r.d === "remove";
  const index = r => {
    const a = r.cv.annualCap != null ? niceUp(r.cv.annualCap * (1 + A.trend)) : null;
    const p = r.cv.perCase != null ? Math.min(niceUp(r.cv.perCase * (1 + A.trend)), a ?? Infinity) : null;
    return { annual: a, perCase: p, removed: false, changed: A.trend > 0 };
  };
  const premiumPlus = r => {
    const x = rec(r), a = x.annual != null ? niceUp(x.annual * 1.2) : null;
    return { annual: a, perCase: x.perCase != null && x.perCase === x.annual ? a : x.perCase, removed: false, changed: true };
  };
  const plans = {
    economy: A.rows.map(r => r.d === "increase" || down(r) ? rec(r) : keep(r)),
    balanced: A.rows.map(rec),
    premium: A.rows.map(r => up(r) ? premiumPlus(r) : index(r)),
    current: A.rows.map(keep),
  };

  const evalPlan = caps => {
    let paid = 0, need = 0;
    const per = A.rows.map((r, i) => { const c = r.costOf(caps[i].annual, caps[i].perCase, caps[i].removed); paid += c.paid; need += c.need; return c.paid; });
    return { caps, paid, need, per };
  };

  // Budget: the employer's premium-increase ceiling. With complete data it converts to a claims ceiling at the
  // target loss ratio; with incomplete data it is applied to the growth of the recorded claims instead.
  const budget = budgetPct != null ? budgetPct : (A.group.budget != null ? A.group.budget : 0.25);
  const allowed = A.complete && A.premiumNow ? A.premiumNow * (1 + budget) * A.targetLR : A.totalPaid * (1 + budget);
  const start = A.rows.map(r => down(r) ? rec(r) : keep(r));
  let caps = start.slice(), cur = evalPlan(caps);
  const picked = [], skipped = [];
  A.rows.map((r, i) => ({ r, i })).filter(x => up(x.r)).sort((a, b) => b.r.pressure - a.r.pressure).forEach(({ r, i }) => {
    const trial = caps.slice(); trial[i] = rec(r);
    const t = evalPlan(trial);
    if (t.paid <= allowed + 1e-9){ caps = trial; cur = t; picked.push(r.cv.name); } else skipped.push(r.cv.name);
  });

  const out = {};
  for (const k of Object.keys(plans)) out[k] = evalPlan(plans[k]);
  out.budget = Object.assign(cur, { picked, skipped, allowed, fits: cur.paid <= allowed + 1e-9 });
  for (const k of Object.keys(out)){
    const s = out[k];
    s.change = A.totalPaid ? s.paid / A.totalPaid - 1 : null;
    s.cover = s.need ? s.paid / s.need : null;
    s.premiumNeeded = A.complete && A.premiumNow ? s.paid / A.targetLR : null;
    s.premiumChange = s.premiumNeeded != null ? s.premiumNeeded / A.premiumNow - 1 : null;
  }
  out.budgetPct = budget;
  return out;
}

const nf1 = new Intl.NumberFormat("fa-IR", { maximumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat("fa-IR", { maximumFractionDigits: 0 });
function fmtNum(x){ return x == null || isNaN(x) ? "—" : (Math.abs(x) >= 100 ? nf0 : nf1).format(x); }
function fmtInt(x){ return x == null || isNaN(x) ? "—" : nf0.format(x); }
function fmtPct(x){ if (x == null || isNaN(x)) return "—"; const v = x * 100; return new Intl.NumberFormat("fa-IR", { maximumFractionDigits: Math.abs(v) < 1 ? 2 : 1 }).format(v) + "٪"; }
function fmtSignedPct(x){ return x == null || isNaN(x) ? "—" : (x > 0 ? "+" : "") + fmtPct(x); }

   S-01 renewal in days + an unused cover to drop + all within budget
   S-02 healthy group: better benefits for about the same premium; unused ambulance is kept
   S-03 loss-making group, budget not enough, one huge surgery that must not set everyone's cap
   S-04 young workforce: budget fits one increase but not the other
   S-05 older staff: per-case cap on drugs, an underused cover to shrink, data-quality warnings */
function makeSamples(today){

  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const logn = (mean, sigma) => { const z = Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd()); return mean * Math.exp(sigma * z - sigma * sigma / 2); };
  const r1 = x => Math.round(x * 10) / 10;
  const jOf = d => g2j(d.getFullYear(), d.getMonth() + 1, d.getDate());
  const now = new Date();
  const t = today || jOf(now);

  const dateBack = k => { let y = t[0], m = t[1] - k; while (m < 1){ m += 12; y--; } return `${y}/${pad(m)}/${pad(1 + Math.floor(rnd() * 28))}`; };
  // Contract periods are set relative to today, so "days to renewal" stays the same on every demo day.
  const period = days => { const e = today ? [t[0], t[1], t[2]] : jOf(new Date(now.getTime() + days * 86400000));
    if (today){ let y = e[0], m = e[1], d = e[2] + days; while (d > 30){ d -= 30; m++; if (m > 12){ m = 1; y++; } } e[0] = y; e[1] = m; e[2] = d; }
    return `${e[0] - 1}/${pad(e[1])}/${pad(e[2])}-${e[0]}/${pad(e[1])}/${pad(e[2])}`; };

/* ---------- tender / new contract pricing ----------
   Input: 1–3 years of a group's history with its previous insurers (per coverage per year),
   the coverages and caps proposed for the new contract, and next year's tariffs.
   Output: expected claims for the contract year, the premium that keeps the loss ratio under
   target with a safety margin, the break-even floor, and per-coverage findings. */

function parseTender(sheets){
  const warn = [];
  const S = {
    pop: sheets[findSheet(sheets, "01", ["جمعیت"])],
    cov: sheets[findSheet(sheets, "02", ["تعهدات"])],
    clm: sheets[findSheet(sheets, "03", ["خسارت"])],
    prm: sheets[findSheet(sheets, "05", ["حق"])],
    trf: sheets[findSheet(sheets, "06", ["تعرفه"])],
    his: sheets[Object.keys(sheets).find(n => norm(n).includes("سابقه"))],
  };
  const base = { group: { name: "مناقصهٔ بدون نام", total: null } };
  const tp = table(S.pop, "Group_ID");
  if (tp && tp.rows[0]){
    const r = tp.rows[0], g = (n, f) => { const i = col(tp, [n], -1); return r[i >= 0 ? i : f]; };
    const parts = ["اصلی","همسر","فرزند","سایر وابسته"].map((n, k) => num(g(n, 6 + k)) || 0);
    base.group = { id: str(r[0]), name: str(g("نام بیمه‌گذار", 1)) || "مناقصهٔ بدون نام", industry: str(g("صنعت", 2)), province: str(g("استان", 3)),
      period: str(g("دوره قرارداد", 4)), parts, total: num(g("کل نفرات", 10)) || parts.reduce((a, b) => a + b, 0) || null };
  } else warn.push({ sev: "warn", text: "تعداد بیمه‌شدگان قرارداد جدید پیدا نشد؛ تعداد نفرات آخرین سال سابقه به کار رفت." });

  const tc = table(S.cov, "Coverage_ID");
  if (!tc) throw new Error("جدول تعهدات قرارداد جدید پیدا نشد. شیتی با سرستون Coverage_ID لازم است.");
  const ci = (n, f) => { const i = col(tc, [n], -1); return i >= 0 ? i : f; };
  const coverages = tc.rows.map(r => ({ id: str(r[0]), name: str(r[ci("پوشش", 1)]), annualCap: num(r[ci("سقف سالانه فعلی", 2)]), perCase: num(r[ci("سقف هر مورد", 3)]),
    min: num(r[ci("حداقل پیشنهادی", 8)]), max: num(r[ci("حداکثر پیشنهادی", 9)]) }));

  const premiums = {};
  (S.prm || []).forEach(r => { if (!r) return; const y = latin(norm(r[0])).match(/(\d{4})/); if (y && num(r[2])) premiums[+y[1]] = { premium: num(r[2]), insured: num(r[1]) }; });

  const years = {};
  const yearOf = y => years[y] || (years[y] = { year: y, insured: null, premium: null, cov: {} });
  const covOf = (Y, id, name) => Y.cov[id] || (Y.cov[id] = { id, name, claims: 0, users: 0, approved: 0, paid: 0, capUnpaid: 0, oldCap: null });

  const th = table(S.his, "سال");
  if (th){
    // Aggregated history, the usual form in tender documents: one row per year and coverage.
    const h = (n, f) => col(th, [n], f);
    const H = { cid: h("Coverage_ID", 1), name: h("پوشش", 2), insured: h("تعداد بیمه‌شده", 3), claims: h("تعداد خسارت", 4), users: h("تعداد استفاده‌کننده", 5),
      approved: h("مبلغ تاییدشده", 6), paid: h("پرداختی", 7), capUnpaid: h("پرداخت‌نشده به خاطر سقف", 8), cap: h("سقف سالانه", 9) };
    th.rows.forEach(r => {
      const y = latin(norm(r[0])).match(/(\d{4})/); if (!y) return;
      const Y = yearOf(+y[1]);
      if (num(r[H.insured])) Y.insured = num(r[H.insured]);
      const c = covOf(Y, str(r[H.cid]), str(r[H.name]));
      c.claims += num(r[H.claims]) || 0; c.users += num(r[H.users]) || 0;
      c.paid += num(r[H.paid]) || 0; c.approved += num(r[H.approved]) || num(r[H.paid]) || 0;
      c.capUnpaid += num(r[H.capUnpaid]) || 0; if (num(r[H.cap])) c.oldCap = num(r[H.cap]);
    });

    // Claim-level history: bucket claims by the Jalali year of their date.
    const tl = table(S.clm, "Claim_ID");
    if (!tl) throw new Error("سابقهٔ خسارت پیدا نشد. یا شیت «سابقه» (هر سال و پوشش یک ردیف) یا شیت خسارت با تاریخ لازم است.");
    const li = (n, f) => col(tl, [n], f);
    const L = { member: li("Member_ID", 1), date: li("Claim_Date", 2), cov: li("Coverage_ID", 3), covName: li("پوشش", 4), approved: li("مبلغ تاییدشده", 9), paid: li("پرداختی", 10), unpaid: li("غیرقابل پرداخت", 11), reason: li("علت عدم پرداخت", 12) };
    const members = {};
    tl.rows.forEach(r => {
      const j = parseJ(r[L.date]); if (!j) return;
      const Y = yearOf(j[0]), c = covOf(Y, str(r[L.cov]), str(r[L.covName]));
      const approved = num(r[L.approved]) || 0, paid = num(r[L.paid]) || 0, unpaid = num(r[L.unpaid]) ?? Math.max(0, approved - paid);

      const k = Y.year + "|" + c.id; (members[k] = members[k] || new Set()).add(str(r[L.member]) || str(r[0]));
    });
    Object.entries(members).forEach(([k, s]) => { const [y, id] = k.split("|"); years[y].cov[id].users = s.size; });
  }
  Object.values(years).forEach(Y => { const p = premiums[Y.year]; if (p){ Y.premium = p.premium; if (!Y.insured) Y.insured = p.insured; } });

  const tt = table(S.trf, "Service_ID");
  const tariffs = tt ? tt.rows.map(r => ({ name: str(r[1]), old: num(r[2]), next: num(r[3]), pt: num(r[4]) })).filter(t => t.old > 0 && t.next != null) : [];
  return { group: base.group, coverages, years: Object.values(years).sort((a, b) => a.year - b.year), tariffs, warn };
}

      d = "growth";
      why = `سرانهٔ این پوشش در یک سال ${fmtPct(growth)} رشد کرده؛ بیشتر از تورم تعرفه. در قیمت لحاظ شده، ولی ریسک ادامهٔ رشد هست.`;
    } else if (!protect && util * 100 < st.lowUtil){

      why = `فقط ${fmtPct(util)} افراد استفاده کرده‌اند؛ سقف کمتر یا فرانشیز بیشتر قیمت را پایین می‌آورد.`;

      cnt("increase").concat(cnt("minor")).length ? `کارکنان در ${esc(cnt("increase").concat(cnt("minor")).map(name).join("، "))} به سقف خورده‌اند؛ جمعاً ${fmtNum(sum(rows, r => r.capUnpaid))} از جیب داده‌اند.` : null,
      cnt("remove").length || cnt("reduce").length ? `صرفه‌جویی: ${esc(cnt("remove").map(name).concat(cnt("reduce").map(name)).join("، "))} کم‌مصرف یا بی‌مصرف‌اند.` : null,
      rows.some(isOutlier) ? `${esc(rows.filter(isOutlier).map(name).join("، "))}: فقط یک مورد استثنایی؛ افزایش سقف همه لازم نیست.` : null,
      `پیشنهاد: سناریوی متعادل ${S.balanced.premiumChange != null ? `با ${fmtSignedPct(S.balanced.premiumChange)} حق‌بیمه` : ""}؛ پوشش نیاز کارکنان ${fmtPct(S.current.cover)} ← ${fmtPct(S.balanced.cover)}.`,
      `بودجهٔ ${fmtPct(S.budgetPct)} ${B.fits ? (B.picked.length ? `برای ${esc(B.picked.join("، "))} کافی است.` : "فقط کاهش‌ها را می‌پوشاند.") : "حتی برای حفظ وضع فعلی کافی نیست."}`,
    ].filter(Boolean);

const raw2 = q => q.raw;

/* ---------- tender brain ---------- */
function tenderSuggest(R){
  const inc = R.rows.find(r => r.d === "increase"), gr = R.rows.find(r => r.d === "growth");
  return ["این قیمت چطور ساخته شد؟", `اگر ${fmtInt(Math.round(R.floor * 0.95 / 100) * 100)} پیشنهاد بدهیم ریسکش چیست؟`, R.priorScaled ? "بیمه‌گر قبلی چه وضعی داشت؟" : null,
    gr ? `چرا ${gr.cv.name} گران شده؟` : "کدام پوشش‌ها گران‌تر شده‌اند؟", inc ? `چرا ${inc.cv.name} امتیاز است؟` : null, "حاشیهٔ اطمینان از کجا آمده؟"].filter(Boolean).slice(0, 5);
}
function tenderAnswer(raw, R, t){
  const q = Q(raw), file = t.file || (t.sample ? "دادهٔ نمونه" : "فایل اکسل");
  return aiCard(tenderBrain(q, R, t) || { h: "<div>این را دقیق نفهمیدم. دربارهٔ قیمت پیشنهادی، کف قیمت، ریسک یک قیمت مشخص، حاشیهٔ اطمینان، بیمه‌گر قبلی، رشد پوشش‌ها، سابقه و کیفیت داده بپرسید.</div>", next: tenderSuggest(R).slice(0, 3) }, file);
}
function tenderBrain(q, R, t){
  if (!q.n) return null;
  const gl = glossary(q); if (gl) return gl;
  const last = R.hist[R.hist.length - 1];
  const big = q.nums.filter(x => x >= 1000);
  if (big.length){
    const v = big[0], z = RISK[R.risk(v)[0]];
    return { h: `<div>با قیمت <b>${fmtNum(v)}</b>: Loss Ratio مورد انتظار <b>${fmtPct(R.expected / v)}</b> · ریسک <span class="tag ${z[3]}">${z[1]}</span></div>${ul([`کف قیمت (LR ${fmtPct(R.LR)}): ${fmtNum(R.floor)} · ${v >= R.floor ? `${fmtNum(v - R.floor)} بالاتر` : `${fmtNum(R.floor - v)} پایین‌تر`}`, `قیمت پیشنهادی اپ: ${fmtNum(R.price)}`, R.priorScaled ? `بیمه‌گر قبلی: ${fmtNum(R.priorScaled)} · ${v < R.priorScaled ? `${fmtPct(1 - v / R.priorScaled)} ارزان‌تر` : `${fmtPct(v / R.priorScaled - 1)} گران‌تر`}` : null, `سرانه: ${fmtNum(v / R.insuredNext)}`].filter(Boolean))}`,
      src: ["منبع: {file} · سابقهٔ خسارت", `قاعده: LR = ${fmtNum(R.expected)} ÷ قیمت`] };
  }
  if (q.has("حاشیه", "اطمینان", "مارجین", "margin")){
    const parts = [`پایه ۳٪`, `نصف نوسان سال‌ها (${fmtPct(R.vol)}) = ${fmtPct(R.vol / 2)}`, R.n === 1 ? "+۵٪ چون فقط یک سال سابقه هست" : null, R.claimsLast < 300 ? "+۵٪ چون دادهٔ خسارت کم است" : null].filter(Boolean);
    return { h: `<div>حاشیهٔ ${t.margin == null ? "خودکار" : "دستی"}: <b>${fmtPct(R.margin)}</b>${t.margin != null ? ` (خودکار بود ${fmtPct(R.autoMargin)})` : ""}.</div>${t.margin == null ? ul(parts) + '<div class="small muted">بین ۳٪ تا ۲۵٪ محدود می‌شود.</div>' : ""}`, src: ["قاعده: حاشیهٔ خودکار اپ"] };
  }
  if (q.has("چطور", "چگونه", "محاسبه", "ساخته", "از کجا", "فرمول", "چرا این قیمت", "قیمت پیشنهادی")){
    return { h: `<div>قیمت در چهار قدم:</div>${ul([`سرانهٔ خسارت هر سال: ${R.hist.map(h => fmtNum(h.pc)).join(" · ")}`, `با تورم ${fmtPct(R.trend)} به سال قرارداد و میانگین وزنی (سال آخر وزن بیشتر)`, `× ${fmtInt(R.insuredNext)} نفر = خسارت برآوردی <b>${fmtNum(R.expected)}</b>`, `÷ ${fmtPct(R.LR)} = کف <b>${fmtNum(R.floor)}</b>؛ + حاشیه ${fmtPct(R.margin)} = <b>${fmtNum(R.price)}</b>`])}`,
      src: ["منبع: {file} · سابقهٔ خسارت و جمعیت", "قاعده: وزن سال‌ها ۴۰/۶۰ یا ۲۰/۳۰/۵۰"] };
  }
  if (q.has("قبلی", "بیمه گر قبل", "بیمهگر قبل", "رقیب", "قبلا", "سال قبل")){
    if (!R.priorScaled) return { h: "<div>حق‌بیمهٔ بیمه‌گر قبلی در فایل نیست.</div>" };
    return { h: `<div>بیمه‌گر قبلی (برای ${fmtInt(R.insuredNext)} نفر): <b>${fmtNum(R.priorScaled)}</b>؛ Loss Ratio سال آخرش <b>${fmtPct(last.lr)}</b> (${lrStat(last.lr)[1]}).</div><div>${R.priorScaled < R.floor ? `قیمت او زیر کف است؛ اگر تکرارش کنید LR شما ${fmtPct(R.expected / R.priorScaled)} می‌شود.` : `می‌توانید تا ${fmtPct(1 - R.floor / R.priorScaled)} ارزان‌تر از او بدهید و هنوز روی هدف بمانید.`}</div>`,
      src: ["منبع: {file} · حق‌بیمه و خسارت سال‌های سابقه"] };
  }
  if (q.has("ریسک", "خطر")){
    return { h: `${ul([`<span class="tag t-good">کم</span> بالای ${fmtNum(R.floor)} (LR ≤ ${fmtPct(R.LR)})`, `<span class="tag t-mid">متوسط</span> ${fmtNum(R.floor85)} تا ${fmtNum(R.floor)} (LR تا ۸۵٪)`, `<span class="tag t-bad">زیاد</span> زیر ${fmtNum(R.floor85)}`])}`, src: [`قاعده: LR = ${fmtNum(R.expected)} ÷ قیمت`] };
  }
  const covs = findCovs(q, R.rows, r => r.cv.name);
  if (covs.length){
    const r = covs[0];
    return { h: `<div><b>${esc(r.cv.name)}</b>: <span class="tag ${TTAG[r.d]}">${TLABEL[r.d]}</span> ${esc(r.why)}</div>${ul([`سرانه در سال‌ها: ${r.per.map(p => fmtNum(p.pc)).join(" · ")}`, `سرانهٔ برآوردی: <b>${fmtNum(r.projPc)}</b>${r.growth != null ? ` · رشد ${fmtSignedPct(r.growth)}` : ""}`, `سقف قبلی ${fmtNum(r.oldCap)} ← جدید ${fmtNum(r.cv.annualCap)}`, r.capCost ? `هزینهٔ بالا بردن سقف: حدود ${fmtNum(r.capCost)} حق‌بیمه` : null].filter(Boolean))}`, src: ["منبع: {file} · سابقهٔ خسارت به تفکیک پوشش"] };
  }
  if (q.has("گران", "رشد", "سریع", "افزایش", "بیشترین")){
    const list = R.rows.filter(r => r.growth != null).sort((a, b) => b.growth - a.growth).slice(0, 4);
    return { h: `<div>بیشترین رشد سرانه (تورم تعرفه ${fmtPct(R.trend)}):</div>${ul(list.map(r => `<b>${esc(r.cv.name)}</b>: ${fmtSignedPct(r.growth)} · سرانه ${fmtNum(r.projPc)}`))}`, src: ["منبع: {file} · سابقهٔ خسارت"] };
  }
  if (q.has("سابقه", "سال", "تاریخچه")) return { h: ul(R.hist.map(h => `${fmtInt(h.year).replace(/٬/g, "")}: ${fmtInt(h.insured)} نفر · خسارت ${fmtNum(h.paid)} · حق‌بیمه ${fmtNum(h.premium)} · LR ${fmtPct(h.lr)}`)), src: ["منبع: {file} · سابقه"] };
  if (q.has("کیفیت", "مشکل", "خطا", "ناقص")) return { h: R.issues.length ? ul(R.issues.map(x => `<span class="tag ${SEVTAG[x.sev][0]}">${SEVTAG[x.sev][1]}</span> ${esc(x.text)}`)) : "<div>مشکلی پیدا نشد.</div>" };
  if (q.has("کف")) return { h: `<div>کف قیمت: <b>${fmtNum(R.floor)}</b> = خسارت برآوردی ${fmtNum(R.expected)} ÷ ${fmtPct(R.LR)}.</div>` };
  if (q.has("سرانه")) return { h: `<div>سرانهٔ پیشنهادی: <b>${fmtNum(R.price / R.insuredNext)}</b> · سرانهٔ خسارت برآوردی: ${fmtNum(R.expected / R.insuredNext)}.</div>` };
  return null;
}

/* ---------- portfolio brain (home) ---------- */
function portfolioSuggest(){
  return ["کدام گروه‌ها زیان‌ده‌اند؟", "تمدیدهای نزدیک کدام‌اند؟", "کدام گروه‌ها بودجه‌شان کافی نیست؟", "دندانپزشکی در همهٔ گروه‌ها چه وضعی دارد؟", "خلاصهٔ پرتفوی"];
}
function portfolioAnswer(raw){
  const all = state.groups.map((g, i) => Object.assign({ i, g }, compute(g)));
  const q = Q(raw);
  return aiCard(portfolioBrain(q, all) || { h: "<div>این را دقیق نفهمیدم. دربارهٔ گروه‌های زیان‌ده، تمدیدهای نزدیک، بودجه‌های ناکافی، یک پوشش در همهٔ گروه‌ها، یا نام یک گروه بپرسید.</div>", next: portfolioSuggest().slice(0, 3) }, "همهٔ فایل‌ها");
}
function portfolioBrain(q, all){
  if (!q.n) return null;
  const nm = x => esc(short(x.A.group.name)), open = x => `<button class="ai-link" type="button" data-open="${x.i}">${nm(x)}</button>`;
  const gl = glossary(q); if (gl) return gl;

  const named = all.filter(x => { const w = qn(short(x.A.group.name)).split(" ").filter(s => s.length >= 3 && !/^(شرکت|گروه|نمونه)$/.test(s)); return w.some(s => q.toks.some(t => t.length >= 3 && (t.startsWith(s.slice(0, 4)) || s.startsWith(t)))); });
  // a coverage across groups
  const covHits = all.map(x => ({ x, r: findCovs(q, x.A.rows, r => r.cv.name)[0] })).filter(y => y.r);
  if (covHits.length && (!named.length || q.has("همه", "گروه ها", "گروهها", "تمام", "کل"))){
    return { h: `<div><b>${esc(covHits[0].r.cv.name)}</b> در ${fmtInt(covHits.length)} گروه:</div>${ul(covHits.map(({ x, r }) => `${open(x)}: <span class="tag ${DTAG[r.d]}">${DLABEL[r.d]}</span> ${capStr(r)}${r.capUnpaid ? ` · فشار ${fmtPct(r.pressure)}` : ""}`))}`, src: ["منبع: فایل هر گروه · ۰۳_خسارت"] };
  }
  if (named.length === 1){
    const x = named[0], A = x.A, S = x.S, st = lrStat(A.lr ?? A.priorLr);
    const c = d => A.rows.filter(r => r.d === d).length;
    return { h: `<div>${open(x)}: ${fmtInt(A.insured)} نفر · Loss Ratio ${fmtPct(A.lr ?? A.priorLr)}${st ? ` (${st[1]})` : ""} · ${A.renewal ? (A.renewal.days < 0 ? `${fmtInt(-A.renewal.days)} روز از تمدید گذشته` : `تمدید ${fmtInt(A.renewal.days)} روز دیگر`) : ""}</div>${ul([`${fmtInt(c("increase") + c("minor"))} افزایش · ${fmtInt(c("reduce"))} کاهش · ${fmtInt(c("remove"))} حذف`, `سناریوی متعادل: ${S.balanced.premiumChange != null ? fmtSignedPct(S.balanced.premiumChange) : "—"} حق‌بیمه · بودجه ${fmtPct(S.budgetPct)} ${S.budget.fits ? "کافی" : "ناکافی"}`])}<div class="small muted">برای جزئیات، روی نام گروه بزنید.</div>`, src: [`منبع: ${x.g.file || "دادهٔ نمونه"}`] };
  }
  if (q.has("مناقصه")){
    const ts = state.tenders.map((t, i) => ({ i, R: computeTender(t) }));
    return { h: ul(ts.map(({ i, R }) => `<button class="ai-link" type="button" data-tender="${i}">${esc(short(R.group.name))}</button>: قیمت پیشنهادی ${fmtNum(R.price)}${R.priorScaled ? ` · بیمه‌گر قبلی ${fmtNum(R.priorScaled)} (ریسک ${RISK[R.risk(R.priorScaled)[0]][1]})` : ""}`)), src: ["منبع: سابقهٔ هر مناقصه"] };
  }
  if (q.has("زیان", "ضرر", "loss", "لاس", "بحرانی", "بد", "خطرناک", "مرزی")){
    const list = all.filter(x => (x.A.lr ?? x.A.priorLr) != null).sort((a, b) => (b.A.lr ?? b.A.priorLr) - (a.A.lr ?? a.A.priorLr));
    const bad = list.filter(x => (x.A.lr ?? x.A.priorLr) >= 0.75);
    return { h: bad.length ? `<div>${fmtInt(bad.length)} گروه بالای ۷۵٪:</div>${ul(bad.map(x => `${open(x)}: <b style="color:${lrStat(x.A.lr ?? x.A.priorLr)[2]}">${fmtPct(x.A.lr ?? x.A.priorLr)}</b> ${lrStat(x.A.lr ?? x.A.priorLr)[1]}`))}` : "<div>هیچ گروهی بالای ۷۵٪ نیست.</div>", src: ["قاعده: زیر ۷۵٪ سالم · ۷۵ تا ۸۵٪ مرزی · بالای ۸۵٪ زیان‌ده"] };
  }
  if (q.has("تمدید", "نزدیک", "سررسید", "مانده", "فوری")){
    const list = all.filter(x => x.A.renewal).sort((a, b) => a.A.renewal.days - b.A.renewal.days).slice(0, 5);
    return { h: ul(list.map(x => `${open(x)}: ${x.A.renewal.days < 0 ? `<b style="color:var(--bad)">${fmtInt(-x.A.renewal.days)} روز گذشته</b>` : `${fmtInt(x.A.renewal.days)} روز`} (${esc(x.A.renewal.end)})`)), src: ["منبع: دورهٔ قرارداد هر گروه"] };
  }
  if (q.has("بودجه")){
    const bad = all.filter(x => !x.S.budget.fits);
    return { h: bad.length ? `<div>${fmtInt(bad.length)} گروه با بودجهٔ ناکافی:</div>${ul(bad.map(x => `${open(x)}: بودجه ${fmtPct(x.S.budgetPct)}، لازم ${x.S.current.premiumChange != null ? fmtSignedPct(x.S.current.premiumChange) : "—"}`))}` : "<div>بودجهٔ همهٔ گروه‌ها دست‌کم برای حفظ وضع فعلی کافی است.</div>", src: ["قاعده: حق‌بیمه × (۱ + بودجه) × Loss Ratio هدف"] };
  }
  if (q.has("حق بیمه", "حقبیمه", "افزایش لازم", "گران")){
    const list = all.filter(x => x.S.balanced.premiumChange != null).sort((a, b) => b.S.balanced.premiumChange - a.S.balanced.premiumChange).slice(0, 5);
    return { h: `<div>بیشترین افزایش حق‌بیمهٔ لازم (سناریوی متعادل):</div>${ul(list.map(x => `${open(x)}: <b>${fmtSignedPct(x.S.balanced.premiumChange)}</b>`))}`, src: ["قاعده: خسارت برآوردی ÷ Loss Ratio هدف"] };
  }
  const dec = decOf(q);
  if (dec && dec !== "outlier"){
    const list = all.map(x => ({ x, rs: x.A.rows.filter(r => r.d === dec || (dec === "increase" && r.d === "minor")) })).filter(y => y.rs.length);
    return { h: list.length ? ul(list.map(({ x, rs }) => `${open(x)}: ${esc(rs.map(r => r.cv.name).join("، "))}`)) : "<div>موردی نیست.</div>", src: [RULE()[dec]] };
  }
  if (q.has("کیفیت", "ناقص", "مشکل", "خطا")){
    const list = all.filter(x => x.A.issues.some(i => i.sev === "crit"));
    return { h: list.length ? ul(list.map(x => `${open(x)}: ${esc(x.A.issues.find(i => i.sev === "crit").text)}`)) : "<div>هیچ گروهی مشکل بحرانی داده ندارد.</div>", src: ["قاعده: بررسی‌های کیفیت دادهٔ اپ"] };
  }
  if (q.has("بزرگ", "بیشترین نفر", "پرجمعیت")){
    const list = all.slice().sort((a, b) => (b.A.insured || 0) - (a.A.insured || 0)).slice(0, 5);
    return { h: ul(list.map(x => `${open(x)}: ${fmtInt(x.A.insured)} نفر · حق‌بیمه ${fmtNum(x.A.premiumNow)}`)) };
  }
  if (q.has("خلاصه", "وضعیت", "پرتفوی", "کل", "همه", "گزارش", "چند گروه")){
    const comp = all.filter(x => x.A.complete && x.A.premiumNow), plr = sum(comp, x => x.A.premiumNow) ? sum(comp, x => x.A.totalPaid) / sum(comp, x => x.A.premiumNow) : null;
    const todo = buildTodo(all);
    return { h: ul([`${fmtInt(all.length)} گروه · ${fmtInt(sum(all, x => x.A.insured || 0))} نفر · حق‌بیمه ${fmtNum(sum(all, x => x.A.premiumNow || 0))}`, `Loss Ratio پرتفوی ${fmtPct(plr)}${lrStat(plr) ? ` (${lrStat(plr)[1]})` : ""}`, `${fmtInt(all.filter(x => (x.A.lr ?? 0) >= 0.85).length)} گروه زیان‌ده · ${fmtInt(all.filter(x => !x.S.budget.fits).length)} بودجهٔ ناکافی`, `${fmtInt(todo.filter(t => t.sev === "crit").length)} کار فوری · ${fmtInt(todo.filter(t => t.sev === "ok").length)} فرصت`]), next: ["کدام گروه‌ها زیان‌ده‌اند؟", "تمدیدهای نزدیک کدام‌اند؟"] };
  }
  return null;
}

/* ---------- panel ---------- */
function assistant(key, A, S, g){

function buildTodo(all){
  const todo = [];
  all.forEach(x => {
    const { A, S } = x, name = A.group.name;
    if (A.renewal && A.renewal.days >= 0 && A.renewal.days <= 60) todo.push({ sev: A.renewal.days <= 30 ? "crit" : "warn", w: 100 - A.renewal.days, i: x.i, name, text: `تمدید ${fmtInt(A.renewal.days)} روز دیگر؛ پیشنهاد سقف‌ها و سناریوها را برای جلسه آماده کنید.` });
    if (A.renewal && A.renewal.days < 0) todo.push({ sev: "crit", w: 120, i: x.i, name, text: `قرارداد ${fmtInt(-A.renewal.days)} روز پیش تمام شده است.` });
    if (A.lr != null && A.lr >= 0.85) todo.push({ sev: "crit", w: 90, i: x.i, name, text: `زیان‌ده: Loss Ratio ${fmtPct(A.lr)}؛ حتی با سقف‌های فعلی حق‌بیمه باید ${fmtSignedPct(S.current.premiumChange)} تغییر کند.` });
    if (!S.budget.fits) todo.push({ sev: "warn", w: 70, i: x.i, name, text: `بودجهٔ کارفرما (${fmtSignedPct(S.budgetPct)}) حتی برای حفظ وضع فعلی کافی نیست${S.current.premiumChange != null ? `؛ لازم: ${fmtSignedPct(S.current.premiumChange)}` : ""}.` });
    if (!A.complete) todo.push({ sev: "warn", w: 50, i: x.i, name, text: "فهرست خسارت ناقص است؛ پیش از مذاکره دادهٔ کامل بگیرید." });
    const bal = S.balanced, cur = S.current;
    if (bal.premiumChange != null && bal.premiumChange <= 0.02 && A.rows.some(r => r.d === "increase" || r.d === "minor"))
      todo.push({ sev: "ok", w: 60, i: x.i, name, text: `مزایای بهتر با حق‌بیمهٔ ${fmtPct(Math.abs(bal.premiumChange))} ${bal.premiumChange < 0 ? "کمتر" : "بیشتر"}؛ سهم کارکنان ${fmtPct(1 - cur.cover)} ← ${fmtPct(1 - bal.cover)}.` });
    const rm = A.rows.filter(r => r.d === "remove" || r.d === "reduce");
    if (rm.length) todo.push({ sev: "ok", w: 30, i: x.i, name, text: `صرفه‌جویی: ${rm.map(r => r.cv.name).join("، ")} کم‌مصرف یا بی‌مصرف.` });

  });
  return todo;
}

  else if (p.startsWith("soon:")) renderSoon(p.slice(5));

function go(page, idx, back){
  if (page === "tender" || page === "tenderp") state.mode = "tender"; else if (page === "home" || page === "renewal" || page === "group") state.mode = "renewal";
  if (SOON[page]) page = "soon:" + page;
  if (!back && (page !== state.page || (idx ?? null) !== state.idx)){
    state.hist.push([state.page, state.idx]);
    // Mirror each step in the browser history so the phone's back gesture works too.
    try { history.pushState({ ri: state.hist.length }, ""); state.pushed++; } catch (e) {}
  }
  state.page = page; state.idx = idx ?? null; render(); window.scrollTo(0, 0);
}
const PARENT = { group: "renewal", tenderp: "tender", login: "admin" };
function goBack(){
  const p = state.hist.pop();
  if (p) go(p[0], p[1], true); else go(PARENT[state.page] || "home", null, true);
}
addEventListener("popstate", () => { state.pushed = Math.max(0, state.pushed - 1); $("modal").hidden = true; closeMenu(); goBack(); });

/* Theme: follows the system until the user picks; the choice is remembered on this device. */

function toggleTheme(){
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark"; applyTheme(t); try { localStorage.setItem("ri-theme", t); } catch (e) {}
}
function jump(id){ const el = $(id); if (el) el.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });

    return; }
  if (t.closest("[data-theme-toggle]")){ toggleTheme(); return; }
  if (t.closest("[data-back]")){ if (state.pushed > 0) history.back(); else goBack(); return; }

  const st = t.closest("[data-step]"); if (st){ const el = $(st.dataset.step); el.value = (parseFloat(el.value) || 0) + parseFloat(st.dataset.d); el.dispatchEvent(new Event("change")); return; }
  const a = t.closest("[data-ask]"); if (a){ ask(a.dataset.ask); return; }
  if (t.closest("[data-close]") || t.id === "modal"){ $("modal").hidden = true; return; }
  const o = t.closest("[data-open]"); if (o && $("view").contains(o)){ go(state.mode === "tender" ? "tenderp" : "group", +o.dataset.open); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ $("modal").hidden = true; closeMenu(); }
  const lk = e.target.closest && e.target.closest(".isl[data-go][role=link]");
  if (lk && e.target === lk && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); go(lk.dataset.go); }
  const r = e.target.closest && e.target.closest("tr[data-open]");
  if (r && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); go(state.mode === "tender" ? "tenderp" : "group", +r.dataset.open); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "aiForm"){ e.preventDefault(); const q = $("aiQ").value.trim(); if (q) ask(q); }
  if (e.target.id === "tenderQ"){ e.preventDefault(); tenderSearch($("tq").value); }
  if (e.target.id === "homeAsk"){ e.preventDefault(); const q = $("homeAiQ").value.trim(); if (q) homeAsk(q); }
});
$("q").addEventListener("input", e => { state.q = e.target.value; if (state.page !== "renewal" && state.page !== "tender") go(state.mode === "tender" ? "tender" : "renewal"); else render(); $("q").focus(); });
const toUrgent = () => { go("renewal"); setTimeout(() => { const el = $(innerWidth <= 860 ? "acm" : "ac"); if (el) el.scrollIntoView({ block: "start" }); state.mcat = "urgent"; }, 0); };
$("bellBtn").onclick = toUrgent; $("bellBtnM").onclick = toUrgent;
$("resetBtn").onclick = () => { if (state.mode === "tender"){ state.tenders = makeTenders(); addProtect(state.tenders); go("tender"); } else { setGroups(sampleGroups()); go(state.page === "home" ? "home" : "renewal"); } state.errors = []; render(); };
$("uploadBtn").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); $("file").click(); } });
document.querySelectorAll(".bottomnav button[data-bn]").forEach(b => b.addEventListener("click", () => go(b.dataset.bn)));

/* ---------- all-features menu ---------- */

  const due = state.groups.filter(g => { const r = renewalInfo(g.data.group.period); return r && r.days <= 30; }).length;
  const urgent = buildTodo(state.groups.map((g, i) => Object.assign({ i, g }, compute(g)))).filter(t => t.sev === "crit").length;
  const mi = (k, label, attrs, extra) => `<button class="mi" type="button" ${attrs}>${ic(k)}<span>${label}</span>${extra || ""}</button>`;
  const soon = '<span class="mb">به‌زودی</span>';
  $("sheet").innerHTML = `<div class="sheet-bg" data-sheet-close></div><div class="sheet-box" role="dialog" aria-modal="true" aria-label="همهٔ قابلیت‌ها">
    <div class="sheet-grip"></div>
    <div class="sheet-h"><h2>همهٔ قابلیت‌ها</h2><button class="iconbtn" type="button" data-sheet-close aria-label="بستن">✕</button></div>
    <div class="sheet-sec">دو کار اصلی</div>
    <div class="mgrid two">
      <button class="mi main" type="button" data-act="upload" style="--h:#6366F1">${ic("upload")}<span>تحلیل تمدید<small>فایل اکسل قرارداد را بدهید</small></span></button>
      <button class="mi main" type="button" data-act="tsearch" style="--h:#0D9488">${ic("search")}<span>برآورد قیمت مناقصه<small>نام سازمان را بزنید</small></span></button>
    </div>
    <div class="sheet-sec">تحلیل</div>
    <div class="mgrid">
      ${mi("portfolio", "پرتفوی تمدید", 'data-go="renewal"')}${mi("tender", "مناقصه‌ها", 'data-go="tender"')}
      ${mi("urgent", "کارهای فوری", 'data-cat="urgent"', urgent ? `<span class="mn">${fmtInt(urgent)}</span>` : "")}${mi("cal", "یادآور تمدید", 'data-go="reminders"', due ? `<span class="mn">${fmtInt(due)}</span>` : "")}
    </div>
    <div class="sheet-sec">ابزار</div>
    <div class="mgrid">
      ${mi("ai", "دستیار هوشمند", 'data-act="ai"')}${mi("docs", "اسناد و گزارش‌ها", 'data-go="docs"')}${mi("settings", "قواعد تحلیل", 'data-go="settings"')}${mi("moon", "حالت روشن / تیره", "data-theme-toggle")}
    </div>

    <div class="mgrid">

    </div></div>`;
  $("sheet").hidden = false;
  document.querySelectorAll("[data-menu]").forEach(b => b.setAttribute("aria-expanded", "true"));
