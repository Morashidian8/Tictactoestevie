# Infrastructure for the later phases. Phase 1 needs none of it: the collectors
# hold everything in memory and write nothing.
#
#   docker compose up -d postgres redis
#
# Postgres holds trades, orders and market metadata (Phase 19); Redis holds
# hot state so a restart can reconstruct positions and open orders without
# replaying a day of Parquet.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polybot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polybot}
      POSTGRES_DB: ${POSTGRES_DB:-polybot}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polybot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
