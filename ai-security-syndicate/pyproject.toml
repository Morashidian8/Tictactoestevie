[project]
name = "ai-security-syndicate"
version = "0.1.0"
description = "White-hat multi-agent smart-contract security auditing syndicate"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "langgraph>=1.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
syndicate = "syndicate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
