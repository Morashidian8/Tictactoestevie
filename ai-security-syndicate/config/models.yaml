# Per-agent model routing. Any role not listed inherits `default`.
# effort: low | medium | high | xhigh | max  (controls thinking depth + spend)
default:
  model: claude-opus-5-5
  effort: high
  max_tokens: 64000

roles:
  agent1_extractor:   {effort: high}
  agent2_router:      {effort: medium}
  agent3_defi:        {effort: xhigh}
  agent4_math:        {effort: max}     # precision/rounding work benefits most from depth
  agent5_edge:        {effort: xhigh}
  agent6_skeptic:     {effort: xhigh}
