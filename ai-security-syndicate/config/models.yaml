# Per-agent model routing. Any role not listed inherits `default`.
# effort: low | medium | high | xhigh | max  (controls thinking depth + spend)
default:
  model: claude-opus-5-5
  effort: high
  max_tokens: 64000

roles:
  # Cheap tier: filters noisy static-analysis hits before they reach Opus.
  agent0_triage:      {model: claude-haiku-5-5, effort: low, max_tokens: 16000}
  agent1_extractor:   {effort: high}
  agent2_router:      {effort: medium}
  agent3_defi:        {effort: xhigh}
  agent4_math:        {effort: max}     # precision/rounding work benefits most from depth
  agent5_edge:        {effort: xhigh}
  agent6_skeptic:     {effort: xhigh}

  # Gym judge: matching findings to a judged report is easy work, so it runs
  # on the cheaper model at low effort. Never used inside the audit itself.
  gym_judge:          {model: claude-sonnet-5-5, effort: low, max_tokens: 16000}
