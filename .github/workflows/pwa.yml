name: Build & Deploy PWA

# Builds the installable web app (precomputes a year of alternation stats into
# data.json, bundles the PWA shell) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "hse_pwa/**"
      - "manhole_pwa/**"
      - "pwa/**"
      - "polybot_web/**"
      - "wallet_tracker/webui/**"
      - "build_pwa.py"
      - ".github/workflows/pwa.yml"
  schedule:
    # Rebuild hourly so the published data stays fresh (UTC). GitHub may delay
    # scheduled runs by a few minutes; that is fine for a yearly analysis.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "منبع داده"
        type: choice
        default: "binance"
        options: [binance, polymarket]
      days:
        description: "چند روز عقب"
        type: string
        default: "365"
      tz:
        description: "منطقه زمانی"
        type: string
        default: "Asia/Tehran"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: btc-${{ inputs.source }}-cache-${{ github.run_id }}
          restore-keys: btc-${{ inputs.source }}-cache-
      # داده‌ی سنگین بیت‌کوین (یک سال کندل) فقط در اجراهای زمان‌بندی‌شده و دستی
      # ساخته می‌شود؛ روی push (مثل انتشار اپ‌های HSE) رد می‌شود تا دیپلوی سریع
      # بماند. اپ بیت‌کوین حذف نشده — صرفاً موقع دیپلوی HSE دوباره بیلد نمی‌شود.
      - name: Build Bitcoin PWA data (schedule/manual only)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          ANALYSIS_SOURCE: ${{ inputs.source || 'binance' }}
          ANALYSIS_DAYS: ${{ inputs.days || '365' }}
          ANALYSIS_TZ: ${{ inputs.tz || 'Asia/Tehran' }}
          POLY_SLEEP: "0.05"
          PWA_OUT: site
        run: python build_pwa.py
      - name: Always publish HSE inspection app under /hse/
        run: |
          mkdir -p site
          cp -r hse_pwa site/hse
          # اپ ابزارهای HSE «ورود به منهول» را زیر /manhole/ منتشر کن.
          cp -r manhole_pwa site/manhole
          # ردیاب کیف پول پلی‌مارکت (کاملاً مرورگری، بدون سرور) را زیر /wallet/ منتشر کن.
          cp -r wallet_tracker/webui site/wallet
          # شبیه‌ساز استراتژی PolyBot (کندلِ واقعی، کاملاً مرورگری) را زیر /polybot/ منتشر کن.
          cp -r polybot_web site/polybot
          # سیاست حریم خصوصیِ اپ مبحث ۱۷ زیر /mabhas17/ منتشر می‌شود؛ صفحهٔ
          # فروشگاه کافه‌بازار به یک URL عمومی برای آن نیاز دارد. خودِ اپ
          # این‌جا نیست — در مخزن خصوصی Morashidian8/mabhas17 است.
          mkdir -p site/mabhas17
          cp mabhas17/privacy.html site/mabhas17/index.html
          # اگر داده‌ی بیت‌کوین در این اجرا ساخته نشد (مثلاً push اپ HSE)، پوسته‌ی
          # ثابت اپ بیت‌کوین را در ریشه قرار بده و آخرین data.json منتشرشده را از
          # سایت زنده بگیر تا اپ ریشه سالم بماند بدون نیاز به بیلد مجدد.
          if [ ! -f site/index.html ]; then
            cp pwa/* site/ 2>/dev/null || true
            [ -f site/data.json ] || curl -fsSL https://morashidian8.github.io/Tictactoestevie/data.json -o site/data.json || true
          fi
          # اگر باز هم ریشه‌ای نبود، ریشه را به اپ HSE هدایت کن تا سایت همیشه کار کند.
          if [ ! -f site/index.html ]; then
            echo '<!DOCTYPE html><html lang="fa"><head><meta charset="utf-8">' > site/index.html
            echo '<meta http-equiv="refresh" content="0; url=./hse/"></head>' >> site/index.html
            echo '<body>در حال انتقال به اپ بازدید ایمنی... <a href="./hse/">ورود</a></body></html>' >> site/index.html
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
