name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/fire-safety-services-site-dg3ais
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir -p _site/css _site/js
          cp index.html _site/
          cp css/style.css _site/css/
          cp js/main.js _site/js/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: enabled

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
