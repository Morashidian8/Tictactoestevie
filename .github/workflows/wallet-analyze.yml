name: Wallet BTC Analysis (Polymarket)

# One-shot analysis of a wallet's Bitcoin Up/Down trading: chronological
# positions, same-side streaks, alternation, and realized PnL. Runs where
# Polymarket is reachable (GitHub Actions), not the network-restricted sandbox.
# Output (including a compact JSON between <<<JSON>>>/<<<END>>>) is in the logs.
on:
  workflow_dispatch:
    inputs:
      address:
        description: "آدرس کیف پول (0x...)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Analyze wallet BTC trades
        env:
          WATCH_ADDRESS: ${{ inputs.address || '0xb8ea51bd3b55e7105cd6ff351eeaf70d68f36240' }}
        run: python analyze_wallet_btc.py
