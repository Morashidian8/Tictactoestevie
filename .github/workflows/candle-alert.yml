name: BTC Candle Alert

on:
  schedule:
    # Fires periodically so there is always a queued successor ready to take
    # over when the long-running jobs end. GitHub cron is unreliable, but we
    # only need it to fire occasionally within each ~5.5h window.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" from the GitHub UI

# Keep exactly one set of monitors alive: a new run queues behind the current
# one and starts the moment it finishes, giving near-continuous coverage.
concurrency:
  group: candle-monitor
  cancel-in-progress: false

# The Telegram-set alternation threshold is persisted to a dedicated branch via
# the GitHub API, so it survives the ~5.5h job restarts.
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Stay under the 6h hard limit; the process also self-exits earlier.
    timeout-minutes: 350
    strategy:
      fail-fast: false   # one monitor crashing must not stop the other
      matrix:
        include:
          # 5-minute monitor — Polymarket BTC Up/Down series, threshold 5 candles.
          - name: "5m-polymarket"
            source: "polymarket"
            product: "BTCUSDT"
            granularity: "300"
            interval: "5m"
            monitor_key: "5m"
            threshold: "5"
            tf_label: "۵ دقیقه‌ای — Polymarket"
            poly_prefix: "btc-updown-5m"
            command_listener: "0"
          # 15-minute monitor — Binance BTCUSDT klines, threshold 4 candles.
          # This one also runs the Telegram command listener (/threshold) for
          # ALL monitors; only one process may poll getUpdates.
          - name: "15m-binance"
            source: "binance"
            product: "BTCUSDT"
            granularity: "900"
            interval: "15m"
            monitor_key: "15m"
            threshold: "4"
            tf_label: "۱۵ دقیقه‌ای — Binance"
            poly_prefix: "btc-updown-5m"
            command_listener: "1"
          # 5-minute monitor — Polymarket SOL Up/Down series (sol-updown-5m),
          # so the alternation matches the real tradeable market. Default
          # threshold 3 candles = 2 تناوب (alerts from 2 alternations up),
          # adjustable 2..7.
          - name: "5m-solana"
            source: "polymarket"
            product: "SOLUSDT"
            granularity: "300"
            interval: "5m"
            monitor_key: "sol5m"
            threshold: "3"
            tf_label: "سولانا ۵ دقیقه‌ای — Polymarket"
            poly_prefix: "sol-updown-5m"
            command_listener: "0"
    name: monitor-${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run continuous monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE: ${{ matrix.source }}
          PRODUCT: ${{ matrix.product }}
          GRANULARITY: ${{ matrix.granularity }}
          INTERVAL: ${{ matrix.interval }}
          MONITOR_KEY: ${{ matrix.monitor_key }}
          ALTERNATION_THRESHOLD: ${{ matrix.threshold }}
          TF_LABEL: ${{ matrix.tf_label }}
          POLY_SLUG_PREFIX: ${{ matrix.poly_prefix }}
          # Telegram /threshold control: which process listens, the monitors it
          # offers, their default flip (تناوب) thresholds (= candles - 1), and
          # the button labels. Keep these three lists in sync with the matrix.
          COMMAND_LISTENER: ${{ matrix.command_listener }}
          THRESHOLD_INTERVALS: "5m,15m,sol5m"
          THRESHOLD_DEFAULTS: "5m:4,15m:3,sol5m:2"
          THRESHOLD_LABELS: "5m:بیت‌کوین ۵د (پلی‌مارکت),15m:بیت‌کوین ۱۵د,sol5m:سولانا ۵د (پلی‌مارکت)"
          # Persist the chosen threshold across restarts via the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Poll interval in seconds.
          POLL_SECONDS: "30"
          # Exit a bit before the 350-minute job timeout.
          MAX_RUNTIME_SECONDS: "20400"
        run: python monitor_loop.py
