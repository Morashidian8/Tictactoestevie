name: FacilityOS Android CI

# Builds the offline CMMS/CAFM Android app so compile errors surface on every push.
on:
  push:
    paths:
      - 'cafm_platform/android/**'
      - '.github/workflows/cafm-android-ci.yml'
  pull_request:
    paths:
      - 'cafm_platform/android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafm_platform/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: facilityos-debug-apk
          path: cafm_platform/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
