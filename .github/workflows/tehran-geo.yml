name: Tehran gas-fire geo data

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/tehran-gas-fire-routes-*"
    paths:
      - "tehran_gas_fire_map/scripts/fetch_geo.py"
      - "tehran_gas_fire_map/scripts/fetch_stations.py"
      - "tehran_gas_fire_map/scripts/google_geocode.py"
      - "tehran_gas_fire_map/scripts/build_map.py"
      - "tehran_gas_fire_map/scripts/inline_assets.py"
      - "tehran_gas_fire_map/data/gas_offices.json"
      - ".github/workflows/tehran-geo.yml"

permissions:
  contents: write

concurrency:
  group: tehran-geo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch geo data (Overpass + Nominatim + OSRM)
        # Slow (~15 min against public APIs); skip once results are committed.
        run: |
          if [ -f tehran_gas_fire_map/data/geo_results.json ]; then
            echo "geo_results.json already present — skipping fetch"
          else
            python tehran_gas_fire_map/scripts/fetch_geo.py
          fi

      - name: Google Maps lookup for office coordinates
        run: |
          if [ -f tehran_gas_fire_map/data/google_coords.json ]; then
            echo "google_coords.json already present — skipping lookup"
          else
            python tehran_gas_fire_map/scripts/google_geocode.py
          fi

      - name: Fetch full fire-station list
        # Quick Overpass query; embedded in the map for browser-side edit mode.
        run: |
          if [ -f tehran_gas_fire_map/data/stations.json ]; then
            echo "stations.json already present — skipping fetch"
          else
            python tehran_gas_fire_map/scripts/fetch_stations.py
          fi

      - name: Build self-contained map HTML
        run: |
          pip install folium
          python tehran_gas_fire_map/scripts/build_map.py
          python tehran_gas_fire_map/scripts/inline_assets.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tehran_gas_fire_map/data/geo_results.json tehran_gas_fire_map/data/stations.json tehran_gas_fire_map/data/google_coords.json tehran_gas_fire_map/output/tehran_gas_fire_map.html
          git diff --cached --quiet || git commit -m "chore: tehran gas-fire map artifacts [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done
