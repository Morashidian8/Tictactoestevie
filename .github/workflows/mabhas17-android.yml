name: Build Mabhas17 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "claude/continue-repo-17-536k5v" ]
    paths:
      - "mabhas17/android/**"
      - ".github/workflows/mabhas17-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Web assets must match the bundled copy
        run: |
          diff -q mabhas17/web/index.html \
                  mabhas17/android/app/src/main/assets/pwa/index.html
          diff -q mabhas17/web/manifest.webmanifest \
                  mabhas17/android/app/src/main/assets/pwa/manifest.webmanifest
          diff -q mabhas17/web/service-worker.js \
                  mabhas17/android/app/src/main/assets/pwa/service-worker.js
          diff -q mabhas17/web/icon.svg \
                  mabhas17/android/app/src/main/assets/pwa/icon.svg

      - name: Build debug APK
        working-directory: mabhas17/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mabhas17-gas-apk
          path: mabhas17/android/app/build/outputs/apk/debug/app-debug.apk
