name: Wallet Deep Forensic (Polymarket)

# Per-position forensic of a wallet's BTC Up/Down trading: classifies every
# position (early SELL / REDEEM / never-redeemed) and resolves the REAL market
# outcome from Gamma for the unredeemed ones, so unclaimed wins and abandoned
# losers are both booked. Runs where Polymarket is reachable (GitHub Actions).
on:
  workflow_dispatch:
    inputs:
      address:
        description: "آدرس کیف پول (0x...)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Deep forensic analysis
        env:
          WATCH_ADDRESS: ${{ inputs.address || '0xb8ea51bd3b55e7105cd6ff351eeaf70d68f36240' }}
        run: python analyze_wallet_deep.py
