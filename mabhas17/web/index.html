<style>
  :root{

  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10211c; --card:#16302a; --text:#eef3f1; --muted:#a7b8b2; --line:#244a40; --primary:#4CC9A6; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--green);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header .back{cursor:pointer;font-size:22px;background:none;border:none;color:#fff;display:none}
  header h1{font-size:16px;margin:0;font-weight:700;flex:1}
  main{max-width:720px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .menu-item{display:flex;align-items:center;gap:14px;cursor:pointer}
  .menu-item .ico{font-size:28px}
  .menu-item .t{flex:1}
  .menu-item .t b{display:block;font-size:15px}
  .menu-item .t span{font-size:12px;color:var(--muted)}
  .menu-item .arrow{color:var(--muted)}
  .group-title{font-size:13px;color:var(--muted);margin:18px 4px 6px;font-weight:700}
  h2.sub{color:var(--primary);margin:.2em 0}
  .notice{background:rgba(255,193,7,.18);border-radius:12px;padding:12px;font-size:13px;display:flex;gap:8px;margin-bottom:14px;border:1px solid rgba(255,193,7,.4)}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:15px}
  .row2{display:flex;gap:10px}.row2>*{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{padding:7px 13px;border:1px solid var(--line);border-radius:20px;cursor:pointer;font-size:13px;background:var(--card);color:var(--text)}
  .chip.sel{background:var(--green);color:#fff;border-color:var(--green)}
  .result{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);gap:10px}
  .result:last-child{border-bottom:none}
  .result .v{color:var(--primary);font-weight:700;font-size:17px;white-space:nowrap}
  .hint{color:var(--muted);font-size:13px}
  .desc{font-size:13px;color:var(--muted);margin:6px 0 4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  .scroll{overflow-x:auto}
  th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-weight:700;background:rgba(0,0,0,.03)}
  td.name,th.name{text-align:right}
  .li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .li:last-child{border:none}
  .li b{color:var(--primary)}
  .footer-note{font-size:12px;color:var(--muted);text-align:center;padding:8px 0 24px}
  .modtitle{font-size:13px;color:var(--muted)}
  .check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .check:last-child{border:none}
  .check .box{width:20px;height:20px;border:2px solid var(--primary);border-radius:5px;flex:0 0 auto;margin-top:2px;text-align:center;line-height:18px;color:#fff}
  .check.on .box{background:var(--primary)}
  .badge{font-size:11px;background:var(--green);color:#fff;border-radius:8px;padding:2px 7px;margin-inline-start:6px}
</style>
</head>

// سایز پیشنهادی دریچه از روی سطح ناخالص (cm²)
function ventSizes(gross){
  const d=DATA.air, side=Math.sqrt(gross), dia=Math.sqrt(gross*4/Math.PI);
  let h=`<hr><div class="modtitle">سایز پیشنهادی دریچه (سطح ناخالص ${fmt(gross)} cm²)</div>`;
  h+=res('مربع',`${fmt(side)}×${fmt(side)} cm`);
  h+=res('دایره',`قطر ${fmt(dia)} cm`);
  let best=null; d.grilles.forEach(g=>{const a=g[0]*g[1]; if(a>=gross&&(!best||a<best.a))best={w:g[0],hh:g[1],a};});
  if(best){const ex=Math.round((best.a/gross-1)*100); h+=res('دریچه استاندارد مستطیلی',`${best.w}×${best.hh} cm`+(ex>0?` (+${ex}٪)`:' (دقیق)'));}
  else h+=`<p class="hint">از بزرگ‌ترین دریچه فهرست بزرگ‌تر است؛ از چند دریچه استفاده کنید.</p>`;
  let bd=null; d.ducts.forEach(D=>{const a=Math.PI/4*D*D; if(a>=gross&&(!bd||a<bd.a))bd={D,a};});
  if(bd){const ex=Math.round((bd.a/gross-1)*100); h+=res('کانال گرد استاندارد',`قطر ${fmt(bd.D)} cm`+(ex>0?` (+${ex}٪)`:' (دقیق)'));}
  h+=`<p class="hint">حداقل ضلع/قطر دریچه نباید کمتر از ${d.minSide_mm} میلی‌متر باشد. دریچه استاندارد ممکن است کمی بزرگ‌تر از نیاز محاسباتی باشد (درصد اضافه ذکر شده).</p>`;
  return h;
}

/* =================== تأمین هوا (ویزارد پلکانی) =================== */
let airState={group:0,sub:0,step:1,unit:0,manual:'',ach:'0.6',factor:0,qty:{}};
function airGroups(){ const order=[],g={}; DATA.air.methods.forEach(m=>{if(!g[m.group]){g[m.group]=[];order.push(m.group);}g[m.group].push(m);}); return {order,g}; }
function airMethod(){ const {order,g}=airGroups(); const ms=g[order[airState.group]]; return ms[Math.min(airState.sub,ms.length-1)]; }
function renderAir(){
  app.innerHTML='';
  const d=DATA.air,{order,g}=airGroups();
  // مرحله ۱: انتخاب گروه روش (تنها همین در صفحه)
  if(airState.step===1){
    const c=el(`<div class="card"><h2 class="sub" style="margin-top:0">تأمین هوای احتراق</h2><p class="hint">گام ۱ از ۳ — روش تأمین هوا را انتخاب کنید.</p></div>`);
    c.appendChild(chips(order,-1,i=>{airState.group=i;airState.sub=0;airState.step=(g[order[i]].length>1?2:3);renderAir();}));
    app.appendChild(c); return;
  }
  const ms=g[order[airState.group]];
  // مرحله ۲: انتخاب حالت (تنها همین در صفحه)
  if(airState.step===2){
    const c=el(`<div class="card"><h2 class="sub" style="margin-top:0">${order[airState.group]}</h2><p class="hint">گام ۲ از ۳ — حالت را انتخاب کنید.</p></div>`);
    c.appendChild(chips(ms.map(m=>m.title),-1,i=>{airState.sub=i;airState.step=3;renderAir();}));
    const back=el(`<div class="chip" style="display:inline-block;margin-top:14px">↩ بازگشت به گام ۱</div>`);
    back.onclick=()=>{airState.step=1;renderAir();}; c.appendChild(back);
    app.appendChild(c); return;
  }
  // مرحله ۳: دستگاه‌ها + ورودی‌ها + نتیجه (تنها همین در صفحه)
  const m=airMethod();
  const head=el(`<div class="card"><div class="modtitle">گام ۳ از ۳ — روش انتخاب‌شده</div><b>${m.title}</b><div class="hint" style="margin-top:4px">${m.desc}</div></div>`);
  const back=el(`<div class="chip" style="display:inline-block;margin-top:10px">↩ تغییر روش</div>`);
  back.onclick=()=>{airState.step=1;renderAir();}; head.appendChild(back);
  app.appendChild(head);
  if(m.type==='eng'){ app.appendChild(el(`<div class="card"><p class="hint">این روش نیازمند طراحی اختصاصی توسط مهندس است و محاسبه‌ی خودکار ندارد.</p></div>`)); return; }
  app.appendChild(appliancePicker(airState.qty,drawAir,{hv:true,m3:true}));
  const c2=el(`<div class="card"><div class="modtitle">سایر — ورود دستی ظرفیت دستگاه خارج از فهرست</div></div>`);
  c2.appendChild(chips(d.units.map(u=>u.label),airState.unit,i=>{airState.unit=i;renderAir();}));
  const mf=el(`<div><input type="number" inputmode="decimal" placeholder="ظرفیت (اختیاری)" value="${airState.manual}"></div>`);
  mf.querySelector('input').oninput=e=>{airState.manual=e.target.value;drawAir();};
  c2.appendChild(mf); app.appendChild(c2);
  if(m.type==='vol_ach'){
    const a=el(`<div class="card"><label>تعداد دفعات تعویض هوا (ACH) — حداقل ۰٫۶</label><input type="number" inputmode="decimal" value="${airState.ach}"></div>`);
    a.querySelector('input').oninput=e=>{airState.ach=e.target.value;drawAir();}; app.appendChild(a);
  }
  if(m.type==='open'){
    const f=el(`<div class="card"><label>نوع دریچه (ضریب سطح آزاد)</label></div>`);
    f.appendChild(chips(d.factors.map(x=>`${x.name} (${Math.round(x.f*100)}٪)`),airState.factor,i=>{airState.factor=i;renderAir();})); app.appendChild(f);
  }
  app.appendChild(el(`<div id="airRes"></div>`)); drawAir();
}
function drawAir(){
  const box=document.getElementById('airRes'); if(!box) return;
  const d=DATA.air,m=airMethod();

  else if(m.type==='vol_ach'){ let ach=parseFloat(airState.ach); if(!ach||ach<0.6)ach=0.6; html+=res(m.rlabel,`${fmt((m.coef/ach)*(kcal/1000))} ${m.runit}`)+`<p class="hint">با ACH=${fmt(ach)} (کمتر از ۰٫۶ → ۰٫۶ لحاظ می‌شود).</p>`; }
  else if(m.type==='mech'){ html+=res(m.rlabel,`${fmt(kcal/m.per)} ${m.runit}`)+`<p class="hint">سیستم تأمین هوای مکانیکی باید با دستگاه گازسوز اینترلاک شود.</p>`; }
  else if(m.type==='open'){
    const net=(kcal*m.mm2PerKcal)/100, f=d.factors[airState.factor].f, gross=f>0?net/f:net;

let pipeState={step:1,bIdx:0,sys:0,pin:'2',qty:{},manual:'',length:''};
const PIPE_BUILDINGS=[
  {t:"مسکونی یک‌واحدی",d:"یک واحد مسکونی مستقل. معمولاً فشار ضعیف (¼ پوند). شیر اصلی + شیر هر دستگاه؛ رعایت فواصل و فضاهای ممنوع کافی است. قطر لوله اصلی و شیر اصلی حداقل ۱ اینچ."},
  {t:"آپارتمانی کم‌واحد (تا ۱۰ واحد)",d:"کنتور مجزا برای هر واحد؛ کلکتور/رایزر مشترک. مصرف بر اساس کارکرد همزمان واحدها. معمولاً فشار ضعیف."},
  {t:"آپارتمانی متوسط (۱۱ تا ۳۰ واحد)",d:"رایزرهای طبقاتی و کلکتور؛ محاسبه دقیق افت فشار در طولانی‌ترین مسیر. ممکن است فشار متوسط لازم شود."},

  {t:"عمومی (تجاری/اداری/آموزشی/درمانی/اقامتی/تجمعی)",d:"بر اساس نوع فعالیت ارزیابی می‌شود؛ اغلب فشار متوسط و الزامات ایمنی بیشتر. عبور لوله از فضاهای تجمعی/حساس ممنوع است."},
  {t:"صنعتی",d:"مصارف عمده؛ معمولاً فشار متوسط (بخش دوم مبحث ۱۷)، حفاظت کاتدیک لوله مدفون و الزامات جوش/آزمایش تخصصی."},
  {t:"تلفیقی",d:"ترکیب مسکونی و غیرمسکونی؛ هر بخش طبق ضوابط خود طراحی و از نظر ایمنی تفکیک شود."}
];
// انتخاب قطر فشار متوسط با فرمول رسمی مبحث ۱۷ (رابطه عمومی بند ۱۷-۱۰-۲ + رابطه ۳ سرعت)
function medFormulaSelect(demand,L_m,pinPsi){
  const F=DATA.medium.formula;
  const To=288.8, Po=1.033, G=0.65, T=293.2;
  const Pg=pinPsi*0.0703069, P1=Po+Pg, P2=P1-0.1*Pg, dPP=P1*P1-P2*P2, L=L_m/1000;
  for(const sz of F.sizes){
    const d=sz.id/10;
    const Qp=0.07294*(To/Po)*Math.sqrt(dPP/(G*T*L))*Math.pow(d,8/3);
    const Qv=F.vmax*P1*d*d/3.65;
    const Q=Math.min(Qp,Qv);
    if(Q>=demand) return {size:sz.name,dn:sz.dn,cap:Q,limit:(Qp<Qv?'افت فشار':'سرعت')};
  }
  return null;
}
// افزایش پلکانی فشار تا وقتی یک قطر استاندارد جواب دهد
function pipeEscalate(demand,len,minPsi){
  for(const psi of [2,5,10,20,40,60]){ if(psi<minPsi) continue; const r=medFormulaSelect(demand,len,psi); if(r) return {psi,r}; }
  return null;
}
function pipeDemand(){ return applianceSumKcal(pipeState.qty)/HEATING_VALUE + (parseFloat(pipeState.manual)||0); }
function pipeTable(){
  if(pipeState.sys===1){
    const c=DATA.medium.cap2psi;
    return {sysTitle:'فشار متوسط (۲ پوند) — جدول پ-۴-۴',
      sizes:c.sizes.map(s=>s+'″'), dns:['DN20','DN25','DN32','DN40','DN50','DN65','DN80','DN100','DN150'],
      lengths:c.lengths, get:(li,si)=>c.rows[li][si]};
  }
  const d=DATA.pipe;
  return {sysTitle:'فشار ضعیف (¼ پوند) — جدول ۱۷-۴-۱۰',
    sizes:d.pipes.map(p=>p.size), dns:d.pipes.map(p=>p.dn),
    lengths:d.lengths, get:(li,si)=>d.pipes[si].cap[li]};
}
function renderPipe(){

    const back=el(`<div class="chip" style="display:inline-block;margin-top:10px">↩ بازگشت</div>`); back.onclick=()=>{pipeState.step=1;renderPipe();}; c.appendChild(back);
    app.appendChild(c);
    const c2=el(`<div class="card"><h2 class="sub" style="margin-top:0">گام ۲ از ۳ — سیستم فشار</h2></div>`);
    c2.appendChild(chips(['فشار ضعیف (¼ پوند) — جدول','فشار متوسط (۲ پوند) — جدول','فشار متوسط — فرمولی (۲ تا ۶۰ پوند)'],-1,i=>{pipeState.sys=i;pipeState.step=3;renderPipe();}));
    c2.appendChild(el(`<p class="hint" style="margin-top:8px">مبحث ۱۷ فقط دو رده دارد: فشار ضعیف (¼ پوند، بخش اول) و فشار متوسط (۲ تا ۶۰ پوند، بخش دوم). فشار قوی (بیش از ۶۰ پوند) خارج از دامنه‌ی مبحث ۱۷ است و نیازمند مراجعه به شرکت گاز ناحیه می‌باشد.</p>`));

  }

  const back=el(`<div class="chip" style="display:inline-block;margin-top:10px">↩ تغییر</div>`); back.onclick=()=>{pipeState.step=1;renderPipe();}; head.appendChild(back);
  app.appendChild(head);
  app.appendChild(appliancePicker(pipeState.qty,drawPipe,{hv:true,m3:true}));
  const c=el(`<div class="card"><div class="modtitle">مصرف دستی و طول مسیر</div></div>`);
  const fm=el(`<div><label>مصرف دستی اضافی (m³/h) — اختیاری</label><input type="number" inputmode="decimal" value="${pipeState.manual}"></div>`);
  fm.querySelector('input').oninput=e=>{pipeState.manual=e.target.value;drawPipe();}; c.appendChild(fm);
  const fl=el(`<div><label>طول مسیر تا دورترین مصرف (متر)</label><input type="number" inputmode="decimal" value="${pipeState.length}"></div>`);
  fl.querySelector('input').oninput=e=>{pipeState.length=e.target.value;drawPipe();}; c.appendChild(fl);
  if(pipeState.sys===2){
    const pf=el(`<div><label>فشار ورودی (پوند بر اینچ مربع)</label><input type="number" inputmode="decimal" value="${pipeState.pin}"></div>`);
    pf.querySelector('input').oninput=e=>{pipeState.pin=e.target.value;drawPipe();}; c.appendChild(pf);
  }
  c.appendChild(el(`<p class="hint">تبصره ۱۷-۴-۱۳: قطر لوله اصلی و شیر اصلی حداقل ۱ اینچ (۲۵mm). مصرف = جمع همزمان دستگاه‌ها + مصرف دستی.</p>`));
  app.appendChild(c);
  app.appendChild(el(`<div id="pipeRes"></div>`));drawPipe();
}
function drawPipe(){
  const box=document.getElementById('pipeRes');if(!box)return;
  const demand=pipeDemand(),len=parseFloat(pipeState.length);
  let html=`<div class="card"><h2 class="sub" style="margin-top:0">نتیجه</h2>`;
  html+=res('مجموع مصرف',`${fmt(demand)} m³/h`);
  if(!demand||!len||demand<=0||len<=0){box.innerHTML=html+`<p class="hint">دستگاه‌ها/مصرف و طول مسیر را وارد کنید.</p></div>`;return;}
  if(pipeState.sys===2){
    const pin=parseFloat(pipeState.pin)||2;
    const r=medFormulaSelect(demand,len,pin);
    if(r){html+=res('قطر پیشنهادی لوله',r.size)+res('قطر اسمی',r.dn)+res('حداکثر ظرفیت این قطر',`${fmt(r.cap)} m³/h`)+res('عامل محدودکننده',r.limit)+res('فشار ورودی',`${fmt(pin)} psi`);
      if(pin>60)html+=`<p class="v" style="color:#c0392b">توجه: فشار بیش از ۶۰ پوند خارج از دامنه‌ی مبحث ۱۷ است؛ طراحی باید با تأیید شرکت گاز ناحیه انجام شود.</p>`;}
    else{const e=pipeEscalate(demand,len,pin+0.001); if(e)html+=`<p class="v" style="color:#c0392b">در ${fmt(pin)} پوند جواب نمی‌دهد.</p>`+res('↑ با افزایش فشار به',`${fmt(e.psi)} پوند`)+res('قطر لازم',e.r.size); else html+=`<p class="v" style="color:#c0392b">حتی با فشار ۶۰ پوند و ۶ اینچ کافی نیست؛ مسیر را تقسیم کنید.</p>`;}
    box.innerHTML=html+`</div>`;return;
  }
  const t=pipeTable();
  let col=t.lengths.findIndex(l=>l>=len),used,msg='';
  if(col===-1){col=t.lengths.length-1;used=t.lengths[col];msg=`طول از جدول بیشتر است؛ از بزرگ‌ترین ستون (${fmt(t.lengths[col])} متر) استفاده شد.`;}
  else used=t.lengths[col];
  let found=-1; for(let si=0;si<t.sizes.length;si++){const c=t.get(col,si);if(c!=null&&c>=demand){found=si;break;}}
  if(found>=0){html+=res('قطر پیشنهادی لوله',t.sizes[found])+res('قطر اسمی',t.dns[found])+res('ظرفیت لوله در این طول',`${fmt(t.get(col,found))} m³/h`)+res('طول مبنای جدول',`${fmt(used)} متر`)+res('سیستم',t.sysTitle);}
  else{
    // خارج از جدول → افزایش خودکار فشار
    const minPsi = pipeState.sys===1 ? 5 : 2; // اگر ۲پوند جواب نداد، از ۵ به بالا
    const e=pipeEscalate(demand,len,minPsi);
    html+=`<p class="v" style="color:#c0392b">در ${t.sysTitle} قطر کافی نیست.</p>`;
    if(e)html+=res('↑ راه‌حل: افزایش فشار به',`${fmt(e.psi)} پوند بر اینچ مربع`)+res('قطر لازم در این فشار',e.r.size)+res('قطر اسمی',e.r.dn)+`<p class="hint">با افزایش فشار، ظرفیت لوله بالا می‌رود و قطر کوچک‌تری کافی است (نیازمند رگولاتور/فشار متوسط).</p>`;
    else html+=`<p class="hint">حتی با فشار بالا کافی نیست؛ مسیر را به چند شاخه تقسیم کنید.</p>`;
  }
  if(msg)html+=`<p class="hint">${msg}</p>`;
  box.innerHTML=html+`</div>`;
}

  // جدول لوله رابط (۱۷-۴-۷)
  const cc=el(`<div class="card"><h2 class="sub" style="margin-top:0">ظرفیت لوله رابط دودکش — جدول ۱۷-۴-۷</h2><p class="hint">ظرفیت بر حسب ۱۰۰۰ kcal/h</p></div>`);
  let ct=`<div class="scroll"><table><tr><th class="name">H (m)</th><th>R (m)</th>${d.connector.diameters.map(x=>`<th>${x}mm</th>`).join('')}</tr>`;
  d.connector.rows.forEach(r0=>{ ct+=`<tr><td class="name">${r0.h}</td><td>${r0.r}</td>${r0.cap.map(v=>`<td>${fmt(v)}</td>`).join('')}</tr>`; });
  cc.appendChild(el(ct+`</table></div>`));app.appendChild(cc);
  const r=el(`<div class="card"><h2 class="sub" style="margin-top:0">ضوابط دودکش</h2></div>`);
  d.rules.forEach(x=>r.appendChild(el(`<div class="li">• ${x}</div>`)));app.appendChild(r);
}
function drawVent(){
  const box=document.getElementById('ventRes');if(!box)return;
  const d=DATA.vent,H=d.heights[ventState.hIdx],L=d.lengths[ventState.lIdx];
  const cap=parseFloat(ventState.cap);
  const row=d.table[String(H)];
  if(!row||!(String(L) in row)){box.innerHTML=`<div class="card"><p class="v" style="color:#c0392b">این ترکیب ارتفاع ${fmt(H)}م و طول ${fmt(L)}م در جدول مجاز نیست.</p></div>`;return;}
  const cells=row[String(L)];
  if(!cap||cap<=0){box.innerHTML=`<p class="hint">ظرفیت دستگاه را وارد کنید تا حداقل قطر تعیین شود.</p>`;return;}
  let chosen=null;
  for(let i=0;i<cells.length;i++){ if(cells[i]!=null && cells[i]*1000>=cap){ chosen={dia:d.diameters[i],max:cells[i]*1000}; break; } }
  let html=`<div class="card"><h2 class="sub" style="margin-top:0">نتیجه</h2>`;
  if(chosen){ html+=res('حداقل قطر دودکش',`${chosen.dia} میلی‌متر`)+res('حداکثر ظرفیت این قطر',`${fmt(chosen.max)} kcal/h`)+res('ارتفاع / طول رابط',`H=${fmt(H)}m , L=${fmt(L)}m`); }
  else html+=`<p class="v" style="color:#c0392b">ظرفیت دستگاه از بزرگ‌ترین قطر جدول بیشتر است؛ دودکش اختصاصی محاسبه شود.</p>`;
  box.innerHTML=html+`</div>`;
}

let meterState={demand:''};
function renderMeter(){
  const d=DATA.meter;
  addNotice(d.verified,d.note);
  const card=el(`<div class="card"><h2 class="sub" style="margin-top:0">انتخاب کنتور</h2></div>`);
  const f=el(`<div><label>مجموع مصرف ساختمان (متر مکعب در ساعت)</label><input type="number" inputmode="decimal" value="${meterState.demand}"></div>`);
  f.querySelector('input').oninput=e=>{meterState.demand=e.target.value;drawMeter();};
  card.appendChild(f);app.appendChild(card);
  app.appendChild(el(`<div id="meterRes"></div>`));
  const tbl=el(`<div class="card"><h2 class="sub" style="margin-top:0">رده‌های کنتور (Qmax)</h2></div>`);
  let t=`<div class="scroll"><table><tr><th class="name">رده کنتور</th><th>حداکثر ظرفیت (m³/h)</th></tr>`;
  d.meters.forEach(m=>t+=`<tr><td class="name">${m.g}</td><td>${fmt(m.qmax)}</td></tr>`);
  tbl.appendChild(el(t+`</table></div>`));app.appendChild(tbl);
  if(d.rules){ const r=el(`<div class="card"><h2 class="sub" style="margin-top:0">ضوابط نصب کنتور</h2></div>`);
    d.rules.forEach(x=>r.appendChild(el(`<div class="li">• ${x}</div>`)));app.appendChild(r); }
  drawMeter();
}
function drawMeter(){
  const box=document.getElementById('meterRes');if(!box)return;
  const demand=parseFloat(meterState.demand);
  if(!demand||demand<=0){box.innerHTML=`<p class="hint">مصرف کل را وارد کنید.</p>`;return;}
  const m=DATA.meter.meters.find(x=>x.qmax>=demand);
  let html=`<div class="card"><h2 class="sub" style="margin-top:0">نتیجه</h2>`;
  if(m)html+=res('کنتور پیشنهادی',m.g)+res('حداکثر ظرفیت کنتور',`${fmt(m.qmax)} m³/h`);
  else html+=`<p class="v" style="color:#c0392b">مصرف بیش از بزرگ‌ترین رده استاندارد است؛ کنتور صنعتی لازم است.</p>`;
  box.innerHTML=html+`</div>`;
}

/* =================== مبدل واحد =================== */
let convState={val:'1',from:0};
function renderConvert(){
  app.innerHTML='';
  const hvCard=el(`<div class="card"><h2 class="sub" style="margin-top:0">مبدل واحد</h2><label>ارزش حرارتی ناخالص گاز (kcal بر متر مکعب)</label><input type="number" inputmode="decimal" value="${HEATING_VALUE}"><p class="hint">پیش‌فرض ۹۰۰۰ (گرد). گاز طبیعی ایران ≈ ۹۴۰۰؛ بازه‌ی متعارف ۸۸۰۰ تا ۹۵۰۰. مقدار دقیق را شرکت گاز اعلام می‌کند. این عدد در تبدیل m³/h و برآورد مصرف هم استفاده می‌شود.</p></div>`);
  hvCard.querySelector('input').oninput=e=>{const x=parseFloat(e.target.value); if(x>0){HEATING_VALUE=x; drawConv();}};
  app.appendChild(hvCard);
  const units=["کیلوکالری بر ساعت (kcal/h)","کیلووات (kW)","متر مکعب بر ساعت (m³/h)","BTU بر ساعت (BTU/h)"];
  const card=el(`<div class="card"></div>`);
  const f=el(`<div><label>مقدار</label><input type="number" inputmode="decimal" value="${convState.val}"></div>`);
  f.querySelector('input').oninput=e=>{convState.val=e.target.value;drawConv();};
  card.appendChild(f);
  card.appendChild(el(`<label>واحد ورودی</label>`));
  card.appendChild(chips(units,convState.from,i=>{convState.from=i;renderConvert();drawConv();}));
  app.appendChild(card);app.appendChild(el(`<div id="convRes"></div>`));drawConv();
}
function drawConv(){
  const box=document.getElementById('convRes');if(!box)return;
  const hv=HEATING_VALUE,v=parseFloat(convState.val);
  if(isNaN(v)){box.innerHTML='';return;}
  // همه را به kcal/h تبدیل می‌کنیم
  let kcal;
  switch(convState.from){
    case 0: kcal=v; break;
    case 1: kcal=v*859.845; break;       // kW -> kcal/h
    case 2: kcal=v*hv; break;            // m3/h -> kcal/h
    case 3: kcal=v/3.96832; break;       // BTU/h -> kcal/h
  }
  const kw=kcal/859.845, m3=kcal/hv, btu=kcal*3.96832;
  box.innerHTML=`<div class="card"><h2 class="sub" style="margin-top:0">معادل‌ها</h2>`+
    res('کیلوکالری بر ساعت',fmt(kcal))+res('کیلووات',fmt(kw))+res('متر مکعب بر ساعت',fmt(m3))+res('BTU بر ساعت',fmt(btu))+`</div>`;
}

let refState={key:'',q:'',open:{}};
function renderRefList(d,glossary){
  app.innerHTML='';
  const key=d.title||'';
  if(refState.key!==key) refState={key,q:'',open:{}};
  if(d.note) addNotice(d.verified,d.note);
  const sb=el(`<div class="card"><input type="text" inputmode="search" placeholder="🔍 جستجو در این بخش…" value="${refState.q}"></div>`);
  const inp=sb.querySelector('input');
  inp.oninput=e=>{refState.q=e.target.value; drawRef(d);};
  app.appendChild(sb);
  app.appendChild(el(`<div id="refList"></div>`));
  drawRef(d);
}
function drawRef(d){
  const box=document.getElementById('refList'); if(!box) return;
  const q=(refState.q||'').trim();
  const c=el(`<div class="card"><h2 class="sub" style="margin-top:0">${d.title||'موارد'}</h2><p class="hint">روی هر مورد بزنید تا باز/بسته شود.</p></div>`);
  let shown=0;
  d.items.forEach((it,idx)=>{
    if(q && !((it.t+' '+it.d).includes(q))) return;
    shown++;
    const collapsed=refState.open[idx]===true; // پیش‌فرض باز
    const row=el(`<div class="li" style="cursor:pointer"><b>${it.t}</b> <span class="hint">${collapsed?'▼':'▲'}</span>${collapsed?'':`<div class="hint" style="margin-top:4px">${it.d}</div>`}</div>`);
    row.onclick=()=>{refState.open[idx]=!collapsed; drawRef(d);};
    c.appendChild(row);
  });
  if(shown===0) c.appendChild(el(`<p class="hint">موردی برای «${q}» یافت نشد.</p>`));
  box.innerHTML=''; box.appendChild(c);
}
