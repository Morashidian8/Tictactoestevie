<title>پایش زمستانی گاز</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-column phone tool — sticky day header, region blocks as the working surface, bottom tab bar. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e8ecf0; --line:#d5dbe2;
  --fg:#17212b; --muted:#5b6876;
  --accent:#0b5d7a; --accent-ink:#ffffff; --flame:#e8901a;
  --ok:#1d7a46; --ok-bg:#e2f3e9; --bad:#b3261e; --bad-bg:#fbe5e3; --warn:#8a5a00; --warn-bg:#fdf0d5;
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#17212a; --sunk:#1f2c37; --line:#2c3b48;
  --fg:#e7edf2; --muted:#93a3b2; --accent:#4fb3d6; --accent-ink:#08202a; --flame:#f0a43c;
  --ok:#5fd393; --ok-bg:#163526; --bad:#ff8a80; --bad-bg:#3c1a18; --warn:#f2c46b; --warn-bg:#3a2d10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17212a; --sunk:#1f2c37; --line:#2c3b48;
  --fg:#e7edf2; --muted:#93a3b2; --accent:#4fb3d6; --accent-ink:#08202a; --flame:#f0a43c;
  --ok:#5fd393; --ok-bg:#163526; --bad:#ff8a80; --bad-bg:#3c1a18; --warn:#f2c46b; --warn-bg:#3a2d10; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl;margin:0;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:17px;font-weight:800}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.brand i{width:10px;height:14px;border-radius:50% 50% 45% 45%;background:var(--flame);display:inline-block;transform:rotate(8deg)}
.mode{font-size:11px;font-weight:500;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);margin-inline-start:auto}
.datebar{display:flex;gap:6px;align-items:center}
.datebar select{flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:40px;height:40px;font-size:18px;line-height:1}
.daymeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:2px 10px;border-radius:99px;background:var(--sunk);white-space:nowrap}
.pill.acc{background:var(--accent);color:var(--accent-ink);font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill button{border:0;background:none;padding:0;text-decoration:underline;font-size:12px;color:inherit}

/* summary strip */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px;text-align:center}
.sum b{display:block;font-size:20px;font-weight:800}
.sum span{font-size:12px;color:var(--muted)}

/* region block */
.region{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.region.full{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.region.open{border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}
.rhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--sunk)}
.rhead h3{flex:1}
.quota{font-weight:800;font-size:13px;padding:1px 9px;border-radius:99px}
.quota.full{background:var(--ok-bg);color:var(--ok)}
.quota.open{background:var(--warn-bg);color:var(--warn)}
.person{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.person:first-of-type{border-top:0}
.pmain{display:flex;gap:8px;align-items:flex-start}
.pname{font-weight:700;color:var(--fg);text-decoration:none;display:block}
.pname:hover{color:var(--accent)}
.pname .tel{font-size:12px;color:var(--accent);font-weight:500;margin-inline-start:6px}
.pinfo{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:var(--bg);padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on.went{background:var(--ok);color:#fff}
.seg button.on.absent{background:var(--bad);color:#fff}
.seg button.on.planned{background:var(--accent);color:var(--accent-ink)}
.reasons{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
.reasons input{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg);font-size:13px}
.absent .pname{text-decoration:line-through;text-decoration-color:var(--bad)}
.subtag{font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:0 6px;margin-inline-start:4px;font-weight:700}
.slot{padding:10px 12px;border-top:1px dashed var(--line);display:flex;gap:8px;align-items:center;color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13.5px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
a.btn,a.chip{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
a.btn.pri{color:var(--accent-ink)}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.inp,textarea.inp,select.inp{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--fg);width:100%}
textarea.inp{min-height:150px;line-height:1.7}
.msg{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.msg:first-child{border-top:0;padding-top:0}
.msg pre{white-space:pre-wrap;font-family:var(--font);margin:0;font-size:13px;background:var(--bg);border-radius:8px;padding:8px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--sunk);font-weight:700;position:sticky;top:0}
td.st-went{color:var(--ok);font-weight:700}
td.st-absent{color:var(--bad);font-weight:700}
.warnlist{margin:0;padding-inline-start:18px;font-size:13px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}

/* tabs */
.tabs{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{flex:1;min-width:0;border:0;background:none;padding:10px 2px 12px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:85%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{padding:14px 16px 8px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.sheet .body{overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px}
.datebtn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:700}
.datebtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h2{flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding-block:2px}
.cal .wd.fri{color:var(--bad)}
.cell{border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:60px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;color:var(--fg);position:relative}
.cell .n{font-weight:800;font-size:15px;line-height:1.3}
.cell .g{font-size:10.5px;font-weight:700;border-radius:5px;padding:0 4px;line-height:1.6;white-space:nowrap;color:#fff}
.cell .c{font-size:10px;color:var(--muted)}
.cell.off{opacity:.45;border-style:dashed}
.cell.hol .n,.cell.fri .n{color:var(--bad)}
.cell.today{outline:2px solid var(--flame);outline-offset:-1px}
.cell.sel{background:var(--accent);border-color:var(--accent)}
.cell.sel .n,.cell.sel .c{color:var(--accent-ink)}
.cell .done{position:absolute;top:1px;inset-inline-start:3px;font-size:10px;color:var(--ok);font-weight:800}
.cell.sel .done{color:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gcard.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.gcard.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.gcard .gname{display:flex;align-items:center;gap:8px;font-weight:800}
.gcard .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.gcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px}
.gcard dt{color:var(--muted)}
.gcard dd{margin:0;min-width:0}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.legend span{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.pick{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92vw,520px);padding:10px 14px;border-radius:10px;font-weight:500;font-size:14px;box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.toast.err{background:var(--bad);color:#fff}
.toast.ok{background:var(--fg);color:var(--bg)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';document.head.appendChild(s)"></script>
<script>
/* ---------- roster preload (stays null in the published page; the roster lives in the store) ---------- */
const PRELOAD = null;

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const FA_DIG = '۰۱۲۳۴۵۶۷۸۹';
const fd = v => String(v ?? '').replace(/\d/g, d => FA_DIG[d]);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fa = s => String(s ?? '').replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/[ً-ْ]/g, '').replace(/\s+/g, ' ').trim();
const toLatin = s => String(s ?? '').replace(/[۰-۹]/g, c => FA_DIG.indexOf(c)).replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c));
function normPhone(p) {
  let d = toLatin(p).replace(/\D/g, '');
  if (d.length === 12 && d.startsWith('98')) d = '0' + d.slice(2);
  if (d.length === 10 && d[0] === '9') d = '0' + d;
  return { phone: d, ok: /^09\d{9}$/.test(d) };
}
function normDate(s) {
  const m = toLatin(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}/${m[2].padStart(2, '0')}/${m[3].padStart(2, '0')}` : null;
}
const ORD = { 'اول': 1, 'یک': 1, 'دوم': 2, 'دو': 2, 'سوم': 3, 'سه': 3, 'چهارم': 4, 'چهار': 4, 'پنجم': 5, 'پنج': 5, 'ششم': 6, 'شش': 6, 'هفتم': 7, 'هفت': 7, 'هشتم': 8, 'هشت': 8, 'نهم': 9, 'نه': 9, 'دهم': 10, 'ده': 10 };
function groupNo(s) {
  const m = fa(toLatin(s)).match(/گروه\s*(\S+)/);
  if (!m) return null;
  return ORD[m[1]] || (parseInt(m[1], 10) || null);
}
const GROUP_LABEL = n => 'گروه ' + (['', 'اول', 'دوم', 'سوم', 'چهارم', 'پنجم', 'ششم', 'هفتم', 'هشتم', 'نهم', 'دهم'][n] || fd(n));
const COL_LABEL = c => c === 1 ? 'ستون اول' : 'ستون دوم';
const numOr = v => { const n = parseInt(toLatin(v), 10); return Number.isFinite(n) ? n : null; };

/* ---------- workbook parsing (positional: col1 = B..G, col2 = H..M) ---------- */
function parseWorkbook(sheets) {
  const groups = [], people = {}, warnings = [], schedule = [], drivers = [];
  const addPerson = (name, phoneRaw, home, gas, region, g, col) => {
    name = fa(name);
    if (!name) return null;
    const { phone, ok } = normPhone(phoneRaw);
    let id = ok ? phone : 'n:' + name;
    if (people[id]) {
      if (people[id].name !== name) id = id + ':' + name;
      else { warnings.push(`${name} در ${GROUP_LABEL(g)} دوبار آمده است.`); return id; }
    }
    if (!ok) warnings.push(`شماره تلفن «${name}» (${GROUP_LABEL(g)}، ${COL_LABEL(col)}) نامعتبر است: ${phone || 'خالی'}`);
    people[id] = { id, name, phone, phoneOk: ok, home: numOr(home), gas: numOr(gas), region: numOr(region), group: g, col };
    return id;
  };
  for (const [sheetName, rows] of Object.entries(sheets)) {
    if (!rows || !rows.length) continue;
    const head = (rows[0] || []).map(c => fa(c));
    const hdr2 = (rows[1] || []).map(c => fa(c));
    // schedule sheet
    if (head.some(h => /تاریخ/.test(h)) && head.some(h => /گروه/.test(h))) {
      for (const r of rows.slice(1)) {
        const date = normDate(r[1]); const g = groupNo(r[2]);
        if (date && g) schedule.push({ wd: fa(r[0]), date, group: g, note: fa(r[3]) });
      }
      continue;
    }
    // group sheet: A1 holds "گروه ..." and row 2 has the two-column header
    const g = groupNo(head[0]);
    if (!g || !(hdr2[1] || '').includes('نفر')) continue;
    const leaderCell = head.find(h => h.includes('سرگروه')) || '';
    const leader = fa(leaderCell.replace(/.*سرگروه\s*[:：]?/, ''));
    const grp = { no: g, name: GROUP_LABEL(g), leader, rows: [] };
    for (const r of rows.slice(2)) {
      if (!r) continue;
      const a = addPerson(r[1], r[2], r[3], r[4], r[5], g, 1);
      const b = addPerson(r[7], r[8], r[9], r[10], r[11], g, 2);
      if (a || b) grp.rows.push({ c1: a, c2: b });
      if (fa(r[13])) drivers.push({ name: fa(r[13]), phone: normPhone(r[14]).ok ? normPhone(r[14]).phone : '' });
    }
    groups.push(grp);
  }
  groups.sort((x, y) => x.no - y.no);
  schedule.sort((x, y) => x.date.localeCompare(y.date));
  // standard quota: most common count of each region across all group-columns
  const tallies = {};
  for (const grp of groups) for (const col of [1, 2]) {
    const c = {};
    for (const r of grp.rows) { const p = people[r['c' + col]]; if (p && p.region != null) c[p.region] = (c[p.region] || 0) + 1; }
    for (const [reg, n] of Object.entries(c)) (tallies[reg] ||= []).push(n);
  }
  const quota = {};
  for (const [reg, arr] of Object.entries(tallies)) {
    const freq = {}; arr.forEach(n => freq[n] = (freq[n] || 0) + 1);
    quota[reg] = +Object.entries(freq).sort((a, b) => b[1] - a[1] || b[0] - a[0])[0][0];
  }
  // gaps against the standard quota
  for (const grp of groups) for (const col of [1, 2]) {
    const c = {};
    for (const r of grp.rows) { const p = people[r['c' + col]]; if (p && p.region != null) c[p.region] = (c[p.region] || 0) + 1; }
    for (const [reg, q] of Object.entries(quota)) {
      const n = c[reg] || 0;
      if (n < q) warnings.push(`${grp.name}، ${COL_LABEL(col)}: منطقه ${reg} ${q - n} نفر کم دارد.`);
      if (n > q) warnings.push(`${grp.name}، ${COL_LABEL(col)}: منطقه ${reg} ${n - q} نفر اضافه دارد.`);
    }
  }
  if (!groups.length) throw new Error('هیچ برگه‌ی گروهی در فایل پیدا نشد.');
  return { groups, people, schedule, quota, warnings, drivers, importedAt: Date.now() };
}

/* ---------- column rotation ---------- */
// Each group sends one column per turn and alternates on its next turn.
// Strict alternation: first turn = column 1, next turn = column 2, and so on to the end.
// A manual day override re-anchors every later turn of that group.
function columnMap(roster, days, startCol) {
  const map = {}, last = {};
  for (const s of roster.schedule) {
    const ov = days[s.date]?.colOverride;
    let col;
    if (ov) col = ov;
    else if (last[s.group] == null) col = startCol[s.group] || 1;
    else col = 3 - last[s.group];
    map[s.date] = col;
    last[s.group] = col;
  }
  return map;
}

/* ---------- storage: claude db when available, browser storage otherwise ---------- */
const Store = {
  mode: 'local', db: null,
  async init() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try {
      const db = await Promise.race([window.claude.use('db'), new Promise(r => setTimeout(() => r(null), 10000))]);
      if (db) { this.db = db; this.mode = 'db'; }
    } catch (e) { /* stays local */ }
  },
  lsGet(k) { try { const v = localStorage.getItem('paiesh:' + k); return v ? JSON.parse(v) : null; } catch { return null; } },
  lsSet(k, v) { try { localStorage.setItem('paiesh:' + k, JSON.stringify(v)); return true; } catch { return false; } },
  async getDoc(coll, id) {
    if (this.db) { const s = await this.db.doc(`${coll}/${id}`).get(); return s.exists ? JSON.parse(s.data().json) : null; }
    return this.lsGet(`${coll}/${id}`);
  },
  async setDoc(coll, id, val) {

  },
  async listColl(coll) {

const GROUP_COLORS = ['#0b7a8f', '#c2410c', '#6d28d9', '#15803d', '#b91c1c', '#1d4ed8', '#a16207', '#be185d', '#475569', '#0f766e'];

let JMAP = null;  // 'YYYY/MM/DD' -> weekday column (0 = Saturday)
function jalaliMap() {
  if (JMAP) return JMAP;
  JMAP = {};
  const f = new Intl.DateTimeFormat('en-u-ca-persian-nu-latn', { year: 'numeric', month: '2-digit', day: '2-digit' });

/* person search: upcoming turns by the column rotation, plus history */
function turnsOf(pid) {
  const p = person(pid); if (!p) return [];
  const out = [];
  for (const sc of S.roster.schedule) {
    const rec = S.days[sc.date];
    const live = rec && rec.col === S.colMap[sc.date] && rec.group === sc.group && rec.assigns?.length;
    const a = live ? rec.assigns.find(x => x.pid === pid) : null;
    const rostered = sc.group === p.group && S.colMap[sc.date] === p.col;
    if (a) out.push({ sc, status: a.status, reason: a.reason, region: a.region, sub: a.sub, driver: a.driver, drvObj: drvOf(a) });
    else if (rostered && !live) out.push({ sc, status: 'due', region: p.region });
    else if (rostered && live) out.push({ sc, status: 'replaced', region: p.region });
  }
  return out;
}

/* reports */
function allRecords() {
  const out = [];
  for (const d of Object.values(S.days)) {
    if (!d || !d.assigns || !d.assigns.length || d.col !== S.colMap[d.date] || d.group !== schedFor(d.date)?.group) continue;
    const sc = schedFor(d.date);
    for (const a of d.assigns) {
      const p = person(a.pid) || { name: '?', phone: '' };
      out.push({ date: d.date, wd: sc?.wd || '', group: d.group, col: d.col, pid: a.pid, name: p.name, phone: p.phone, region: a.region, home: p.home, gas: p.gas, status: a.status, reason: a.reason || '', sub: a.sub, driver: drvOf(a) });
    }
  }
  return out.sort((x, y) => x.date.localeCompare(y.date) || (x.region - y.region));
}
const ST = { went: 'رفت', absent: 'نرفت', planned: 'ثبت‌نشده' };
function filteredRecords() {
  const q = fa(S.rep.q);
  return allRecords().filter(r => (!S.rep.grp || r.group === +S.rep.grp) && (!S.rep.from || r.date >= S.rep.from) && (!S.rep.to || r.date <= S.rep.to) && (!q || fa(r.name).includes(q) || r.phone.includes(toLatin(q))));
}
function personSummary(recs) {
  const m = {};
  for (const r of recs) {
    const s = m[r.pid] ||= { name: r.name, phone: r.phone, group: person(r.pid)?.group, went: 0, absent: 0, planned: 0, last: '', reasons: [] };
    s[r.status]++; if (r.status === 'went' && r.date > s.last) s.last = r.date;
    if (r.status === 'absent' && r.reason) s.reasons.push(r.reason);
  }
  return Object.values(m).sort((a, b) => b.absent - a.absent || b.went - a.went);
}
/* attendance per person within each group: turns due up to the cutoff vs went / missed */
// attendance goes to whoever actually went: own turns plus turns covered for someone else
function attendanceRows(groupNo, cutoff) {
  const row = (p, g, onlyGroup) => {
    let ts = turnsOf(p.id).filter(t => t.sc.date <= cutoff);
    if (onlyGroup) ts = ts.filter(t => t.sc.group === onlyGroup);
    const own = ts.filter(t => !t.sub);
    const wentOwn = own.filter(t => t.status === 'went').length;
    const subWent = ts.filter(t => t.sub && t.status === 'went').length;
    const absent = own.filter(t => t.status === 'absent' || t.status === 'replaced').length;
    const reasons = own.filter(t => t.status === 'absent' && t.reason).map(t => t.reason);
    return { p, g, outsider: !p.group || !!p.archived, due: own.length, went: wentOwn + subWent, wentOwn, subWent, absent, unrec: own.length - wentOwn - absent, reasons, turns: ts };
  };
  const members = Object.values(S.roster.people).filter(p => !p.archived && p.group && (!groupNo || p.group === groupNo))
    .sort((a, b) => a.group - b.group || a.col - b.col || (a.region ?? 99) - (b.region ?? 99)).map(p => row(p, p.group));
  // substitutes from outside the list (added by name and phone) who went for this group
  const outsiders = Object.values(S.roster.people).filter(p => !p.group || p.archived).flatMap(p => {
    const groups = [...new Set(turnsOf(p.id).filter(t => t.sc.date <= cutoff).map(t => t.sc.group))].filter(g => !groupNo || g === groupNo);
    return groups.map(g => row(p, g, g)).filter(r => r.turns.length);
  });
  return members.concat(outsiders);
}
const TURN_ST = { went: 'رفت', absent: 'نرفت', replaced: 'نرفت (جایگزین رفت)', due: 'ثبت‌نشده', planned: 'ثبت‌نشده' };
function turnLine(t, p) {
  const other = p && p.group && t.sc.group !== p.group ? ` · ${GROUP_LABEL(t.sc.group)}` : '';
  const cls = t.status === 'went' ? 'st-went' : (t.status === 'absent' || t.status === 'replaced') ? 'st-absent' : 'muted';
  return `<span class="${cls}">${fd(t.sc.date)} ${esc(t.sc.wd)} · منطقه ${fd(t.region ?? '-')} · ${TURN_ST[t.status]}${t.sub ? ' <span class="subtag">به‌جای دیگری</span>' : ''}${other}${t.reason ? ' · ' + esc(t.reason) : ''}</span>`;
}
function groupAttendanceHtml() {

    return `<h2>${g.name}${g.leader ? ` <span class="small muted">· ${esc(g.leader)}</span>` : ''}</h2>
      <div class="daymeta"><span class="pill">${fd(tot.due)} نوبت</span><span class="pill ok">${fd(tot.went)} رفته</span><span class="pill bad">${fd(tot.absent)} نرفته</span><span class="pill">${fd(tot.unrec)} ثبت‌نشده</span></div>
      <div class="tbl"><table class="num"><thead><tr><th>نام</th><th>ستون</th><th>منطقه</th><th>نوبت</th><th>رفته</th><th>نرفته</th><th>ثبت‌نشده</th><th>حضور</th><th>از رفته‌ها: به‌جای دیگری</th><th>تاریخ‌ها (منطقه، وضعیت)</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><button class="chip" data-act="show-turns" data-pid="${esc(r.p.id)}">${esc(r.p.name)}</button>${r.outsider ? ' <span class="subtag">خارج از فهرست</span>' : ''}</td><td>${r.p.col ? (r.p.col === 1 ? 'اول' : 'دوم') : '—'}</td><td>${fd(r.p.region ?? '-')}</td><td>${fd(r.due)}</td><td class="st-went">${fd(r.went)}</td><td class="st-absent">${fd(r.absent)}</td><td>${fd(r.unrec)}</td><td>${fd(pct(r))}</td><td>${fd(r.subWent || '')}</td><td style="white-space:normal;min-width:230px">${r.turns.map(t => turnLine(t, r.p)).join('<br>') || '—'}</td></tr>`).join('')}</tbody></table></div>`;
  }).join('');
}

const pad2 = n => String(n).padStart(2, '0');
function setPeriod(k) {
  S.rep.period = k;
  if (k === 'all') { S.rep.from = ''; S.rep.to = ''; return; }
  const t0 = todayJalali(); if (!t0) return;
  let [y, m] = t0.split('/').map(Number); let a, b;
  if (k === 'week') {
    const map = jalaliMap(); const keys = Object.keys(map); const i = keys.indexOf(t0);
    a = keys[Math.max(0, i - map[t0])]; b = keys[Math.min(keys.length - 1, i - map[t0] + 6)];
  } else {
    if (k === 'prev') { m -= 1; if (m < 1) { m = 12; y -= 1; } }
    a = `${y}/${pad2(m)}/01`; b = `${y}/${pad2(m)}/31`;
  }
  const ds = S.roster.schedule.filter(s => s.date >= a && s.date <= b);
  S.rep.from = ds.length ? ds[0].date : a; S.rep.to = ds.length ? ds.at(-1).date : b;
}
const liveDay = date => { const d = S.days[date]; return d && d.assigns?.length && d.col === S.colMap[date] && d.group === schedFor(date)?.group ? d : null; };
const dayNeed = () => regionList().reduce((t, r) => t + S.roster.quota[r], 0);
function periodStats(keyOf) {

    if (sc.date > t0) continue;
    if (S.rep.grp && sc.group !== +S.rep.grp) continue;
    const k = keyOf(sc);
    const o = out[k] ||= { key: k, days: 0, reported: 0, missing: [], went: 0, absent: 0, open: 0, need: 0 };
    o.days++; o.need += dayNeed();
    const d = liveDay(sc.date);
    if (!d) { o.missing.push(sc.date); continue; }

}

    days[date] = { ...d, assigns: d.assigns.map(a => { const dv = drvOf(a); snap(a.pid); return { ...a, drv: dv ? { name: dv.name, phone: dv.phone || '', car: dv.car || '', plate: dv.plate || '' } : null }; }) };
  }
  const requests = S.requests.filter(r => person(r.pid)?.group === g);
  requests.forEach(r => snap(r.pid));
  if (!Object.keys(days).length && !requests.length) return toast(`هنوز برای ${GROUP_LABEL(g)} چیزی ثبت نشده است.`, true);
  const payload = { app: 'paiesh', kind: 'group-report', v: 1, group: g, leader: groupOf(g)?.leader || '', sentAt: Date.now(), sentJalali: t0, days, people, requests };
  const name = `paiesh-report-g${g}-${toLatin(t0).replace(/\//g, '-')}.txt`;
  const blob = new Blob([JSON.stringify(payload)], { type: 'text/plain' });
  let shared = false;
  try {
    const file = new File([blob], name, { type: 'text/plain' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: `گزارش پایش ${GROUP_LABEL(g)}`, text: `گزارش پایش ${GROUP_LABEL(g)} تا ${fd(t0)}` });
      shared = true;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  if (!shared) await saveFile(name, blob);
  await saveSettings({ lastSent: Date.now() });
  toast(shared ? 'گزارش آماده‌ی ارسال شد.' : 'فایل گزارش ذخیره شد؛ آن را برای ادمین بفرستید.');
  render();
}
async function importReports(files) {
  if (isSup() && S.settings.supRevoked) return toast('دسترسی ناظر غیرفعال است؛ دریافت گزارش جدید ممکن نیست.', true);
  const st = { added: 0, updated: 0, same: 0, rejected: 0, bad: 0, reqN: 0 };
  const payloads = [];
  for (const f of files) {
    try { const j = JSON.parse(await f.text()); if (j.app !== 'paiesh' || j.kind !== 'group-report' || !j.group || typeof j.days !== 'object') throw 0; payloads.push(j); }
    catch { st.bad++; }
  }
  const items = [];
  for (const j of payloads) for (const [date, rec] of Object.entries(j.days)) items.push({ j, date, rec });
  items.sort((a, b) => a.date.localeCompare(b.date) || (a.j.sentAt - b.j.sentAt));
  const touched = new Set(); let rosterChanged = false;
  const ensurePerson = (j, pid) => { if (!person(pid) && j.people?.[pid]) { S.roster.people[pid] = { ...j.people[pid], archived: true, fromReport: true }; rosterChanged = true; } };
  for (const { j, date, rec } of items) {
    const sc = schedFor(date);
    if (!sc || sc.group !== +j.group || rec.group !== +j.group || !Array.isArray(rec.assigns)) { st.rejected++; continue; }
    rec.assigns.forEach(a => ensurePerson(j, a.pid));
    const ex = S.days[date];
    const sameBody = ex && ex.col === rec.col && (ex.note || '') === (rec.note || '') && JSON.stringify(ex.assigns.map(({ drv, ...x }) => x)) === JSON.stringify(rec.assigns.map(({ drv, ...x }) => x));
    if (ex && ((ex.updatedAt || 0) > (rec.updatedAt || 0) || sameBody)) { st.same++; continue; }
    const r = { ...rec, date };
    S.days[date] = r; recalc();
    if (r.col !== S.colMap[date]) { r.colOverride = r.col; recalc(); }   // keep the leader's column for this day
    ex ? st.updated++ : st.added++; touched.add(date);
  }
  let reqChanged = false; const reqs = S.requests.slice();
  for (const j of payloads) for (const r of j.requests || []) {
    ensurePerson(j, r.pid);
    const i = reqs.findIndex(x => x.id === r.id);
    if (i < 0) { reqs.push(r); reqChanged = true; st.reqN++; }
    else if ((r.updatedAt || 0) > (reqs[i].updatedAt || 0)) { reqs[i] = r; reqChanged = true; st.reqN++; }
  }
  try {
    for (const d of touched) await Store.setDoc('days', dayId(d), S.days[d]);
    if (rosterChanged) await Store.setDoc('roster', 'main', S.roster);
    if (reqChanged) await saveRequests(reqs);
    if (payloads.length) await saveSettings({ inbox: (S.settings.inbox || []).concat(payloads.map(j => ({ group: +j.group, leader: j.leader || '', sentAt: j.sentAt, importedAt: Date.now(), n: Object.keys(j.days).length }))).slice(-300) });
  } catch (e) { toast('ذخیره‌ی گزارش‌ها کامل نشد: ' + (e.message || e.code || ''), true); }
  S.lastImport = st; S.exOpen = true;
  toast(payloads.length ? `${fd(payloads.length)} گزارش وارد شد: ${fd(st.added)} روز جدید، ${fd(st.updated)} به‌روز.` : 'فایل معتبری پیدا نشد.', !payloads.length);
  render();
}

/* what changes when a new file replaces the current roster */
function diffRoster(old, nw) {
  const where = p => p.group ? `${GROUP_LABEL(p.group)}، ${COL_LABEL(p.col)}، منطقه ${p.region}` : `منطقه ${p.region}`;
  const added = [], removed = [], moved = [];
  for (const p of Object.values(nw.people)) {
    const o = old.people[p.id];
    if (!o || o.archived || o.manual) added.push(`${p.name} → ${where(p)}`);
    else if (o.group !== p.group || o.col !== p.col || o.region !== p.region) moved.push(`${p.name}: از ${where(o)} به ${where(p)}`);
  }
  for (const o of Object.values(old.people)) if (!o.archived && !o.manual && !nw.people[o.id]) removed.push(`${o.name} (${where(o)})`);
  const t0 = todayJalali() || '';
  const kept = Object.values(S.days).filter(d => d.date >= t0 && d.assigns?.length).map(d => d.date);
  return { added, removed, moved, kept };
}
function diffHtml(d) {
  const blk = (title, arr, cls) => arr.length ? `<details ${arr.length <= 8 ? 'open' : ''}><summary><span class="pill ${cls}">${title}: ${fd(arr.length)} نفر</span></summary><ul class="warnlist">${arr.map(x => `<li>${esc(fd(x))}</li>`).join('')}</ul></details>` : '';
  if (!d.added.length && !d.removed.length && !d.moved.length) return '<p class="small" style="margin:0">در نفرات تغییری نیست.</p>';
  return `<h3>تغییرات نسبت به فهرست فعلی</h3>${blk('جابه‌جا شده', d.moved, 'warn')}${blk('اضافه شده', d.added, 'ok')}${blk('حذف شده', d.removed, 'bad')}
    ${d.removed.length ? '<p class="small muted" style="margin:0">نفرات حذف‌شده در سوابق و جستجو با برچسب «خارج از فهرست فعلی» می‌مانند.</p>' : ''}

const REQ_TYPES = { day: 'جابه‌جایی روز پایش', region: 'تغییر منطقه‌ی پایش', group: 'تغییر گروه / ستون', other: 'سایر' };

function describeReq(r) {

async function saveRequests(list) {
  const prev = S.requests; S.requests = list;
  try { await Store.setDoc('settings', 'requests', { list }); return true; }
  catch (e) { S.requests = prev; toast('درخواست ذخیره نشد: ' + (e.message || e.code || ''), true); return false; }
}
function filteredRequests() {
  return S.requests.filter(r => !S.reqFilter || r.status === S.reqFilter).slice().sort((a, b) => b.createdAt - a.createdAt);
}

  const cards = list.map(r => {

function openRequest(existing, pid) {
  const r = existing ? { ...existing } : { id: 'rq' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), pid: pid || null, type: 'day', fromDate: '', toDate: '', toRegion: '', toGroup: '', toCol: '', text: '', status: 'new', answer: '', created: todayJalali() || '', createdAt: Date.now() };
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  document.body.appendChild(scrim);
  let q = '';
  const opt = (v, l, sel) => `<option value="${esc(v)}" ${String(sel) === String(v) ? 'selected' : ''}>${esc(l)}</option>`;
  const draw = () => {
    const p = r.pid && person(r.pid);
    let who;
    if (p) who = `<div class="row"><div class="grow"><b>${esc(p.name)}</b> <span class="small muted num">${fd(p.phone)}</span><div class="pinfo">${p.group ? GROUP_LABEL(p.group) + '، ' + COL_LABEL(p.col) : ''} · پایش منطقه ${fd(p.region ?? '-')}${p.home != null ? ' · سکونت منطقه ' + fd(p.home) : ''}${p.gas != null ? ' · گاز منطقه ' + fd(p.gas) : ''}</div></div>${existing ? '' : '<button class="btn ghost" data-rq="change-person">تغییر نفر</button>'}</div>`;
    else {
      const key = x => fa(x).replace(/[\s\u200c]/g, '');
      const hits = q ? Object.values(S.roster.people).filter(x => !x.archived && key(x.name).includes(key(q))).slice(0, 12) : [];
      who = `<label class="f">نام متقاضی<input id="rq-q" class="inp" value="${esc(q)}" placeholder="بخشی از نام را بنویسید…" autocomplete="off"></label>
        ${hits.map(x => `<button class="pick" style="border:0;border-bottom:1px solid var(--line);background:none;text-align:right;width:100%" data-rq-pid="${esc(x.id)}"><div class="grow"><b>${esc(x.name)}</b><div class="pinfo">${x.group ? GROUP_LABEL(x.group) + '، ' + COL_LABEL(x.col) : ''} · منطقه ${fd(x.region ?? '-')}</div></div></button>`).join('')}`;
    }

    const myTurns = p ? turnsOf(p.id).filter(t => !t.sub) : [];
    let fields = '';
    if (r.type === 'day') fields = `<div class="row"><label class="f grow">نوبت فعلی<select id="rq-from" class="inp"><option value="">— انتخاب —</option>${myTurns.map(t => opt(t.sc.date, `${fd(t.sc.date)} · ${t.sc.wd}${t.sc.date < t0 ? ' (گذشته)' : ''}`, r.fromDate)).join('')}</select></label>
        <label class="f grow">روز درخواستی<select id="rq-to" class="inp"><option value="">— نامشخص —</option>${S.roster.schedule.map(sc => opt(sc.date, `${fd(sc.date)} · ${sc.wd} · ${GROUP_LABEL(sc.group)}`, r.toDate)).join('')}</select></label></div>`;
    if (r.type === 'region') fields = `<label class="f">منطقه‌ی درخواستی<select id="rq-region" class="inp"><option value="">— انتخاب —</option>${regionList().map(g => opt(g, 'منطقه ' + fd(g), r.toRegion)).join('')}</select></label>`;
    if (r.type === 'group') fields = `<div class="row"><label class="f grow">گروه درخواستی<select id="rq-group" class="inp"><option value="">— انتخاب —</option>${(S.roster.groupNos || S.roster.groups.map(g => g.no)).map(n => opt(n, GROUP_LABEL(n), r.toGroup)).join('')}</select></label>
        <label class="f grow">ستون<select id="rq-col" class="inp"><option value="">— فرقی ندارد —</option>${opt(1, 'ستون اول', r.toCol)}${opt(2, 'ستون دوم', r.toCol)}</select></label></div>`;
    scrim.innerHTML = `<div class="sheet" role="dialog" aria-label="درخواست"><header><h2 class="grow">${existing ? 'ویرایش درخواست' : 'درخواست جدید'}</h2><button class="iconbtn" data-close aria-label="بستن">✕</button></header>
      <div class="body">${who}
      <label class="f">نوع درخواست<select id="rq-type" class="inp">${Object.entries(REQ_TYPES).map(([k, l]) => opt(k, l, r.type)).join('')}</select></label>
      ${fields}
      <label class="f">شرح / دلیل درخواست<textarea id="rq-text" class="inp" style="min-height:70px" placeholder="مثلاً: به‌دلیل شیفت کاری، پنجشنبه‌ها امکان حضور ندارد">${esc(r.text)}</textarea></label>
      <div class="row"><label class="f grow">وضعیت<select id="rq-status" class="inp">${Object.entries(REQ_ST).map(([k, [l]]) => opt(k, l, r.status)).join('')}</select></label></div>
      <label class="f">نتیجه / پاسخ (اختیاری)<input id="rq-answer" class="inp" value="${esc(r.answer)}"></label>
      <div class="row"><button class="btn pri" data-rq="save">ذخیره</button>${existing ? '<button class="btn danger" data-rq="del">حذف</button>' : ''}</div></div></div>`;
    const qi = $('#rq-q', scrim); if (qi) { qi.focus(); qi.setSelectionRange(q.length, q.length); }
  };
  const readForm = () => {
    const v = id => $('#' + id, scrim)?.value;
    if (v('rq-from') !== undefined) r.fromDate = v('rq-from');
    if (v('rq-to') !== undefined) r.toDate = v('rq-to');
    if (v('rq-region') !== undefined) r.toRegion = v('rq-region');
    if (v('rq-group') !== undefined) r.toGroup = v('rq-group');
    if (v('rq-col') !== undefined) r.toCol = v('rq-col');
    r.text = fa(v('rq-text') || ''); r.status = v('rq-status') || r.status; r.answer = fa(v('rq-answer') || '');
  };
  draw();
  scrim.addEventListener('input', e => { if (e.target.id === 'rq-q') { if (e.target.value === q) return; q = e.target.value; readForm(); draw(); } });
  scrim.addEventListener('change', e => { if (e.target.id === 'rq-type') { readForm(); r.type = e.target.value; draw(); } });
  scrim.addEventListener('click', async e => {
    if (e.target === scrim || e.target.closest('[data-close]')) return scrim.remove();
    const pick = e.target.closest('[data-rq-pid]'); if (pick) { readForm(); r.pid = pick.dataset.rqPid; return draw(); }
    const b = e.target.closest('[data-rq]'); if (!b) return;
    if (b.dataset.rq === 'change-person') { readForm(); r.pid = null; q = ''; return draw(); }
    if (b.dataset.rq === 'save') {
      readForm();
      if (!r.pid) return toast('نفر متقاضی را انتخاب کنید.', true);
      if (r.type === 'region' && !r.toRegion) return toast('منطقه‌ی درخواستی را انتخاب کنید.', true);
      if (r.type === 'group' && !r.toGroup) return toast('گروه درخواستی را انتخاب کنید.', true);
      if (r.type === 'other' && !r.text) return toast('شرح درخواست را بنویسید.', true);
      r.updatedAt = Date.now();
      if (!(await saveRequests(S.requests.filter(x => x.id !== r.id).concat(r)))) return;
      scrim.remove(); toast('درخواست ثبت شد.'); render();
    }
    if (b.dataset.rq === 'del') {
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'برای حذف دوباره بزنید'; return; }
      if (!(await saveRequests(S.requests.filter(x => x.id !== r.id)))) return;
      scrim.remove(); toast('درخواست حذف شد.'); render();
    }
  });
}

async function exportRequests() {

      'شرح درخواست': describeReq(r), 'دلیل / توضیحات': r.text, 'وضعیت': REQ_ST[r.status][0], 'نتیجه': r.answer }; });
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };

  XLSX.utils.book_append_sheet(wb, ws, 'درخواست‌ها');
  // current capacity: how many people each group/column has in each monitored region vs the daily need
  const cap = [];
  for (const g of S.roster.groups) for (const col of [1, 2]) {

    for (const reg of regionList()) {
      const here = ppl.filter(p => p.region === reg);
      cap.push({ 'گروه': g.name, 'ستون': COL_LABEL(col), 'منطقه‌ی پایش': reg, 'نیاز': S.roster.quota[reg], 'تعداد فعلی': here.length, 'کمبود / مازاد': here.length - S.roster.quota[reg], 'نفرات': here.map(p => p.name).join('، ') });
    }
  }
  const cs = XLSX.utils.json_to_sheet(cap.length ? cap : [{ 'گروه': '' }]); cs['!cols'] = [{ wch: 11 }, { wch: 9 }, { wch: 11 }, { wch: 6 }, { wch: 10 }, { wch: 12 }, { wch: 60 }];
  XLSX.utils.book_append_sheet(wb, cs, 'ظرفیت فعلی');
  // full current roster with residence, for planning moves
  const ros = Object.values(S.roster.people).filter(p => !p.archived && p.group).sort((a, b) => a.group - b.group || a.col - b.col || (a.region ?? 99) - (b.region ?? 99))
    .map(p => ({ 'گروه': GROUP_LABEL(p.group), 'ستون': COL_LABEL(p.col), 'نام و نام خانوادگی': p.name, 'شماره تماس': p.phone, 'منطقه‌ی پایش فعلی': v(p.region), 'محل سکونت (منطقه‌ی شهرداری)': v(p.home), 'منطقه‌ی گاز محل سکونت': v(p.gas), 'درخواست دارد': S.requests.some(r => r.pid === p.id) ? 'بله' : '' }));
  const rs = XLSX.utils.json_to_sheet(ros.length ? ros : [{ 'گروه': '' }]); rs['!cols'] = [{ wch: 11 }, { wch: 9 }, { wch: 22 }, { wch: 13 }, { wch: 12 }, { wch: 14 }, { wch: 12 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, rs, 'فهرست فعلی نفرات');
  await saveFile(`paiesh-requests-${toLatin(todayJalali() || '').replace(/\//g, '-')}.xlsx`, new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })]));
}

/* substitute picker */
// own-group substitute: only the other column's person for the same monitored region; outsiders are allowed
function subAllowed(p, sc, col, reg) {
  if (!p || p.archived) return false;
  if (p.group === sc.group) return p.col !== col && p.region === reg;
  return true;
}
function openPicker(reg) {
  const dv = dayView(S.date);
  const used = new Set(dv.assigns.map(a => a.pid));
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-label="انتخاب جایگزین"><header><h2 class="grow">جایگزین برای منطقه ${fd(reg)}</h2><button class="iconbtn" data-close aria-label="بستن">✕</button></header>
    <div class="body"><p class="small muted" style="margin:0">از ${GROUP_LABEL(dv.sc.group)} فقط نفر ${COL_LABEL(3 - dv.col)} که پایش منطقه ${fd(reg)} است می‌تواند جایگزین شود. برای نفر خارج از گروه، نام یا شماره‌اش را جستجو کنید یا در «نفر جدید» اضافه کنید.</p><input id="pick-q" class="inp" placeholder="جستجوی نفر خارج از گروه…"><div id="pick-list"></div>
    <details class="card"><summary><b>نفر جدید (خارج از فهرست)</b></summary><label class="f">نام<input id="new-name" class="inp"></label><label class="f">شماره تلفن<input id="new-phone" class="inp" inputmode="tel" dir="ltr"></label><button class="btn pri" id="new-add">افزودن و انتخاب</button></details></div></div>`;
  document.body.appendChild(scrim);
  const draw = () => {
    const q = fa($('#pick-q', scrim).value);
    const cands = Object.values(S.roster.people).filter(p => !used.has(p.id) && subAllowed(p, dv.sc, dv.col, reg) && (q ? (fa(p.name).includes(q) || p.phone.includes(toLatin(q))) : p.group === dv.sc.group))
      .sort((a, b) => (a.group === dv.sc.group ? 0 : 1) - (b.group === dv.sc.group ? 0 : 1) || (a.region === reg ? 0 : 1) - (b.region === reg ? 0 : 1) || (a.group || 99) - (b.group || 99));
    $('#pick-list', scrim).innerHTML = cands.length ? cands.slice(0, 80).map(p => {
      return `<div class="pick"><div class="grow"><b>${esc(p.name)}</b> <span class="small muted num">${fd(p.phone)}</span><div class="pinfo">${p.group ? GROUP_LABEL(p.group) + '، ' + COL_LABEL(p.col) : 'نفر جدید'} · پایش منطقه ${fd(p.region ?? '-')}${p.home != null ? ' · سکونت ' + fd(p.home) : ''}</div></div><button class="btn pri" data-pid="${esc(p.id)}">انتخاب</button></div>`;
    }).join('') : `<div class="empty">${q ? 'کسی پیدا نشد.' : 'نفر مجازی از این گروه برای این منطقه نمانده است.'}</div>`;
  };
  draw();
  const close = () => scrim.remove();
  scrim.addEventListener('click', async e => {
    if (e.target === scrim || e.target.closest('[data-close]')) return close();
    const b = e.target.closest('[data-pid]');
    if (b) { if (await addSub(reg, b.dataset.pid)) close(); }
    if (e.target.id === 'new-add') {
      const name = fa($('#new-name', scrim).value); const { phone, ok } = normPhone($('#new-phone', scrim).value);
      if (!name) return toast('نام را وارد کنید.', true);
      if (!ok) return toast('شماره باید ۱۱ رقم و با ۰۹ شروع شود.', true);
      if (S.roster.people[phone]) { if (await addSub(reg, phone)) close(); return; }   // known person: same rules as picking from the list
      S.roster.people[phone] = { id: phone, name, phone, phoneOk: true, home: null, gas: null, region: reg, group: null, col: null, manual: true };
      try { await Store.setDoc('roster', 'main', S.roster); } catch (err) { delete S.roster.people[phone]; return toast('نفر جدید ذخیره نشد.', true); }
      if (await addSub(reg, phone)) close();
    }
  });
  $('#pick-q', scrim).addEventListener('input', draw);
}

/* ---------- actions (quota is enforced here, before anything is stored) ---------- */
function quotaMsg(reg) {
  return `ظرفیت منطقه ${fd(reg)} پر است: این منطقه فقط ${fd(S.roster.quota[reg])} نفر نیاز دارد. اول یکی از نفرات فعلی را «نرفت» بزنید.`;
}
async function addSub(reg, pid) {
  const dv = dayView(S.date);
  if (dv.assigns.some(a => a.pid === pid)) { toast('این نفر همین حالا در این روز ثبت شده است.', true); return false; }
  const cand = person(pid);
  if (!subAllowed(cand, dv.sc, dv.col, reg)) { toast(`از ${GROUP_LABEL(dv.sc.group)} فقط نفر ${COL_LABEL(3 - dv.col)} که پایش منطقه ${fd(reg)} است جایگزین می‌شود؛ ${cand?.name || 'این نفر'} ${cand?.col === dv.col ? 'در همین ستون است' : 'پایش منطقه‌ی دیگری است'}.`, true); return false; }
  if (activeCount(dv.assigns, reg) >= S.roster.quota[reg]) { toast(quotaMsg(reg), true); return false; }
  const assigns = [...dv.assigns, { pid, region: reg, status: 'planned', reason: '', sub: true }];
  if (await saveDay(S.date, { ...dv, assigns })) { toast(`${person(pid).name} برای منطقه ${fd(reg)} ثبت شد.`); render(); return true; }
  return false;
}
async function setStatus(i, s) {
  const dv = dayView(S.date); const a = dv.assigns[i];
  let next = a.status === s ? 'planned' : s;   // tapping the active state clears it
  if (a.status === 'absent' && next !== 'absent' && activeCount(dv.assigns, a.region) >= S.roster.quota[a.region]) {
    return toast(`${person(a.pid)?.name} را نمی‌توان برگرداند. ${quotaMsg(a.region)}`, true);
  }
  const assigns = dv.assigns.map((x, j) => j === i ? { ...x, status: next, reason: next === 'absent' ? x.reason : '' } : x);
  if (await saveDay(S.date, { ...dv, assigns })) render();
}
async function setReason(i, r) {
  const dv = dayView(S.date);
  const assigns = dv.assigns.map((x, j) => j === i ? { ...x, reason: r } : x);
  if (await saveDay(S.date, { ...dv, assigns })) render();
}
async function removeSub(i) {
  const dv = dayView(S.date);
  const assigns = dv.assigns.filter((_, j) => j !== i);
  if (await saveDay(S.date, { ...dv, assigns })) render();
}
async function flipCol() {
  const dv = dayView(S.date);
  const cur = S.days[S.date] || { date: S.date, group: dv.sc.group, col: 0, assigns: [], note: '' };
  const rec = { ...cur, colOverride: cur.colOverride ? null : 3 - dv.col, updatedAt: Date.now() };
  S.days[S.date] = rec;
  recalc();
  try { await Store.setDoc('days', dayId(S.date), rec); toast(`این روز: ${COL_LABEL(S.colMap[S.date])}. نوبت‌های بعدی این گروه هم جابه‌جا شد.`); }
  catch { toast('تغییر ستون ذخیره نشد.', true); }
  render();
}

async function exportXlsx() {
  if (isSup() && S.settings.supRevoked) return toast('دسترسی ناظر غیرفعال است؛ خروجی اکسل ممکن نیست.', true);
  if (!window.XLSX) return toast('کتابخانه‌ی اکسل بارگذاری نشد.', true);
  const recs = filteredRecords();
  const log = recs.map(r => ({ 'تاریخ': r.date, 'روز': r.wd, 'گروه': GROUP_LABEL(r.group), 'ستون': COL_LABEL(r.col), 'نام': r.name, 'شماره تماس': r.phone, 'منطقه مورد پایش': r.region, 'منطقه زندگی': r.home ?? '', 'منطقه گاز': r.gas ?? '', 'وضعیت': ST[r.status], 'دلیل': r.reason, 'جایگزین': r.sub ? 'بله' : '', 'نام راننده': r.driver?.name || '', 'تلفن راننده': r.driver?.phone || '', 'خودرو': r.driver?.car || '', 'پلاک': r.driver?.plate || '' }));
  const ppl = personSummary(recs).map(s => ({ 'نام': s.name, 'شماره': s.phone, 'گروه': s.group ? GROUP_LABEL(s.group) : '', 'تعداد حضور': s.went, 'تعداد غیبت': s.absent, 'آخرین حضور': s.last, 'دلایل غیبت': s.reasons.join('، ') }));
  const wb = XLSX.utils.book_new();
  const a = XLSX.utils.json_to_sheet(log.length ? log : [{ 'تاریخ': '' }]); a['!cols'] = [{ wch: 11 }, { wch: 9 }, { wch: 11 }, { wch: 9 }, { wch: 22 }, { wch: 13 }];
  const b = XLSX.utils.json_to_sheet(ppl.length ? ppl : [{ 'نام': '' }]); b['!cols'] = [{ wch: 22 }, { wch: 13 }];
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, a, 'ریز پایش');
  XLSX.utils.book_append_sheet(wb, b, 'خلاصه نفرات');
  const cutoff = S.rep.to || todayJalali() || '';
  const att = attendanceRows(+S.rep.grp || 0, cutoff).map(r => ({ 'گروه': GROUP_LABEL(r.g), 'ستون': r.p.col ? COL_LABEL(r.p.col) : 'خارج از فهرست', 'نام': r.p.name, 'شماره': r.p.phone, 'منطقه مورد پایش': r.p.region, [`نوبت تا ${cutoff}`]: r.due, 'رفته': r.went, 'نرفته': r.absent, 'ثبت‌نشده': r.unrec, 'از رفته‌ها: به‌جای دیگری': r.subWent,
    'تاریخ‌های حضور': r.turns.filter(t => t.status === 'went').map(t => `${t.sc.date} (منطقه ${t.region ?? '-'}${t.sub ? '، جایگزین' : ''})`).join('، '),
    'تاریخ‌های غیبت': r.turns.filter(t => t.status === 'absent' || t.status === 'replaced').map(t => `${t.sc.date} (منطقه ${t.region ?? '-'}${t.reason ? '، ' + t.reason : ''})`).join('، '),
    'نوبت‌های ثبت‌نشده': r.turns.filter(t => t.status === 'due' || t.status === 'planned').map(t => t.sc.date).join('، '),
    'دلایل غیبت': r.reasons.join('، ') }));
  const c = XLSX.utils.json_to_sheet(att.length ? att : [{ 'نام': '' }]); c['!cols'] = [{ wch: 11 }, { wch: 9 }, { wch: 22 }, { wch: 13 }];
  c['!cols'] = [{ wch: 11 }, { wch: 9 }, { wch: 22 }, { wch: 13 }, { wch: 8 }, { wch: 8 }, { wch: 6 }, { wch: 6 }, { wch: 8 }, { wch: 8 }, { wch: 45 }, { wch: 45 }, { wch: 30 }, { wch: 25 }];
  XLSX.utils.book_append_sheet(wb, c, 'حضور گروه‌ها');
  const det = [];
  for (const r of attendanceRows(+S.rep.grp || 0, cutoff)) for (const t of r.turns) {
    const d = t.drvObj;
    det.push({ 'گروه': GROUP_LABEL(r.g), 'ستون': r.p.col ? COL_LABEL(r.p.col) : 'خارج از فهرست', 'نام': r.p.name, 'شماره': r.p.phone, 'تاریخ': t.sc.date, 'روز': t.sc.wd, 'منطقه پایش': t.region ?? '', 'وضعیت': TURN_ST[t.status], 'به‌جای دیگری': t.sub ? 'بله' : '', 'دلیل': t.reason || '', 'راننده': d ? d.name : '' });
  }
  const dsh = XLSX.utils.json_to_sheet(det.length ? det : [{ 'نام': '' }]); dsh['!cols'] = [{ wch: 11 }, { wch: 9 }, { wch: 22 }, { wch: 13 }, { wch: 11 }, { wch: 9 }, { wch: 9 }, { wch: 16 }, { wch: 9 }, { wch: 18 }, { wch: 16 }];
  XLSX.utils.book_append_sheet(wb, dsh, 'ریز نوبت‌های نفرات');
  // period × group summary first, so the workbook opens on the overview
  const sumRow = (o, label) => ({ [label[0]]: label[1], 'روز پایش': o.days, 'گزارش‌شده': o.reported, 'بی‌گزارش': o.missing.length, 'رفته': o.went, 'نرفته': o.absent, 'بی‌وضعیت': o.open, 'حضور (٪)': o.went + o.absent ? Math.round(100 * o.went / (o.went + o.absent)) : '', 'پوشش نیاز (٪)': o.need ? Math.round(100 * o.went / o.need) : '', 'روزهای بی‌گزارش': o.missing.join('، ') });
  const gs = periodStats(sc => sc.group).sort((x, y) => x.key - y.key).map(o => sumRow(o, ['گروه', GROUP_LABEL(o.key)]));
  const ms = periodStats(sc => sc.date.slice(0, 7) + '|' + sc.group).sort((x, y) => x.key.localeCompare(y.key)).map(o => { const [mo, g] = o.key.split('|'); return { 'ماه': `${MONTHS[+mo.slice(5, 7) - 1]} ${mo.slice(0, 4)}`, ...sumRow(o, ['گروه', GROUP_LABEL(+g)]) }; });
  const s1 = XLSX.utils.json_to_sheet(gs.length ? gs : [{ 'گروه': '' }]); s1['!cols'] = [{ wch: 11 }, { wch: 9 }, { wch: 10 }, { wch: 9 }, { wch: 7 }, { wch: 7 }, { wch: 9 }, { wch: 9 }, { wch: 12 }, { wch: 40 }];
  const s2 = XLSX.utils.json_to_sheet(ms.length ? ms : [{ 'ماه': '' }]); s2['!cols'] = [{ wch: 12 }, { wch: 11 }];
  XLSX.utils.book_append_sheet(wb, s1, 'جمع‌بندی دوره'); XLSX.utils.book_append_sheet(wb, s2, 'به تفکیک ماه');
  wb.SheetNames = ['جمع‌بندی دوره', 'به تفکیک ماه', ...wb.SheetNames.filter(n => n !== 'جمع‌بندی دوره' && n !== 'به تفکیک ماه')];
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  await saveFile(`paiesh-report-${(S.rep.from || 'all').replace(/\//g, '-')}${S.rep.to ? '_' + S.rep.to.replace(/\//g, '-') : ''}.xlsx`, new Blob([buf]));
}
async function saveFile(filename, blob) {
  let dl = null;
  if (window.claude?.use) { try { dl = await window.claude.use('downloads'); } catch { } }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast('فایل ذخیره شد.'); }
    catch (e) { if (e?.code !== 'declined') toast('ذخیره‌ی فایل انجام نشد: ' + (e?.code || ''), true); }
    return;
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function readXlsx(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const sheets = {};
  for (const n of wb.SheetNames) sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: false });
  return parseWorkbook(sheets);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act]'); if (!t || t.closest('.scrim')) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; window.scrollTo(0, 0); return render(); }
  const d = t.dataset;
  if (isSup() && SUP_BLOCKED.has(d.act)) return toast('این کار با مدیر سامانه است؛ نسخه‌ی ناظر فقط مشاهده و جمع‌بندی می‌کند.', true);
  switch (d.act) {
    case 'cal-day': return openCalendar(S.date, d => { S.date = d; render(); });
    case 'cal-msg': return openCalendar(S.msgDate, d => { S.msgDate = d; render(); });
    case 'day-prev': S.date = nextDate(S.date, -1); return render();
    case 'day-next': S.date = nextDate(S.date, 1); return render();
    case 'msg-prev': S.msgDate = nextDate(S.msgDate, -1); return render();
    case 'msg-next': S.msgDate = nextDate(S.msgDate, 1); return render();
    case 'status': return setStatus(+d.i, d.s);
    case 'reason': return setReason(+d.i, d.r);
    case 'remove': return removeSub(+d.i);
    case 'add-sub': return openPicker(+d.reg);
    case 'flip-col': return flipCol();
    case 'save-tpl': S.settings.template = $('#tpl').value; try { await Store.setDoc('settings', 'main', S.settings); toast('متن ذخیره شد.'); } catch { toast('ذخیره نشد.', true); } return render();
    case 'reset-tpl': S.settings.template = DEFAULT_TEMPLATE; try { await Store.setDoc('settings', 'main', S.settings); } catch { } return render();
    case 'copy-one': return copy(d.t, 'متن');
    case 'copy-phone': return copy(d.p, 'شماره');
    case 'copy-nums': { const dv = dayView(S.msgDate); return copy(dv.assigns.filter(a => a.status !== 'absent').map(a => person(a.pid)).filter(p => p?.phoneOk).map(p => p.phone).join('\n'), 'شماره‌ها'); }
    case 'copy-generic': return copy(genericText(dayView(S.msgDate)), 'متن عمومی');
    case 'find-pick': S.findPid = d.pid; return render();
    case 'req-new': return openRequest(null, d.pid);
    case 'req-edit': return openRequest(S.requests.find(x => x.id === d.id));
    case 'req-filter': S.reqFilter = d.v; return render();
    case 'req-copy': return copy(requestsText() || '—', 'متن درخواست‌ها');
    case 'req-export': return exportRequests();
    case 'show-turns': S.findPid = d.pid; S.findQ = person(d.pid)?.name || ''; S.tab = 'find'; window.scrollTo(0, 0); return render();
    case 'drv-new': return openDriver(null);
    case 'drv-edit': return openDriver((S.settings.drivers || []).find(x => x.id === d.id));
    case 'find-clear': S.findPid = null; S.findQ = ''; render(); $('#find-q')?.focus(); return;
    case 'rep-view': S.rep.view = d.v; return render();
    case 'rep-period': setPeriod(d.v); return render();
    case 'board-open': S.rep.grp = d.g; S.rep.view = d.v; window.scrollTo(0, 0); return render();
    case 'send-report': return sendGroupReport();
    case 'make-pack': return makeLeaderPack(+$('#pack-group').value);
    case 'make-sup': return makeSupervisorPack(fa($('#sup-name').value));
    case 'export': return exportXlsx();
    case 'startcol': S.settings.startCol = { ...S.settings.startCol, [d.g]: +d.c }; recalc(); try { await Store.setDoc('settings', 'main', S.settings); toast(`${GROUP_LABEL(+d.g)} از ${COL_LABEL(+d.c)} شروع می‌شود.`); } catch { toast('ذخیره نشد.', true); } return render();
    case 'import-cancel': S.importPreview = null; return render();
    case 'import-ok': {
      const pv = S.importPreview;
      // keep manually added people
      if (S.roster) for (const p of Object.values(S.roster.people)) if (!pv.people[p.id]) pv.people[p.id] = p.manual ? p : { ...p, archived: true };
      delete pv.diff;
      try { await Store.setDoc('roster', 'main', pv); } catch (err) { return toast('ذخیره‌ی فهرست انجام نشد: ' + (err.message || err.code || ''), true); }
      S.roster = pv; S.importPreview = null; recalc();
      const have = S.settings.drivers || []; const fresh = (pv.drivers || []).filter(x => !have.some(h => h.name === x.name || (x.phone && h.phone === x.phone)));
      if (fresh.length) await saveSettings({ drivers: have.concat(fresh.map((x, k) => ({ id: 'drv' + Date.now().toString(36) + k, car: '', plate: '', note: '', ...x }))) });
      myDefaultDates();
      toast('فهرست ذخیره شد.'); S.tab = 'day'; return render();
    }
    case 'backup': {
      const blob = new Blob([JSON.stringify({ app: 'paiesh', v: 1, roster: S.roster, days: S.days, settings: S.settings, requests: S.requests }, null, 1)], { type: 'application/json' });
      await saveFile(`paiesh-backup-${toLatin(todayJalali() || '').replace(/\//g, '-')}.json`, blob);
      await saveSettings({ lastBackup: Date.now() }); return render();
    }
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (isSup() && (t.classList.contains('drv-sel') || t.classList.contains('reason-inp') || t.id === 'day-note')) { toast('نسخه‌ی ناظر فقط مشاهده می‌کند.', true); return render(); }
  if (t.id === 'date-sel') { S.date = t.value; return render(); }
  if (t.id === 'msg-sel') { S.msgDate = t.value; return render(); }
  if (t.id === 'rep-from') { S.rep.from = t.value; S.rep.period = ''; return render(); }
  if (t.id === 'inbox-file' && t.files.length) { await importReports([...t.files]); t.value = ''; return; }
  if (t.id === 'my-group') { await saveSettings({ myGroup: t.value ? +t.value : null }); myDefaultDates(); toast(t.value ? `گروه من: ${GROUP_LABEL(+t.value)}` : 'همه‌ی گروه‌ها'); return render(); }
  if (t.id === 'rep-to') { S.rep.to = t.value; S.rep.period = ''; return render(); }
  if (t.id === 'rep-grp') { S.rep.grp = t.value; return render(); }
  if (t.classList.contains('reason-inp')) return setReason(+t.dataset.i, fa(t.value));
  if (t.classList.contains('drv-sel')) {
    const i = +t.dataset.i;
    if (t.value === '__new') { t.value = dayView(S.date).assigns[i].driver || ''; return openDriver(null, id => setDriver(i, id)); }
    return setDriver(i, t.value);
  }
  if (t.id === 'day-note') { const dv = dayView(S.date); if (await saveDay(S.date, { ...dv, note: t.value })) toast('یادداشت ذخیره شد.'); return; }
  if (t.id === 'xlsx-file' && t.files[0]) {
    try { S.importPreview = await readXlsx(t.files[0]); if (S.roster) S.importPreview.diff = diffRoster(S.roster, S.importPreview); }
    catch (err) { toast('فایل خوانده نشد: ' + (err.message || err), true); S.importPreview = null; }
    return render();
  }
  if (t.id === 'backup-file' && t.files[0]) {
    try {
      const j = JSON.parse(await t.files[0].text());
      if (j.app === 'paiesh' && j.kind === 'leader-pack') { if (isSup()) throw new Error('این گوشی نسخه‌ی ناظر است.'); await applyLeaderPack(j); t.value = ''; return render(); }
      if (j.app === 'paiesh' && j.kind === 'supervisor-pack') { await applySupervisorPack(j); t.value = ''; return render(); }
      if (isSup() && j.kind !== 'supervisor-pack') throw new Error('روی نسخه‌ی ناظر فقط فایل ناظر قابل بازگردانی است.');
      if (j.app === 'paiesh' && j.kind === 'group-report') throw new Error('این فایل گزارش سرگروه است؛ آن را در برگه‌ی «گزارش»، بخش «دریافت گزارش سرگروه‌ها» وارد کنید.');
      if (j.app !== 'paiesh' || !j.roster) throw new Error('این فایل پشتیبان پایش نیست.');
      const lg = +S.settings.lockedGroup || 0;
      if (lg && (j.roster.groups.length !== 1 || j.roster.groups[0].no !== lg)) throw new Error(`این گوشی مخصوص ${GROUP_LABEL(lg)} است و پشتیبان گروه‌های دیگر را نمی‌پذیرد.`);
      await Store.setDoc('roster', 'main', j.roster); await Store.setDoc('settings', 'main', j.settings || S.settings);
      for (const [date, rec] of Object.entries(j.days || {})) await Store.setDoc('days', dayId(date), rec);
      if (j.requests) { await Store.setDoc('settings', 'requests', { list: j.requests }); S.requests = j.requests; }
      S.roster = j.roster; S.days = j.days || {}; S.settings = { ...S.settings, ...(j.settings || {}) }; recalc();
      myDefaultDates();
      toast('پشتیبان بازگردانی شد.');
    } catch (err) { toast('بازگردانی نشد: ' + (err.message || err), true); }
    return render();
  }
});
document.addEventListener('toggle', e => { if (e.target.id === 'ex-card') S.exOpen = e.target.open; }, true);
let qT;
document.addEventListener('input', e => {
  if (e.target.id === 'find-q') { if (e.target.value === S.findQ) return; S.findQ = e.target.value; S.findPid = null; clearTimeout(qT); qT = setTimeout(() => { const pos = e.target.selectionStart; render(); const el = $('#find-q'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }, 250); }
  if (e.target.id === 'rep-q') { S.rep.q = e.target.value; clearTimeout(qT); qT = setTimeout(() => { const pos = e.target.selectionStart; render(); const el = $('#rep-q'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }, 300); }
});

/* ---------- boot ---------- */
(async function boot() {
  render();
  await Store.init();
  try {
    S.roster = await Store.getDoc('roster', 'main');
    // a copy shipped with a built-in roster adopts it on first open, and again whenever a newer list is shipped
    if (PRELOAD && (!S.roster || (S.roster.importedAt || 0) < PRELOAD.importedAt)) {
      const next = JSON.parse(JSON.stringify(PRELOAD));
      if (S.roster) for (const p of Object.values(S.roster.people)) if (!next.people[p.id]) next.people[p.id] = p.manual ? p : { ...p, archived: true };
      S.roster = next; try { await Store.setDoc('roster', 'main', next); } catch { }
    }
    const st = await Store.getDoc('settings', 'main'); if (st) S.settings = { ...S.settings, ...st };
    if ((S.settings.tplV || 1) < TPL_VERSION) { S.settings.template = DEFAULT_TEMPLATE; S.settings.tplV = TPL_VERSION; }
    S.requests = (await Store.getDoc('settings', 'requests'))?.list || [];
    const list = await Store.listColl('days');
    S.days = {}; for (const rec of Object.values(list)) if (rec?.date) S.days[rec.date] = rec;
  } catch (e) { toast('خواندن اطلاعات ناموفق بود: ' + (e.message || e.code || ''), true); }
  S.loading = false;
  if (S.roster) {
    recalc();
    myDefaultDates();
  }
  S.rep.view = S.settings.lockedGroup ? 'summary' : 'board';
  render();
  checkAccess();
})();
