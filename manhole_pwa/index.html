<style>
  @font-face{ font-family:'Vazirmatn'; font-weight:400; font-display:swap; src:url('fonts/Vazirmatn-Regular.woff2') format('woff2'); }
  @font-face{ font-family:'Vazirmatn'; font-weight:700 900; font-display:swap; src:url('fonts/Vazirmatn-Bold.woff2') format('woff2'); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:#05080F; }
  body{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px;
    font-family:'Vazirmatn',Tahoma,sans-serif; color:#EAF2FF;
    background:radial-gradient(900px 600px at 50% 30%, #0f2440 0%, #070D18 55%, #03060c 100%); }
  .lk{ width:100%; max-width:380px; text-align:center; }
  .lk-logo{ width:96px; height:96px; border-radius:50%; filter:drop-shadow(0 0 24px rgba(34,255,136,.35)) drop-shadow(0 6px 14px rgba(0,0,0,.6)); }
  .lk-t{ font-size:26px; font-weight:800; margin:14px 0 2px; }
  .lk-s{ font-size:13px; color:#8A9BB8; }
  .lk-card{ margin-top:26px; padding:20px 18px; border-radius:22px; text-align:right;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.10); box-shadow:0 24px 50px -24px rgba(0,0,0,.8); }
  .lk-lbl{ display:block; font-size:13.5px; font-weight:700; margin-bottom:8px; }
  .lk-row{ position:relative; }
  .lk-in{ width:100%; direction:ltr; text-align:left; font-size:17px; font-family:inherit; letter-spacing:.5px; color:#EAF2FF;
    padding:14px 50px 14px 14px; border-radius:14px; border:1.5px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); outline:none; }
  .lk-in:focus{ border-color:#22FF88; box-shadow:0 0 0 3px rgba(34,255,136,.16); }
  .lk-eye{ position:absolute; right:6px; top:50%; transform:translateY(-50%); width:40px; height:40px; border:none; background:none; color:#8A9BB8; cursor:pointer; font-size:18px; }
  .lk-rem{ display:flex; align-items:center; gap:9px; margin:14px 2px 4px; font-size:13px; color:#c7d3e6; cursor:pointer; user-select:none; }
  .lk-rem input{ width:18px; height:18px; accent-color:#22FF88; }
  .lk-btn{ width:100%; margin-top:14px; padding:14px; border:none; border-radius:14px; cursor:pointer; font-family:inherit; font-size:16px; font-weight:800;
    color:#04160d; background:linear-gradient(135deg,#00FF9F,#22FF88); box-shadow:0 10px 24px -8px rgba(0,255,159,.45); }
  .lk-btn:disabled{ opacity:.6; cursor:wait; }
  .lk-err{ display:none; margin-top:12px; font-size:13px; color:#ff9b9b; text-align:center; }
  .lk-busy{ display:none; align-items:center; justify-content:center; gap:10px; margin-top:12px; font-size:13px; color:#8A9BB8; }
  .lk-spin{ width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(34,255,136,.25); border-top-color:#22FF88; animation:sp .8s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .lk-note{ margin-top:18px; font-size:11.5px; color:#5f7395; line-height:1.9; }
  .lk-shake{ animation:sh .4s; } @keyframes sh{ 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }
  noscript{ display:block; margin-top:20px; color:#ff9b9b; }
</style>

  function tryOwner(pw){
    return kekFor(pw, P.pass.salt, P.pass.iter).then(function(k){
      return S.decrypt({name:'AES-GCM', iv:b(P.pass.iv)}, k, b(P.pass.ct)).then(function(raw){ return {raw:raw, user:''}; }, function(){ return null; }); });
  }
  // رمز شخصی همکاران: کلید خصوصی RSA او با رمزش باز می‌شود و کلید محتوا + نام (برای واترمارک) را می‌دهد
  function tryUsers(pw){
    var U=P.users; if(!U || !U.list || !U.list.length) return Promise.resolve(null);
    return kekFor(pw, U.salt, U.iter).then(function(k){
      var i=0;
      function next(){ if(i>=U.list.length) return null; var u=U.list[i++];
        return S.decrypt({name:'AES-GCM', iv:b(u.iv)}, k, b(u.priv)).then(function(pk){
          return S.importKey('pkcs8', pk, {name:'RSA-OAEP', hash:'SHA-256'}, false, ['decrypt']).then(function(rk){
            return S.decrypt({name:'RSA-OAEP'}, rk, b(u.ck)); }).then(function(j){
            var o=JSON.parse(new TextDecoder().decode(j)); return {raw:b(o.k), user:o.n||''}; });
        }, next); }
      return next(); });
  }
  function openApp(ck, user){
    return S.decrypt({name:'AES-GCM', iv:b(P.app.iv)}, ck, b(P.app.ct)).then(function(buf){
      window.HSE_CK = ck; window.HSE_USER = user || '';
      var html = new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
    });
  }
  function fail(msg){ $('lkBtn').disabled=false; $('lkBusy').style.display='none'; var e=$('lkErr'); e.textContent=msg; e.style.display='block';
    var c=$('lkForm'); c.classList.remove('lk-shake'); void c.offsetWidth; c.classList.add('lk-shake'); $('lkPw').select(); }
  if(!S || !window.indexedDB){ show(); fail('این مرورگر قدیمی است؛ لطفاً Chrome، Edge یا Safari به‌روز استفاده کنید.'); $('lkBtn').disabled=true; return; }
  $('lkEye').onclick=function(){ var i=$('lkPw'); i.type = i.type==='password' ? 'text' : 'password'; };
  $('lkForm').onsubmit=function(ev){
    ev.preventDefault(); var pw=$('lkPw').value; if(!pw) return;
    $('lkBtn').disabled=true; $('lkErr').style.display='none'; $('lkBusy').style.display='flex';
    var rem=$('lkRem').checked, user='';
    tryOwner(pw).then(function(r){ return r || tryUsers(pw); }).then(function(r){
      if(!r) throw 'bad'; user=r.user;
      return S.importKey('raw', r.raw, 'AES-GCM', false, ['decrypt']);
    }).then(function(ck){
      try{ if(rem) localStorage.setItem('hse-remember','1'); else localStorage.removeItem('hse-remember'); sessionStorage.setItem('hse-unlocked','1'); }catch(e){}
      return idbDo('readwrite', function(st){ st.put(user,'user'); return st.put(ck,'ck'); }).then(null, function(){}).then(function(){ return openApp(ck, user); });
    }).catch(function(e){ fail(e==='bad' ? 'رمز ورود نادرست است.' : 'باز کردن قفل ممکن نشد؛ صفحه را دوباره بارگذاری کنید.'); });
  };
  // ورود خودکار روی دستگاهی که «به خاطر سپرده» شده یا در همین نشست باز شده است.
  // اگر کلید محتوا عوض شده باشد (مثلاً دسترسی یک همکار قطع شده)، کلید قدیمی دیگر باز نمی‌کند و رمز دوباره خواسته می‌شود.
  if(flag('r') || flag('s')){
    var user='';
    idbDo('readonly', function(st){ return st.get('user'); }).then(function(u){ user=u||''; }, function(){}).then(function(){
      return idbDo('readonly', function(st){ return st.get('ck'); }); }).then(function(ck){
      if(!ck) return show();
      return openApp(ck, user).catch(function(){ return idbDo('readwrite', function(st){ return st.delete('ck'); }).then(show, show); });
    }).catch(show);
  } else {
    idbDo('readwrite', function(st){ return st.delete('ck'); }).then(show, show);
  }
})();
</script>
