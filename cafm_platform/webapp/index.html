<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<title>سامانهٔ بازرسی و نگهداری تأسیسات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef1f8;--card:#fff;--ink:#1e293b;--muted:#64748b;--line:#e7ebf3;
    --primary:#4f46e5;--primary2:#0ea5e9;--grad:linear-gradient(135deg,#4f46e5,#0ea5e9);
    --ok:#16a34a;--warn:#f59e0b;--crit:#dc2626;--unk:#94a3b8;--shadow:0 4px 16px rgba(15,23,42,.07);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:15px}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column}
  .head{background:var(--grad);color:#fff;padding:16px 18px;border-radius:0 0 22px 22px;box-shadow:0 8px 24px rgba(79,70,229,.28);position:sticky;top:0;z-index:20}
  .head .top{display:flex;align-items:center;justify-content:space-between}
  .head h1{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;min-width:0}
  .head h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .head .back{cursor:pointer;background:rgba(255,255,255,.22);padding:6px 13px;border-radius:20px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:5px;flex:none}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:800;opacity:.97;padding-bottom:10px;margin-bottom:11px;border-bottom:1px solid rgba(255,255,255,.2)}
  .brand svg{flex:none}
  .head .sub{font-size:12px;opacity:.85;margin-top:3px}
  .gear{cursor:pointer;font-size:19px;background:rgba(255,255,255,.18);width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center}
  .body{flex:1;overflow:auto;padding:14px;padding-bottom:26px}
  .card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
  .card.tap{cursor:pointer;transition:transform .08s}.card.tap:active{transform:scale(.985)}
  .row{display:flex;align-items:center;gap:11px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .muted{color:var(--muted);font-size:12.5px}.small{font-size:11.5px}.b{font-weight:700}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .chip{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;color:#fff;white-space:nowrap}
  .chipS{font-size:11px;font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap}
  .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .stat{background:#fff;border-radius:14px;padding:11px;text-align:center;box-shadow:var(--shadow)}
  .stat .n{font-size:17px;font-weight:800}.stat .t{font-size:10.5px;color:var(--muted);margin-top:2px}
  .specrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .specrow:last-child{border-bottom:none}.specrow .k{color:var(--muted)}.specrow .v{font-weight:700}
  .title{font-weight:800;font-size:15px;margin:17px 3px 9px;display:flex;align-items:center;gap:7px}
  label{display:block;font-size:13px;color:var(--muted);margin:13px 0 6px;font-weight:700}
  input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px;font-size:14.5px;color:var(--ink);font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{font-size:13px;font-weight:800;padding:9px 14px;border-radius:13px;border:1.5px solid var(--line);color:var(--muted);cursor:pointer;background:#fff}
  .opt.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
  .opt.pass.sel{background:var(--ok);border-color:var(--ok)}.opt.fail.sel{background:var(--crit);border-color:var(--crit)}
  .btn{display:block;width:100%;background:var(--grad);color:#fff;text-align:center;border:none;border-radius:15px;padding:14px;font-size:15.5px;font-weight:800;cursor:pointer;margin-top:16px;font-family:inherit;box-shadow:0 6px 16px rgba(79,70,229,.3)}
  .btn:active{transform:scale(.99)}.btn:disabled{opacity:.45;box-shadow:none}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);box-shadow:var(--shadow)}
  .btn.sm{padding:12px;font-size:14px;margin-top:0}
  .btnrow{display:flex;gap:10px}
  .fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:15}
  .fab button{background:var(--grad);color:#fff;border:none;border-radius:30px;padding:13px 26px;font-size:14.5px;font-weight:800;box-shadow:0 8px 22px rgba(79,70,229,.4);cursor:pointer;font-family:inherit}
  .center{display:flex;flex-direction:column;justify-content:center;min-height:80vh;padding:6px}
  .empty{color:var(--muted);text-align:center;padding:48px 14px;font-size:13.5px}
  .catHdr{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;margin:16px 2px 8px}
  .catLine{position:relative;padding-inline-start:13px}
  .catLine:before{content:'';position:absolute;inset-inline-start:0;top:6px;bottom:6px;width:4px;border-radius:4px;background:var(--c)}
  .check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
  .check.on{background:var(--ok);border-color:var(--ok)}
  .rel{display:flex;flex-wrap:wrap;gap:7px}
  .relC{background:#eef1f8;color:#334155;font-size:12px;font-weight:700;padding:7px 12px;border-radius:12px}
  .cal{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .calgrid .wd{font-size:11px;color:var(--muted);padding:3px 0;font-weight:700}
  .calgrid .day{padding:9px 0;border-radius:10px;cursor:pointer;font-size:13.5px}
  .calgrid .day.sel{background:var(--grad);color:#fff;font-weight:800}
  .datefield{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:13px;padding:12px;cursor:pointer}
  .pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
  .pgrid img{width:100%;height:88px;object-fit:cover;border-radius:12px;box-shadow:var(--shadow)}
  .pricepill{background:rgba(79,70,229,.1);color:var(--primary);font-weight:800;font-size:12px;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .resItem{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .resItem:last-child{border-bottom:none}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:.97}
  a{color:inherit}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display:none">

<script>
//============ helpers ============
const FA=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const fa=s=>String(s).replace(/[0-9]/g,d=>FA[+d]);
const faToEn=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const DAY=86400000,now=()=>Date.now(),uid=()=>'x'+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function money(v){if(v>=1e9){const m=v/1e9;return fa(m%1?m.toFixed(1):m)+' میلیارد تومان';}
 if(v>=1e6){const m=v/1e6;return fa(m%1?m.toFixed(1):m)+' میلیون تومان';}return fa(Math.round(v))+' تومان';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
const lightOf=st=>({OPERATIONAL:'var(--ok)',PARTIAL:'var(--warn)',CRITICAL:'var(--crit)',CLOSED:'var(--unk)'}[st]||'var(--unk)');
const CRIT_FA={CRITICAL:'بحرانی',HIGH:'بالا',MEDIUM:'متوسط',LOW:'پایین'};
const CRIT_COLOR={CRITICAL:'var(--crit)',HIGH:'#ea580c',MEDIUM:'var(--warn)',LOW:'var(--unk)'};
const critChip=c=>`<span class="chip" style="background:${CRIT_COLOR[c]||'var(--unk)'}">${CRIT_FA[c]||c}</span>`;

//============ Jalali ============
function div(a,b){return ~~(a/b)} function mod(a,b){return a-~~(a/b)*b}
function jalCal(jy){var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
 var bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,leap,leapG,march,n,i;
 for(i=1;i<bl;i+=1){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm;}
 n=jy-jp;leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
 leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
 if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return {leap:leap,gy:gy,march:march};}
function g2d(gy,gm,gd){var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d;}
function d2g(jdn){var j,i,gd,gm,gy;j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;i=div(mod(j,1461),4)*5+308;gd=div(mod(i,153),5)+1;gm=mod(div(i,153),12)+1;gy=div(j,1461)-100100+div(8-gm,6);return {gy:gy,gm:gm,gd:gd};}
function j2d(jy,jm,jd){var r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;}
function d2j(jdn){var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy),jdn1f=g2d(gy,3,r.march),jd,jm,k;k=jdn-jdn1f;
 if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return {jy:jy,jm:jm,jd:jd};}else{k-=186;}}else{jy-=1;k+=179;if(r.leap===1)k+=1;}jm=7+div(k,30);jd=mod(k,30)+1;return {jy:jy,jm:jm,jd:jd};}
const toJalaali=(gy,gm,gd)=>d2j(g2d(gy,gm,gd));
const toGregorian=(jy,jm,jd)=>d2g(j2d(jy,jm,jd));
const jLeap=jy=>jalCal(jy).leap===0;
const jMonthLen=(jy,jm)=>jm<=6?31:jm<=11?30:(jLeap(jy)?30:29);
const JMONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JWEEK=['ش','ی','د','س','چ','پ','ج'];
const todayJ=()=>{const d=new Date();return toJalaali(d.getFullYear(),d.getMonth()+1,d.getDate());};
const jStr=j=>j?fa(`${j.jy}/${String(j.jm).padStart(2,'0')}/${String(j.jd).padStart(2,'0')}`):'—';
const parseJ=s=>{const p=faToEn(s).split('/').map(Number);return {jy:p[0],jm:p[1],jd:p[2]};};

//============ catalog ============
const CATS={vt:{fa:'حمل‌ونقل عمودی',c:'#6366f1',ic:'🛗'},mech:{fa:'تأسیسات مکانیکی و تهویه',c:'#0ea5e9',ic:'⚙️'},
 elec:{fa:'تأسیسات برقی',c:'#f59e0b',ic:'⚡'},fire:{fa:'اعلام و اطفاء حریق',c:'#ef4444',ic:'🧯'},
 sec:{fa:'امنیتی و جریان ضعیف',c:'#8b5cf6',ic:'📹'},plumb:{fa:'آبرسانی و فاضلاب',c:'#14b8a6',ic:'🚿'},
 pantry:{fa:'آبدارخانه',c:'#d97706',ic:'☕'}};
const CATALOG=[
 ['elevatorP','vt','آسانسور مسافری','HIGH',2.5e9],['elevatorF','vt','آسانسور باربر','HIGH',2.2e9],
 ['escalator','vt','پله برقی','MEDIUM',1.8e9],['liftDis','vt','بالابر معلولین','MEDIUM',6e8],
 ['chiller','mech','چیلر','MEDIUM',1.5e9],['coolingTower','mech','برج خنک‌کننده','MEDIUM',5e8],
 ['ahu','mech','هواساز (AHU)','LOW',3e8],['fcu','mech','فن‌کویل (FCU)','LOW',2.5e7],
 ['boiler','mech','بویلر','HIGH',8e8],['burner','mech','مشعل','MEDIUM',1.5e8],
 ['splitAC','mech','کولر گازی (اسپلیت)','LOW',3.5e7],['evapCooler','mech','کولر آبی','LOW',1.2e7],
 ['heater','mech','بخاری گازی','LOW',4e6],['radiator','mech','شوفاژ (رادیاتور)','LOW',3e6],
 ['packageBoiler','mech','پکیج شوفاژ دیواری','LOW',2.5e7],
 ['pumpCirc','mech','پمپ سیرکولاسیون','LOW',8e7],['pumpWater','mech','پمپ آبرسانی','MEDIUM',1.2e8],
 ['waterTank','mech','مخزن آب','LOW',2e8],['exhaustFan','mech','اگزاست فن','LOW',4e7],
 ['generator','elec','دیزل ژنراتور','CRITICAL',3e9],['ups','elec','سیستم UPS','HIGH',4e8],
 ['ats','elec','ATS','MEDIUM',1.5e8],['transformer','elec','ترانسفورماتور','CRITICAL',1.2e9],
 ['mainPanel','elec','تابلو برق اصلی','HIGH',2e8],['distPanel','elec','تابلو توزیع','MEDIUM',6e7],
 ['capacitor','elec','بانک خازنی','MEDIUM',1.2e8],['battery','elec','باتری','MEDIUM',5e7],
 ['firePanel','fire','پنل اعلام حریق','CRITICAL',1.5e8],['smokeDet','fire','دتکتور دود','MEDIUM',8e5],
 ['sprinkler','fire','اسپرینکلر','HIGH',5e5],['firePump','fire','پمپ آتش‌نشانی','CRITICAL',2.5e8],
 ['fireDamper','fire','دمپر حریق','MEDIUM',4e6],['extinguisher','fire','کپسول آتش‌نشانی','MEDIUM',3e6],
 ['fireDoor','fire','درب ضد حریق','MEDIUM',1.5e7],['hydrant','fire','جعبه آتش‌نشانی','MEDIUM',8e6],
 ['cctv','sec','دوربین مداربسته','MEDIUM',5e6],['access','sec','کنترل تردد','MEDIUM',4e7],
 ['pa','sec','سیستم صوتی اعلام','LOW',8e7],['intercom','sec','آیفون تصویری','LOW',1.5e7],
 ['emgLight','sec','روشنایی اضطراری','MEDIUM',2e6],['bms','sec','سیستم مدیریت ساختمان BMS','HIGH',5e8],
 ['sumpPump','plumb','پمپ لجن‌کش (فاضلاب)','MEDIUM',9e7],['softener','plumb','سختی‌گیر','LOW',6e7],
 ['fridge','pantry','یخچال','LOW',1.5e7],['stove','pantry','اجاق گاز','LOW',8e6],
 ['foodWarmer','pantry','گرمکن غذا (بن‌ماری)','LOW',9e6],['microwave','pantry','مایکروویو','LOW',5e6],
 ['oven','pantry','فر برقی','LOW',7e6],['teaMaker','pantry','سماور/چای‌ساز','LOW',3e6],
 ['dishwasher','pantry','ماشین ظرفشویی','LOW',2e7],['waterDispenser','pantry','آبسردکن','LOW',6e6],
].map(([key,cat,name,crit,value])=>({key,cat,name,crit,value}));
const CATBY=Object.fromEntries(CATALOG.map(c=>[c.key,c]));

const BRANDS={elevatorP:['KONE','Schindler','OTIS','تیسن‌کروپ'],elevatorF:['KONE','OTIS'],escalator:['Schindler','OTIS'],
 generator:['Cummins','Caterpillar','Perkins','FG Wilson'],ups:['APC','Schneider','Eaton','Socomec'],
 transformer:['ایران‌ترانسفو','کوشکن'],chiller:['Trane','York','Carrier','LG'],ahu:['Daikin','ساران'],
 firePanel:['Zeta','Notifier','هایتک'],firePump:['Grundfos','Pentax','پمپیران'],cctv:['Hikvision','Dahua'],
 mainPanel:['اشنایدر','تابلوسازی پارس'],boiler:['ساران','مگاتُرم'],coolingTower:['Marley','آذرخش'],
 splitAC:['LG','Samsung','گری','اجنرال'],evapCooler:['آبسال','انرژی'],packageBoiler:['ایران‌رادیاتور','بوتان','بوش'],
 radiator:['ایران‌رادیاتور','بوتان'],heater:['آبسال','نیک‌کالا'],fridge:['اسنوا','امرسان','سامسونگ'],
 stove:['اخوان','استیل البرز'],microwave:['سامسونگ','ال‌جی'],dishwasher:['بوش','سامسونگ']};
const pick=(a,i)=>a[((i%a.length)+a.length)%a.length];
function specsFor(key,i,seq){const yr=fa(1385+((i+seq)%18));const B=BRANDS[key]||['متفرقه'];const brand=pick(B,i+seq);
 switch(key){
  case 'elevatorP':case 'elevatorF':return [{k:'برند',v:brand},{k:'تعداد دستگاه (لاین)',v:fa(1+((i+seq)%3))},
    {k:'ظرفیت',v:fa([6,8,10,13][(i+seq)%4])+' نفر'},{k:'سرعت',v:fa([1,1.5,1.75][i%3])+' m/s'},
    {k:'تعداد توقف',v:fa(5+((i*2)%12))+' طبقه'},{k:'سال ساخت',v:yr}];
  case 'escalator':return [{k:'برند',v:brand},{k:'تعداد دستگاه',v:fa(1+(i%2))},{k:'عرض پله',v:fa([60,80,100][i%3])+' cm'},{k:'سال ساخت',v:yr}];
  case 'generator':return [{k:'برند',v:brand},{k:'توان',v:fa([250,400,500,650,800][(i+seq)%5])+' kVA'},{k:'ولتاژ',v:'۴۰۰ ولت'},{k:'نوع سوخت',v:'گازوئیل'},{k:'سال ساخت',v:yr}];
  case 'ups':return [{k:'برند',v:brand},{k:'توان',v:fa([10,20,30,60,80][(i+seq)%5])+' kVA'},{k:'نوع',v:'آنلاین'},{k:'تعداد باتری',v:fa([16,20,32,40][i%4])},{k:'سال ساخت',v:yr}];
  case 'transformer':return [{k:'برند',v:brand},{k:'ظرفیت',v:fa([400,630,800,1000,1250][(i+seq)%5])+' kVA'},{k:'ولتاژ',v:'۲۰ به ۰٫۴ کیلوولت'},{k:'نوع',v:pick(['روغنی','خشک'],i)},{k:'سال ساخت',v:yr}];
  case 'chiller':return [{k:'برند',v:brand},{k:'ظرفیت',v:fa([60,90,120,180,240][(i+seq)%5])+' تن تبرید'},{k:'نوع',v:pick(['هواخنک','آب‌خنک'],i)},{k:'مبرد',v:pick(['R134a','R407c','R410a'],i)},{k:'سال ساخت',v:yr}];
  case 'ahu':case 'fcu':return [{k:'برند',v:brand},{k:'دبی هوا',v:fa([2000,3500,5000,8000][(i+seq)%4])+' CFM'},{k:'سال ساخت',v:yr}];

function datePicker(){const sel=DB._profJ||todayJ();
 if(!DB._calOpen)return `<div class="datefield" id="dateField"><span class="b">📅 ${jStr(sel)}</span><span class="pricepill">تغییر تاریخ</span></div>`;
 if(!DB._cal)DB._cal={jy:sel.jy,jm:sel.jm};const cal=DB._cal;const ty=todayJ().jy;const years=[];for(let y=ty-2;y<=ty+1;y++)years.push(y);
 const len=jMonthLen(cal.jy,cal.jm),g=toGregorian(cal.jy,cal.jm,1),off=(new Date(g.gy,g.gm-1,g.gd).getDay()+1)%7;
 let cells='';for(let i=0;i<off;i++)cells+='<div></div>';
 for(let d=1;d<=len;d++){const on=sel&&sel.jy===cal.jy&&sel.jm===cal.jm&&sel.jd===d;cells+=`<div class="day ${on?'sel':''}" data-day="${d}">${fa(d)}</div>`;}
 return `<div class="cal"><div class="row" style="gap:8px;margin-bottom:9px">
   <select id="calYear" style="flex:1">${years.map(y=>`<option value="${y}" ${y===cal.jy?'selected':''}>${fa(y)}</option>`).join('')}</select>
   <select id="calMonth" style="flex:1.4">${JMONTHS.map((m,k)=>`<option value="${k+1}" ${k+1===cal.jm?'selected':''}>${m}</option>`).join('')}</select></div>
   <div class="calgrid">${JWEEK.map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div></div>`;}
function captureProf(){const g=id=>document.getElementById(id);if(g('pfn'))DB._prof={fn:g('pfn').value.trim(),ln:g('pln').value.trim(),nid:g('pnid').value.trim(),pos:g('ppos').value.trim()};}

//============ screens ============
function Profile(){const editing=!!DB.user;const u=DB.user||{};
 if(!DB._prof)DB._prof={fn:u.fn||'',ln:u.ln||'',nid:u.nid||'',pos:u.pos||''};
 if(!DB._profJ)DB._profJ=u.dateJ?parseJ(u.dateJ):todayJ();
 return head(editing?'مشخصات بازرس':'ورود بازرس',editing?{back:'settings'}:{})+`<div class="body">
   ${editing?'':`<div style="text-align:center;margin:8px 0 2px">${GASLOGO.replace('width="22" height="22"','width="92" height="92"')}</div>
   <div style="text-align:center;font-weight:800;margin-top:8px">واحد مستغلات شرکت گاز استان تهران</div>
   <div style="text-align:center;color:var(--muted);font-size:13px;margin:5px 0 14px">مشخصات خود و تاریخ بازدید را یک‌بار وارد کنید</div>`}
   <div class="card">
     <label>نام</label><input id="pfn" value="${esc(DB._prof.fn)}"/>
     <label>نام خانوادگی</label><input id="pln" value="${esc(DB._prof.ln)}"/>
     <label>کد ملی (۱۰ رقم)</label><input id="pnid" inputmode="numeric" maxlength="10" value="${esc(DB._prof.nid)}"/>
     <label>سمت سازمانی</label><input id="ppos" value="${esc(DB._prof.pos)}" placeholder="مثلاً تکنسین آسانسور"/>
     <label>تاریخ بازدید</label>${datePicker()}
     <button class="btn" id="saveProf">${editing?'ذخیره':'ورود'}</button>
   </div></div>`;}

function Buildings(){return head('انتخاب ساختمان',{sub:fa(DB.buildings.length)+' ساختمان اداری',right:`<span class="gear" data-go="settings">⚙</span>`})+`<div class="body">
   <input id="bsearch" placeholder="🔍 جستجوی ساختمان"/>
   <div id="blist" style="margin-top:12px">${buildingRows(DB.buildings)}</div></div>`;}
function buildingRows(list){if(!list.length)return `<div class="empty">موردی یافت نشد</div>`;
 return list.map(b=>`<div class="card tap" data-go="building" data-id="${b.id}"><div class="row">
   <div class="ic" style="background:rgba(79,70,229,.1)">🏢</div>
   <div class="grow"><div class="b">${esc(b.name)}</div><div class="muted">${fa(bAssets(b.id).length)} تجهیز · ${fa(b.floors)} طبقه</div></div>
   <span class="dot" style="background:${lightOf(b.status)}"></span><span style="color:var(--muted);font-size:20px">‹</span></div></div>`).join('');}

function Building(){const b=DB.buildings.find(x=>x.id===params.id);if(!b)return Buildings();
 const list=bAssets(b.id),byCat={};list.forEach(a=>(byCat[a.cat]=byCat[a.cat]||[]).push(a));
 const info=[['طبقات روی زمین',fa(b.floors)],['طبقات زیرزمین',fa(b.basements)],['تعداد اتاق',fa(b.rooms||0)],['متراژ کل',fa(b.totalArea)+' م²'],['زیربنا',fa(b.builtArea)+' م²'],['سال ساخت',fa(b.year)]];
 let eq='';Object.keys(CATS).forEach(cat=>{if(!byCat[cat])return;
   eq+=`<div class="catHdr" style="color:${CATS[cat].c}">${CATS[cat].ic} ${CATS[cat].fa}</div>`+
   byCat[cat].map(a=>`<div class="card tap catLine" style="--c:${CATS[cat].c}" data-go="asset" data-id="${a.id}">
     <div class="between"><div class="grow"><div class="b">${esc(a.name)}</div><div class="muted">کد: ${fa(a.code)}</div></div>${critChip(a.crit)}</div></div>`).join('');});
 return head(b.name,{back:'buildings',sub:'کاربری: اداری'})+`<div class="body">
   <div class="card"><div class="title" style="margin-top:0">📋 مشخصات ساختمان</div>
     <div class="stats">${info.map(([t,n])=>`<div class="stat"><div class="n">${n}</div><div class="t">${t}</div></div>`).join('')}</div>
     <div class="specrow" style="margin-top:10px"><span class="k">📍 موقعیت روی نقشه</span>
       <span class="v"><span onclick="openGmap(${b.lat},${b.lng})" style="color:var(--primary);cursor:pointer">گوگل‌مپ ↗</span> &nbsp;·&nbsp; <span onclick="openNeshan(${b.lat},${b.lng})" style="color:#16a34a;cursor:pointer">مسیریاب نشان ↗</span></span></div>
     <div class="specrow"><span class="k">🏠 آدرس</span><span class="v">${esc(b.address)}</span></div>
     <div class="specrow"><span class="k">💰 ارزش تجهیزات</span><span class="v" style="color:var(--primary)">${money(bValue(b.id))}</span></div>
   </div>
   <div class="title">🔧 تجهیزات ساختمان (${fa(list.length)})</div>
   ${list.length?eq:'<div class="empty">تجهیزی ثبت نشده. با دکمهٔ پایین اضافه کنید.</div>'}
 </div><div class="fab"><button data-go="addAsset" data-id="${b.id}">＋ افزودن تجهیز</button></div>`;}

function AddAsset(){const b=DB.buildings.find(x=>x.id===params.id);if(!b)return Buildings();if(!DB._pick)DB._pick={};
 const have=new Set(bAssets(b.id).map(a=>a.key));let html='';
 Object.keys(CATS).forEach(cat=>{const items=CATALOG.filter(c=>c.cat===cat);
   html+=`<div class="catHdr" style="color:${CATS[cat].c}">${CATS[cat].ic} ${CATS[cat].fa}</div>`+
   items.map(c=>{const ex=have.has(c.key),on=DB._pick[c.key];
     return `<div class="card catLine ${ex?'':'tap'}" style="--c:${CATS[cat].c};${ex?'opacity:.5':''}" ${ex?'':`data-pick="${c.key}"`}>
       <div class="row"><div class="check ${on?'on':''}">${on?'✓':''}</div>
       <div class="grow"><div class="b small">${esc(c.name)}</div><div class="muted">${ex?'قبلاً ثبت شده':CRIT_FA[c.crit]}</div></div>
       ${ex?'<span class="chipS" style="background:#eef1f8;color:var(--muted)">موجود</span>':catChip(c.cat)}</div></div>`;}).join('');});
 const cnt=Object.values(DB._pick).filter(Boolean).length;
 return head('افزودن تجهیز',{back:'building#'+b.id,sub:'تجهیزات موجود را انتخاب کنید'})+`<div class="body">${html}</div>
   <div class="fab"><button id="addPick">افزودن ${cnt?fa(cnt)+' مورد':''}</button></div>`;}

function Asset(){const a=assetById(params.id);if(!a)return Buildings();const b=DB.buildings.find(x=>x.id===a.buildingId);
 const rel=relOf(a.key),insp=DB.inspections.filter(x=>x.assetId===a.id).sort((x,y)=>y.at-x.at);
 const specs=(a.specs||[]).concat([{k:'ارزش تجهیز',v:money(a.value)},{k:'وضعیت',v:a.status}]);
 return head(a.name,{back:'building#'+a.buildingId,sub:b.name})+`<div class="body">
   <div class="card"><div class="row"><div class="ic" style="background:${CATS[a.cat].c}1a;color:${CATS[a.cat].c}">${CATS[a.cat].ic}</div>
     <div class="grow"><div class="b" style="font-size:16px">${esc(a.name)}</div><div class="muted">کد: ${fa(a.code)}</div></div>${critChip(a.crit)}</div></div>
   <div class="card"><div class="title" style="margin-top:0">📑 مشخصات فنی</div>
     ${specs.map(s=>`<div class="specrow"><span class="k">${esc(s.k)}</span><span class="v">${esc(s.v)}</span></div>`).join('')}</div>
   ${rel.length?`<div class="card"><div class="title" style="margin-top:0">🔗 تجهیزات و قطعات مرتبط</div><div class="rel">${rel.map(r=>`<span class="relC">${esc(r)}</span>`).join('')}</div></div>`:''}
   <div class="title">🩺 چک‌لیست‌ها</div>
   <div class="btnrow"><button class="btn sm" data-go="inspect" data-id="${a.id}" data-mode="inspect">بازرسی دوره‌ای</button>
     <button class="btn sm ghost" data-go="inspect" data-id="${a.id}" data-mode="maint">سرویس و نگهداری</button></div>
   ${insp.length?`<div class="title">📜 سوابق بازرسی (${fa(insp.length)})</div>`+insp.slice(0,8).map(x=>`<div class="card tap between" data-go="report" data-id="${x.id}">
     <div class="grow"><div class="b small">${x.mode==='maint'?'سرویس و نگهداری':'بازرسی دوره‌ای'}</div><div class="muted">${esc(x.inspector.fn)} ${esc(x.inspector.ln)} · ${x.dateJ}</div></div>
     <span class="chipS" style="background:${x.fails?'#fee2e2':'#dcfce7'};color:${x.fails?'var(--crit)':'var(--ok)'}">${x.fails?fa(x.fails)+' ایراد':'سالم'}</span></div>`).join(''):''}
 </div>`;}

function Inspect(){const a=assetById(params.id);if(!a)return Buildings();const mode=DB._mode||'inspect';const u=DB.user||{};
 const modeFa=mode==='maint'?'سرویس و نگهداری':'بازرسی دوره‌ای';const items=mode==='maint'?maintOf(a.key):inspectOf(a.key);
 return head(modeFa,{back:'asset#'+a.id,sub:a.name})+`<div class="body" id="clbody">
   <div class="card"><div class="small muted">بازرس: <b style="color:var(--ink)">${esc(u.fn)} ${esc(u.ln)}</b> · سمت: ${esc(u.pos)} · تاریخ بازدید: ${esc(u.dateJ)}</div></div>
   <div class="title" style="margin-top:6px">✅ ${mode==='maint'?'چک‌لیست سرویس و نگهداری':'چک‌لیست بازرسی'}</div>
   ${items.map((it,idx)=>`<div class="card"><div class="b small" style="margin-bottom:9px">${fa(idx+1)}. ${esc(it.p)}</div>
     ${it.t==='pfn'?`<div class="opts" data-item="${idx}">${['pass','تأیید','fail','رد','na','نامربوط'].reduce((h,_,k,ar)=>k%2?h:h+`<div class="opt ${ar[k]==='pass'?'pass':ar[k]==='fail'?'fail':''} ${DB._resp[idx]===ar[k]?'sel':''}" data-val="${ar[k]}">${ar[k+1]}</div>`,'')}</div>`:''}
     ${it.t==='num'?`<input data-item="${idx}" inputmode="decimal" value="${DB._resp[idx]??''}" placeholder="${it.u||'مقدار'}"/>${it.max?`<div class="small" style="color:var(--warn);margin-top:5px">حداکثر مجاز: ${fa(it.max)}</div>`:''}`:''}
     ${it.t==='text'?`<textarea data-item="${idx}" rows="2" placeholder="بنویسید">${esc(DB._resp[idx]??'')}</textarea>`:''}
   </div>`).join('')}
   <div class="title">📷 گزارش تصویری</div>
   <div class="card"><button class="btn ghost sm" id="addPhoto">＋ افزودن عکس از دوربین/گالری</button>
     <div class="pgrid" id="pgrid">${(DB._photos||[]).map(p=>`<img src="${p}">`).join('')}</div></div>
   <button class="btn" id="submitInsp">ثبت و تولید گزارش</button></div>`;}

function Report(){const x=inspById(params.id);if(!x)return Buildings();const a=assetById(x.assetId),b=a?DB.buildings.find(y=>y.id===a.buildingId):null;
 const resFa=v=>v==='pass'?'<span style="color:var(--ok);font-weight:800">✔ تأیید</span>':v==='fail'?'<span style="color:var(--crit);font-weight:800">✘ رد</span>':v==='na'?'<span style="color:var(--unk)">نامربوط</span>':'<span class="muted">ثبت‌نشده</span>';
 const meta=[['تجهیز',a?a.name:'—'],['کد تجهیز',a?fa(a.code):'—'],['ساختمان',b?b.name:'—'],['نوع',x.mode==='maint'?'سرویس و نگهداری':'بازرسی دوره‌ای'],['بازرس',x.inspector.fn+' '+x.inspector.ln],['کد ملی',fa(x.inspector.nid)],['سمت',x.inspector.pos],['تاریخ بازدید',x.dateJ]];
 return head('گزارش بازرسی',{back:'asset#'+(a?a.id:'')})+`<div class="body">
   <div class="card" style="background:var(--grad);color:#fff"><div class="b" style="font-size:17px">گزارش ${x.mode==='maint'?'سرویس و نگهداری':'بازرسی'}</div>
     <div class="small" style="opacity:.9;margin-top:4px">${a?esc(a.name):''} — ${b?esc(b.name):''}</div>
     <div class="row" style="margin-top:10px;gap:8px"><span class="chipS" style="background:rgba(255,255,255,.25);color:#fff">${x.dateJ}</span>
       <span class="chipS" style="background:rgba(255,255,255,.25);color:#fff">${x.fails?fa(x.fails)+' ایراد':'بدون ایراد'}</span></div></div>
   <div class="card"><div class="title" style="margin-top:0">📝 گزارش متنی</div>${meta.map(([k,v])=>`<div class="specrow"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>
   <div class="card"><div class="title" style="margin-top:0">✅ نتایج چک‌لیست</div>${x.responses.map(r=>`<div class="resItem"><span class="grow">${esc(r.p)}</span><span>${r.t==='pfn'?resFa(r.v):(r.v?esc(r.v):'<span class="muted">—</span>')}</span></div>`).join('')}</div>
   ${x.photos&&x.photos.length?`<div class="card"><div class="title" style="margin-top:0">📷 گزارش تصویری (${fa(x.photos.length)})</div><div class="pgrid">${x.photos.map(p=>`<img src="${p}">`).join('')}</div></div>`:''}
   <button class="btn" id="printRep">🖨 چاپ / ذخیرهٔ PDF گزارش</button>
   <button class="btn ghost" data-go="asset" data-id="${a?a.id:''}">بازگشت به تجهیز</button>
 </div>`;}

function Settings(){const u=DB.user||{};return head('تنظیمات',{back:'buildings'})+`<div class="body">
   <div class="card row"><div class="ic" style="background:var(--grad);color:#fff">👤</div><div class="grow"><div class="b">${esc(u.fn||'')} ${esc(u.ln||'')}</div><div class="muted">${esc(u.pos||'تکنسین')}</div></div></div>
   <div class="card between"><span class="muted">کد ملی</span><span class="b">${fa(u.nid||'—')}</span></div>
   <div class="card between"><span class="muted">تاریخ بازدید</span><span class="b">${u.dateJ||'—'}</span></div>
   <div class="card between"><span class="muted">تعداد بازرسی ثبت‌شده</span><span class="b">${fa(DB.inspections.length)}</span></div>
   <button class="btn ghost" id="editProf">✏️ ویرایش مشخصات و تاریخ</button>
   <button class="btn ghost" id="resetBtn">بازنشانی داده‌های نمونه</button>
   <button class="btn" id="logoutBtn">خروج</button></div>`;}

//============ maps ============
function openNeshan(lat,lng){var web='https://neshan.org/maps/@'+lat+','+lng+',16z';
 var ua=navigator.userAgent||'';
 if(/android/i.test(ua)){
   // باز کردن اپ نشان روی گوشی برای مسیریابی؛ در صورت نبود اپ، سایت باز می‌شود
   window.location.href='intent://maps/@'+lat+','+lng+',16z#Intent;scheme=https;package=org.neshan.explore.main;S.browser_fallback_url='+encodeURIComponent(web)+';end';
 }else{window.open(web,'_blank');}}
function openGmap(lat,lng){window.open('https://www.google.com/maps?q='+lat+','+lng,'_blank');}

//============ images ============
function addPhotos(files){Array.from(files).forEach(f=>{if(!f.type.startsWith('image'))return;
 const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{
   const max=1000,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
   c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   const url=c.toDataURL('image/jpeg',0.55);DB._photos.push(url);
   const g=document.getElementById('pgrid');if(g){const im=document.createElement('img');im.src=url;g.appendChild(im);}
 };img.src=e.target.result;};r.readAsDataURL(f);});}

//============ bind ============
const val=id=>(document.getElementById(id)?.value||'').trim();
function bindGo(scope){(scope||document).querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{
  const r=e.getAttribute('data-go'),id=e.getAttribute('data-id');
  if(r.includes('#')){const[rr,pid]=r.split('#');go(rr,{id:pid});return;}
  if(r==='inspect'){DB._mode=e.getAttribute('data-mode')||'inspect';DB._resp={};DB._photos=[];}
  if(r==='addAsset')DB._pick={};
  if(r==='profile'){DB._prof=null;DB._profJ=null;DB._calOpen=false;DB._cal=null;}
  go(r,id?{id}:{});});}
function bind(){bindGo();
 // profile
 const sp=document.getElementById('saveProf');
 if(sp){['pfn','pln','pnid','ppos'].forEach(id=>{const e=document.getElementById(id);if(e)e.oninput=()=>captureProf();});
   const df=document.getElementById('dateField');if(df)df.onclick=()=>{captureProf();DB._cal={jy:DB._profJ.jy,jm:DB._profJ.jm};DB._calOpen=true;render();};
   const cy=document.getElementById('calYear');if(cy)cy.onchange=()=>{captureProf();DB._cal.jy=+cy.value;render();};
   const cm=document.getElementById('calMonth');if(cm)cm.onchange=()=>{captureProf();DB._cal.jm=+cm.value;render();};
   document.querySelectorAll('.cal [data-day]').forEach(d=>d.onclick=()=>{captureProf();DB._profJ={jy:DB._cal.jy,jm:DB._cal.jm,jd:+d.getAttribute('data-day')};DB._calOpen=false;render();});
   sp.onclick=()=>{captureProf();const p=DB._prof;if(!p.fn||!p.ln||!p.pos){toast('نام، نام خانوادگی و سمت الزامی است');return;}
     const nid=faToEn(p.nid);if(!/^\d{10}$/.test(nid)){toast('کد ملی باید ۱۰ رقم باشد');return;}
     const editing=!!DB.user;DB.user={fn:p.fn,ln:p.ln,nid:nid,pos:p.pos,dateJ:jStr(DB._profJ)};
     DB._prof=null;DB._profJ=null;DB._calOpen=false;DB._cal=null;save();toast('ذخیره شد ✅');go(editing?'settings':'buildings');};}
 // buildings search
 const bs=document.getElementById('bsearch');
 if(bs)bs.oninput=()=>{const q=bs.value.trim(),el=document.getElementById('blist');el.innerHTML=buildingRows(DB.buildings.filter(b=>b.name.includes(q)||b.code.includes(q)));bindGo(el);};
 // add asset picker
 document.querySelectorAll('[data-pick]').forEach(c=>c.onclick=()=>{const k=c.getAttribute('data-pick');DB._pick[k]=!DB._pick[k];render();});
 const ap=document.getElementById('addPick');
 if(ap)ap.onclick=()=>{const b=DB.buildings.find(x=>x.id===params.id),keys=Object.keys(DB._pick).filter(k=>DB._pick[k]);
   if(!keys.length){toast('تجهیزی انتخاب نشده');return;}let seq=bAssets(b.id).length;
   keys.forEach(key=>{const cb=CATBY[key];seq++;const i=+b.id.slice(1),code=`${b.code}-${String(seq).padStart(3,'0')}`;
     DB.assets.push({id:'a-'+b.id+'-'+key+'-'+uid(),buildingId:b.id,key,cat:cb.cat,name:cb.name,code,crit:cb.crit,value:cb.value,status:'در سرویس',specs:specsFor(key,i,seq)});});
   DB._pick={};save();toast(fa(keys.length)+' تجهیز اضافه شد ✅');go('building',{id:b.id});};
 // checklist
 document.querySelectorAll('.opts[data-item]').forEach(g=>{const idx=+g.getAttribute('data-item');
   g.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{g.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');DB._resp[idx]=o.getAttribute('data-val');});});
 document.querySelectorAll('input[data-item],textarea[data-item]').forEach(inp=>{const idx=+inp.getAttribute('data-item');inp.oninput=()=>{DB._resp[idx]=inp.value;};});
 const addP=document.getElementById('addPhoto'),pin=document.getElementById('photoInput');
 if(addP&&pin){addP.onclick=()=>pin.click();pin.onchange=()=>{addPhotos(pin.files);pin.value='';};}
 const sub=document.getElementById('submitInsp');
 if(sub)sub.onclick=()=>{const a=assetById(params.id),mode=DB._mode,items=mode==='maint'?maintOf(a.key):inspectOf(a.key),u=DB.user;
   const responses=items.map((it,idx)=>({p:it.p,t:it.t,v:DB._resp[idx]??null}));const fails=responses.filter(r=>r.v==='fail').length;
   const insp={id:uid(),assetId:a.id,mode,inspector:{fn:u.fn,ln:u.ln,nid:u.nid,pos:u.pos},dateJ:u.dateJ,responses,photos:DB._photos||[],fails,at:now()};
   DB.inspections.unshift(insp);DB._resp={};DB._photos=[];save();toast('گزارش ثبت شد ✅');go('report',{id:insp.id});};
 // report print
 const pr=document.getElementById('printRep');if(pr)pr.onclick=()=>printReport(params.id);
 // settings
 const ed=document.getElementById('editProf');if(ed)ed.onclick=()=>{DB._prof=null;DB._profJ=null;DB._calOpen=false;DB._cal=null;go('profile');};
 const lo=document.getElementById('logoutBtn');if(lo)lo.onclick=()=>{DB.user=null;save();go('profile');};
 const rs=document.getElementById('resetBtn');if(rs)rs.onclick=()=>{if(confirm('بازنشانی به داده‌های نمونه؟ سوابق پاک می‌شود.')){const u=DB.user;localStorage.removeItem(KEY);load();DB.user=u;save();go('buildings');}};}

//============ print ============
function printReport(id){const x=inspById(id);if(!x)return;const a=assetById(x.assetId),b=a?DB.buildings.find(y=>y.id===a.buildingId):null;
 const resFa=v=>v==='pass'?'<b style="color:#16a34a">تأیید</b>':v==='fail'?'<b style="color:#dc2626">رد</b>':v==='na'?'نامربوط':'—';
 const meta=[['تجهیز',a?a.name:'—'],['کد تجهیز',a?fa(a.code):'—'],['ساختمان',b?b.name:'—'],['نوع گزارش',x.mode==='maint'?'سرویس و نگهداری':'بازرسی دوره‌ای'],['بازرس',x.inspector.fn+' '+x.inspector.ln],['کد ملی',fa(x.inspector.nid)],['سمت',x.inspector.pos],['تاریخ بازدید',x.dateJ]];
 const html=`<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>گزارش بازرسی</title>
 <style>body{font-family:Tahoma,sans-serif;margin:22px;color:#1e293b}h1{font-size:19px}h3{margin:18px 0 8px}
 table{width:100%;border-collapse:collapse;font-size:13px}td{border:1px solid #e5e7eb;padding:7px}
 .imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.imgs img{width:31%;border-radius:8px;border:1px solid #e5e7eb}@media print{.np{display:none}}</style></head><body>
 <h1>گزارش ${x.mode==='maint'?'سرویس و نگهداری':'بازرسی'} تأسیسات</h1>
 <h3>مشخصات</h3><table>${meta.map(([k,v])=>`<tr><td style="background:#f3f4f6;width:35%">${k}</td><td>${esc(v)}</td></tr>`).join('')}</table>
 <h3>نتایج چک‌لیست</h3><table>${x.responses.map(r=>`<tr><td>${esc(r.p)}</td><td style="width:30%">${r.t==='pfn'?resFa(r.v):(r.v?esc(r.v):'—')}</td></tr>`).join('')}</table>
 ${x.photos&&x.photos.length?`<h3>گزارش تصویری</h3><div class="imgs">${x.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}
 <p style="margin-top:18px;font-size:12px;color:#666">سامانهٔ بازرسی و نگهداری — ${jStr(todayJ())}</p>
 <button class="np" onclick="window.print()" style="margin-top:14px;padding:10px 22px;font-size:15px;cursor:pointer">چاپ / ذخیرهٔ PDF</button></body></html>`;
 const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();}else{location.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));}}

//============ boot ============
load();go(DB.user?'buildings':'profile');
</script>
</body>
</html>
