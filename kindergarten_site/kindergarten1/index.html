    <script>
/*
 * ساعت نمایشی — داربستِ نسخهٔ نمایشی است، نه کد اپ.
 *
 * یک نسخه، دو مصرف: هم صفحهٔ منتشرشده در قاب (`artifact-shell.html`)
 * و هم اپِ نصب‌شدنی روی گوشی. هر دو یک چیز لازم دارند، پس یک‌جا
 * نوشته می‌شود؛ پیش از این فقط قاب داشتش و اپِ روی گوشی نداشت — و
 * هر کس صبحِ زود بازش می‌کرد «بیرون از ساعت کار» و شبکه‌ای خالی
 * می‌دید، یعنی دقیقاً چیزی که آمده بود ببیند را نمی‌دید.
 */
;(function () {
  var q = new URLSearchParams(location.search)
  if (q.has('live')) return

  var asked = (q.get('t') || '09:15').replace(/[۰-۹]/g, function (d) {
    return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
  })
  var parts = asked.split(':')
  var hour = Number(parts[0])
  var minute = Number(parts[1] || 0)
  if (!isFinite(hour) || hour < 0 || hour > 23) { hour = 9; minute = 15 }
  if (!isFinite(minute) || minute < 0 || minute > 59) minute = 0

  var real = new Date()
  var target = new Date(real)
  target.setHours(hour, minute, 0, 0)
  // getDay: ۰ یکشنبه … ۴ پنجشنبه، ۵ جمعه، ۶ شنبه
  var day = target.getDay()
  if (day === 5) target.setDate(target.getDate() - 2)
  else if (day === 4) target.setDate(target.getDate() - 1)

  /*
   * روزشمارِ دستی — «امروزِ» نسخهٔ نمایشی.
   *
   * چیزی که بدون آن آزمودنی نیست: گزارش ماهانه. برای دیدنِ جمع‌بندیِ
   * یک ماه باید یک ماه صبر کرد، و کسی که دارد محصول را می‌سنجد این
   * وقت را ندارد. با این شمارنده، هر بار یک روز جلو می‌رود و سی روز
   * در یک نشست طی می‌شود.
   *
   * جابه‌جاییِ تعطیلیِ بالا پیش از این اعمال می‌شود، نه بعدش: لنگرِ
   * شمارش باید ثابت بماند، وگرنه قدم‌زدن از روزِ پنجشنبه دو بار به
   * یک چهارشنبه می‌رسد.
   */
  try {
    var offset = Number(localStorage.getItem('kg.dev.dayShift') || 0)
    if (isFinite(offset) && offset !== 0) target.setDate(target.getDate() + offset)
  } catch (e) {
    /* حالت ناشناس یا دادهٔ سایت بسته — بی روزشمار ادامه بده. */
  }

  var shift = target.getTime() - real.getTime()
  if (shift === 0) return

  var Base = Date
  function Shifted(a, b, c, d, e, f, g) {
    if (!(this instanceof Shifted)) return new Base(Base.now() + shift).toString()
    switch (arguments.length) {
      case 0: return new Base(Base.now() + shift)
      case 1: return new Base(a)
      case 2: return new Base(a, b)
      case 3: return new Base(a, b, c)
      case 4: return new Base(a, b, c, d)
      case 5: return new Base(a, b, c, d, e)
      case 6: return new Base(a, b, c, d, e, f)
      default: return new Base(a, b, c, d, e, f, g)
    }
  }
  Shifted.prototype = Base.prototype
  Shifted.now = function () { return Base.now() + shift }
  Shifted.parse = Base.parse
  Shifted.UTC = Base.UTC
  window.Date = Shifted
})()
